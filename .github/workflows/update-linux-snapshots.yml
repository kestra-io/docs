name: Update Linux Visual Snapshots

on:
  workflow_dispatch:
  # 01:00 CET / 02:00 CEST: GitHub cron is UTC only, so the French wall clock
  # shifts by an hour across DST. Scheduled runs only ever fire on main.
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-linux-snapshots:
    name: Update Linux Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Playwright browsers
        id: browser_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Only chromium (desktop) and webkit (iPad, iPhone) are used by the projects
      # in playwright.config.ts. The apt deps are not cacheable, so install them either way.
      - name: Install Playwright browsers
        if: steps.browser_cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system dependencies
        if: steps.browser_cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # An explicit if: replaces the implicit success() guard, so without it a
      # failed install would write a partial cache under this key permanently.
      - name: Save Playwright browsers
        if: steps.browser_cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build the site
        run: npm run build
        env:
          NO_IMAGE_OPTIM: "true"
          DISABLE_USAL: "true"
          DISABLE_GITHUB: "true"
          PREVIEW: "true"
          NO_RANDOM_ORDER: "true"

      # --update-snapshots=changed rewrites a baseline only when the comparison
      # fails, so anything within maxDiffPixelRatio is left untouched on disk.
      - name: Regenerate Linux snapshots
        run: npm run test:visual:update

      - name: Upload Linux snapshots artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots-linux
          path: tests/visual-regression.spec.ts-snapshots/
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Check for Linux snapshot changes
        id: snapshot_changes
        run: |
          SNAPSHOT_CHANGES="$(git status --porcelain --untracked-files=all -- tests/visual-regression.spec.ts-snapshots)"
          if [[ -n "$SNAPSHOT_CHANGES" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Detected Linux snapshot changes:"
            printf '%s\n' "$SNAPSHOT_CHANGES"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No Linux snapshot changes to commit."
          fi

      # odiff compares each rewritten baseline against its committed version, so
      # this has to run before the commit step moves HEAD onto the new snapshots.
      - name: Build visual diff report
        id: diff_report
        if: steps.snapshot_changes.outputs.has_changes == 'true'
        run: npm run test:visual:report

      - name: Upload visual diff report
        if: steps.snapshot_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff-report
          path: visual-diff-report/
          retention-days: 14

      - name: Commit and push updated Linux snapshots
        if: steps.snapshot_changes.outputs.has_changes == 'true' && github.ref_name != 'main'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual-regression.spec.ts-snapshots
          git commit -m "test(visual): refresh linux snapshots"
          # The branch can move during the ~20 min run; rebase the single
          # snapshot commit rather than failing the job on a stale ref.
          for _ in 1 2 3; do
            git push origin "HEAD:${BRANCH_NAME}" && exit 0
            git pull --rebase origin "${BRANCH_NAME}"
          done
          git push origin "HEAD:${BRANCH_NAME}"

      # A GITHUB_TOKEN push creates no events, so a PR opened with it never gets
      # CI. The app is the identity that can branch, commit and open a real one.
      - name: Generate a bot token
        id: bot-token
        if: steps.snapshot_changes.outputs.has_changes == 'true' && github.ref_name == 'main'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_BOT_APP_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          owner: kestra-io
          repositories: docs

      - name: Create PR with updated Linux snapshots
        if: steps.snapshot_changes.outputs.has_changes == 'true' && github.ref_name == 'main'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.bot-token.outputs.token }}
          branch: chore/update-linux-snapshots-${{ github.run_id }}
          base: main
          commit-message: "test(visual): refresh linux snapshots"
          title: "test(visual): refresh linux snapshots"
          body: |
            Automated update of Linux visual regression snapshots.

            Only baselines that drifted past maxDiffPixelRatio are included.

            ${{ steps.diff_report.outputs.report_total }} snapshot(s) changed,
            ${{ steps.diff_report.outputs.report_diff_pixels }} differing pixels.

            Download the `visual-diff-report` artifact from
            [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            and open `index.html` for a side-by-side, slider and highlighted diff of every change.
          add-paths: |
            tests/visual-regression.spec.ts-snapshots
