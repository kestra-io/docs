name: Security scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  packages: read

jobs:
  scan:
    name: Security - Static analysis, CVE & secrets
    uses: kestra-io/actions/.github/workflows/security-scan.yml@main
    with:
      components: |
        frontend=**
      npm-lockfile: package-lock.json
    secrets:
      OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
      OTLP_HEADERS: ${{ secrets.OTLP_HEADERS }}
