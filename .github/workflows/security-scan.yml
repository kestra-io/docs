name: Security scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      metadata:
        description: 'Extra key=value pairs added to every finding, one per line'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  packages: read

jobs:
  scan:
    name: Security - Static analysis, CVE & secrets
    uses: kestra-io/actions/.github/workflows/security-scan.yml@main
    with:
      components: |
        frontend=**
      npm-lockfile: package-lock.json
      exclude-path: |
        src/contents/**
      metadata: ${{ github.event.inputs.metadata }}
    secrets:
      OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
      OTLP_HEADERS: ${{ secrets.OTLP_HEADERS }}
