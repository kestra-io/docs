name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-deploy
  cancel-in-progress: false

permissions:
  pull-requests: write

jobs:
  truncate-url-slug:
    name: Truncate URL
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.preview-url.outputs.slug }}
      url: ${{ steps.preview-url.outputs.url }}
    steps:
      # Only the composite action is needed here, so skip the full tree.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions

      - name: Resolve preview URL
        id: preview-url
        uses: ./.github/actions/preview-url

  deploy-workers:
    name: Publish to Cloudflare Workers
    # Fork PRs cannot access the Cloudflare secrets or a write-enabled token.
    # Their content is still validated by Astro Check and Lighthouse.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: truncate-url-slug
    permissions:
      pull-requests: write
      # The prune step deletes this ref's superseded incremental build caches.
      actions: write
    env:
      CF_PAGES_BRANCH: ${{ github.ref_name }}
      CF_PAGES_COMMIT_SHA: ${{ github.sha }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # Preview and production render different image URLs and gated content,
      # and Astro's own config hash does not cover either, so they cache apart.
      BUILD_VARIANT: ${{ startsWith(github.repository, 'kestra-io/') && github.ref != 'refs/heads/main' && 'preview' || 'production' }}
      NO_IMAGE_OPTIM: ${{ startsWith(github.repository, 'kestra-io/') && github.ref != 'refs/heads/main' && 'true' || 'false' }}
      PREVIEW: ${{ startsWith(github.repository, 'kestra-io/') && github.ref != 'refs/heads/main' && 'true' || 'false' }}

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
      url: ${{ needs.truncate-url-slug.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Commit history for the sitemaps' lastmod dates, without the blobs of old
      # revisions: ~9 MB in a few seconds, where fetch-depth 0 took up to 1m50s.
      # Only this commit's ancestry is read, and a complete clone has nothing to do.
      - name: Fetch commit history
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow --filter=blob:none --no-tags origin "$GITHUB_SHA" \
              || git fetch --unshallow --filter=blob:none --no-tags origin
          fi

      - name: Set up Node via nvm
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        uses: ./.github/actions/node-modules

      - name: Check usage of collection in SSR pages
        if: ${{ startsWith(github.repository, 'kestra-io/') && github.event_name == 'pull_request'}}
        run: node scripts/check-astro-content-imports.mjs

      # Holds the content store plus the incremental build manifest and its copy
      # of the pages from the last build, which is what lets pages be skipped.
      # Restore only: the save is an explicit step below, so the prune can follow it.
      - name: Restore Astro build cache
        id: astro-cache
        uses: actions/cache/restore@v6
        with:
          # A matched directory is archived whole, so the passthrough image cache is
          # removed by the last step below rather than excluded by pattern.
          path: node_modules/.astro
          key: astro-build-${{ env.BUILD_VARIANT }}-${{ github.ref_name }}-${{ github.sha }}
          # Only the same ref and variant: main builds production, PR builds
          # preview, so a cross-ref fallback would never match anything.
          restore-keys: astro-build-${{ env.BUILD_VARIANT }}-${{ github.ref_name }}-

      - name: Build
        run: npm run build

      # A page restored from a stale incremental cache links CSS/JS hashes this
      # build no longer emits. Catch it here rather than as a 404 in production.
      - name: Check for dangling /_astro/ links
        id: asset-links
        continue-on-error: true
        run: node scripts/check-dist-asset-links.mjs dist

      # A silent fallback on main would hide a recurring double build; say so in Slack.
      - name: Slack - incremental cache discarded
        if: steps.asset-links.outcome == 'failure' && github.ref == 'refs/heads/main' && env.SLACK_WEBHOOK_URL != ''
        run: |
          jq -cn --arg text ":warning: docs deploy <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}> restored stale pages from the incremental build cache and is rebuilding from scratch (withastro/astro#17974, #17993). See the step \"Check for dangling /_astro/ links\"." '{text: $text}' \
            | curl -sS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack notification failed; continuing"

      # Known upstream gaps (withastro/astro#17974, #17993) can restore a page whose
      # assets this build pruned. Rebuild from scratch and re-check, strictly this time.
      - name: Rebuild without the incremental cache
        if: steps.asset-links.outcome == 'failure'
        run: |
          echo "::warning title=Incremental cache discarded::Restored pages linked assets missing from dist (see the previous step). Rebuilt from scratch."
          rm -rf dist node_modules/.astro/incremental-build.json node_modules/.astro/dist
          npm run build
          node scripts/check-dist-asset-links.mjs dist

      - name: Deploy Worker
        id: prod-deploy
        if: ${{ startsWith(github.repository, 'kestra-io/') && github.ref == 'refs/heads/main' }}
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_ACCOUNT_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deploy Preview Worker
        id: preview-deploy
        if: ${{ startsWith(github.repository, 'kestra-io/') && github.ref != 'refs/heads/main' }}
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_ACCOUNT_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias="${{ needs.truncate-url-slug.outputs.slug }}"

      - name: Add comment to PR
        if: ${{ startsWith(github.repository, 'kestra-io/')  && github.event_name == 'pull_request'}}
        uses: kestra-io/actions/actions/comment-update@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: "☁️ Cloudflare Worker Preview Deployed!"
          template: |
            🔗 [${{ needs.truncate-url-slug.outputs.url }}](${{ needs.truncate-url-slug.outputs.url }})
            🔗 [${{ steps.preview-deploy.outputs.deployment-url }}](${{ steps.preview-deploy.outputs.deployment-url }})

      # ~700 MB of passthrough image copies that regenerate in seconds; drop them
      # before the post-job cache save so they stay out of the 10 GB quota.
      - name: Drop the passthrough image cache before it is saved
        if: always()
        run: rm -rf node_modules/.astro/assets

      # Saved here, on success, so the prune below runs after it: a failed save then
      # leaves the ref its previous entry instead of none. A re-run's key already exists.
      - name: Save Astro build cache
        uses: actions/cache/save@v6
        with:
          path: node_modules/.astro
          key: ${{ steps.astro-cache.outputs.cache-primary-key }}

      # This commit's entry is saved above, so every older entry under the same prefix
      # is superseded: one ~22 MB entry per ref instead of one per push. Fork PR tokens
      # cannot delete, hence continue-on-error.
      - name: Prune superseded incremental build caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_PREFIX: astro-build-${{ env.BUILD_VARIANT }}-${{ github.ref_name }}-
        run: |
          ids=$(gh cache list --repo "$GITHUB_REPOSITORY" --key "$KEY_PREFIX" --limit 100 --json id,key \
            --jq ".[] | select(.key != \"$KEY_PREFIX$GITHUB_SHA\") | .id")
          printf '%s\n' $ids | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
          echo "deleted $(printf '%s\n' $ids | grep -c .) superseded entries under $KEY_PREFIX"
