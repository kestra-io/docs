title: "Make Alternative: Kestra vs Make (Integromat)"
description: "Compare Kestra and Make (formerly Integromat): visual scenarios billed in credits vs. open-source YAML flows, with how each is built, migration and pricing."
competitorName: Make
category: Business Automation
shortDescription: "Visual scenarios billed in credits on Make's cloud vs. YAML flows you run on your own servers or on Kestra Cloud."

brandColor:
  color: "#7B2FBE"
  gradient: "linear-gradient(90deg, #7B2FBE, #A855F7, #6D28D9)"

intro:
  title: "Kestra vs. Make"
  description: "Make is a hosted automation platform where you chain modules from 3,500+ apps into scenarios on a visual canvas, billed in credits. Kestra is an open-source orchestrator that runs YAML flows, where scripts, data pipelines, infrastructure jobs and API calls are tasks."

choose:
  title: "Make or Kestra?"
  competitor:
    title: "Make is the better fit if"
    list:
      - "Business teams build and change their own automations, and nobody on them writes code."
      - "Your scenarios mostly move data between SaaS apps that Make already connects."
      - "Runs are short, and your credit usage stays within your plan."
  kestra:
    title: "Choose Kestra if"
    list:
      - "Your automations need code with its own libraries, or steps that run longer than a sandboxed code module allows."
      - "Workflows must run inside your own network, on servers you control."
      - "Engineers want each change reviewed in Git and promoted from dev to prod."

table:
  title: "How do Make and Kestra compare, feature by feature?"
  rows:
    - label: "Workflow definition"
      competitor: "Scenarios built in the browser, exported as JSON blueprints"
      kestra: "YAML flows, with a no-code editor and a topology view"
    - label: "Logic"
      competitor: "Routers, filters, iterators and aggregators between modules"
      kestra: "If, Switch, Parallel, Loop and subflows"
    - label: "Code"
      competitor: "Make Code app in JavaScript or Python on paid plans, up to 30 seconds per run below Enterprise"
      kestra: "Script tasks in Python, Node.js, Shell, Go and more, on your workers or task runners"
    - label: "Failure handling"
      competitor: "Retry, resume, rollback and commit error handlers, and stored incomplete executions"
      kestra: "Retries and timeouts per task, an errors block, and replay from any task"
    - label: "Version history"
      competitor: "Saved scenario versions kept for 60 days"
      kestra: "Every save is a revision; flows sync with Git"
    - label: "Integrations"
      competitor: "3,500+ apps"
      kestra: "{totalPlugins}+ plugins and an HTTP task"
    - label: "Private systems"
      competitor: "On-premise agent connects local apps (Enterprise plan)"
      kestra: "Self-hosted, so workers run inside your network"
    - label: "Access control"
      competitor: "Teams and roles; custom roles and SSO on Enterprise"
      kestra: "Namespaces; RBAC and SSO (Kestra Enterprise)"
    - label: "Pricing unit"
      competitor: "Credits, one per module operation for non-AI apps"
      kestra: "Free open source; Kestra Cloud bills task runs"
    - label: "Hosting"
      competitor: "Make's cloud"
      kestra: "Self-hosted, air-gapped (Kestra Enterprise) or Kestra Cloud"

proof:
  title: "Which teams run their integrations on Kestra?"
  stories:
    - story: modernizing-mission-critical-e-commerce-integrations-with-kestra
      industry: "E-commerce"
      stat: "90%"
      label: "lower integration costs after moving an iPaaS and AWS Lambdas to Kestra, with around 600 workflows in production."
    - story: modernizing-mission-critical-workflows-in-a-highly-regulated-environment
      industry: "Healthcare"
      stat: "400+"
      label: "pharmacies rely on integration workflows that run on-premises on Kestra."
    - story: erp-transformation-smarter-faster-fully-automated
      industry: "Retail"
      stat: "2.5 million"
      label: "executions a month across more than 2,000 ERP and supply chain workflows."

architecture:
  title: "How are Make and Kestra built?"
  competitor:
    title: "Make: modules in a scenario"
    text: "A scenario is a chain of modules built in the browser, starting with a trigger. Each module processes bundles of data and uses credits, while routers and iterators split the flow."
    list:
      - "Webhooks start scenarios instantly; schedules start the rest"
      - "Data stores keep records between runs"
      - "Incomplete executions hold failed runs for a retry"
      - "Custom JavaScript functions on the Enterprise plan"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file. Kestra validates it against each plugin's schema when you save it and shows the topology before anything runs."
    list:
      - "Webhook, schedule, event and flow triggers"
      - "Script tasks install their dependencies per task, in containers"
      - "Outputs and files stored once and passed by reference"
      - "Workers run on Kestra Cloud or your own servers"

pairs:
  - title: "How hard is it to move from Make to Kestra?"
    columns:
      - label: "Leaving Make"
        brand: competitor
        text: "Each scenario exports as a JSON blueprint with its modules, module settings and mapped values. Connections aren't part of a blueprint, so every app account has to be connected again on the other side."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Trigger modules become Kestra triggers, app modules become plugin tasks or HTTP requests, routers become If or Switch tasks and iterators become Loop tasks. Data stores become KV Store entries. While scenarios move, a Kestra HTTP task can call a scenario's webhook, so both run side by side."
  - title: "What do licensing, pricing and self-hosting look like?"
    columns:
      - label: "Make"
        brand: competitor
        text: "A hosted service billed in credits. For non-AI apps, each module operation uses one credit, and the Free plan includes 1,000 credits a month. Custom functions, the on-premise agent and SSO are on the Enterprise plan."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Make teams"

commonQuestions:
  - question: "What counts toward usage in Make and in Kestra?"
    answer: "Make counts credits. A module from a non-AI app uses one credit per operation, the Make Code app uses two credits per second of code execution, and AI modules use a varying number based on tokens. Kestra Open Source counts nothing, since you run it yourself. Kestra Cloud bills task runs, and loops, conditions and triggers aren't counted."
  - question: "Can I convert Make blueprints to Kestra flows?"
    answer: "Not automatically. Export each scenario's blueprint as JSON and hand it to the AI Copilot, or to your own coding assistant through the Kestra MCP server, to draft a flow that an engineer reviews before it runs. Reconnect each app account as a Kestra secret or plugin connection."
  - question: "Can people who don't write code still build automations?"
    answer: "Partly. Kestra's no-code editor builds a flow block by block through forms, and the AI Copilot drafts flows from a description. Someone still needs to understand tasks, inputs and outputs, so most teams let engineers own the flows. Flow inputs become forms anyone can run, and Kestra Enterprise adds Apps, which turn a flow into a self-service page."
  - question: "How does Kestra handle long or heavy steps?"
    answer: "Script tasks run in containers on your workers, and task runners can send heavy jobs to Kubernetes or your cloud account. Each task can set its own timeout. In Make, the Make Code app runs in a sandbox with a 30-second limit per run on Core, Pro and Teams, and 300 seconds on Enterprise."
  - question: "Can Kestra reach systems on our private network?"
    answer: "Yes. Self-hosted Kestra runs inside your network, so tasks reach databases, file shares and internal APIs directly. Kestra Enterprise adds worker groups, which place execution in the network zone or site that needs it."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute, and Kestra Enterprise reaches 7,000 a minute. Workers scale horizontally, and Fila runs 2.5 million executions a month on Kestra."

