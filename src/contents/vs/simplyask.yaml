architecture:
  title: "How are SimplyAsk and Kestra built?"
  competitor:
    title: "SimplyAsk: Processes inside Apps"
    text: "A Process is a sequence of steps built in the Process Editor and deployed as part of an App, next to the AI Agents and ticket types it works with. Triggers on the App start it, and an AI Agent can run it when the Process is in the Agent's Tool Pool."
    list:
      - "Conditional Branch, Loop and Trigger Process steps shape the logic"
      - "Await External Task steps pause until a person or system responds"
      - "Environments and Parameter Sets change values per environment"
      - "Activities record every Process run, Agent session and ticket"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file. Kestra validates it against each plugin's schema when you save it, and workers run its tasks on Kestra Cloud or on your own servers."
    list:
      - "If, Switch, Loop and Subflow tasks shape the logic"
      - "Pause tasks wait for a person and collect inputs on resume"
      - "Script tasks run in containers with their own dependencies"
      - "AIAgent tasks call flows and MCP servers as tools"

pairs:
  - title: "How hard is it to move from SimplyAsk to Kestra?"
    columns:
      - label: "Leaving SimplyAsk"
        brand: competitor
        text: "Each Resource can be exported from the Resources directory, and SimplyAsk's docs list moving whole Apps between environments as still to come. Processes use SimplyAsk's own step library, so each one is rebuilt step by step in the target tool."
      - label: "Moving to Kestra"
        brand: kestra
        text: "REST and SOAP steps become HTTP tasks, SQL, SSH and SFTP steps become plugin tasks, Conditional Branch and Loop become If and Loop tasks, and Trigger Process becomes a Subflow. Await steps become a Pause task, and Fallout Tickets become an errors block or Cases (Kestra Enterprise)."
  - title: "How do SimplyAsk and Kestra compare on licensing, pricing and self-hosting?"
    columns:
      - label: "SimplyAsk"
        brand: competitor
        text: "A proprietary platform with plans sized by customer conversations, quoted on request. Enterprise is the only plan that runs in your own cloud, on your premises or air-gapped."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from SimplyAsk teams"

commonQuestions:
  - question: "Is SimplyAsk the same product as Symphona?"
    answer: "Yes. SimplyAsk says the platform was previously called Symphona. It is now the SimplyAsk AI App Platform, and this comparison covers it under that name."
  - question: "Can Kestra and SimplyAsk run side by side?"
    answer: "Yes. SimplyAsk's Process API starts a Process synchronously or asynchronously, so a Kestra HTTP task can run one and wait for its result. In the other direction, an Invoke REST API step can call a Kestra Webhook trigger. Move one Process at a time and keep the rest in SimplyAsk."
  - question: "Can Kestra run AI agents and talk to customers?"
    answer: "Kestra runs AI agents inside flows with the AIAgent task, which uses only the tools you list, such as other flows or an MCP server. It has no chat widget for customers, so keep your chat product and let it call Kestra flows through a webhook or as MCP tools."
  - question: "How do people take part in a Kestra workflow?"
    answer: "A Pause task stops an execution until someone resumes it from the UI or the API, and it can ask that person for inputs that later tasks read. Apps (Kestra Enterprise) give them a form or an approval screen, and Cases (Kestra Enterprise) track an incident from a failed execution until someone resolves it."
  - question: "Can Kestra automate a web screen that has no API?"
    answer: "Yes, with a script task. A Python or Node.js task runs in a container with the libraries you install, such as Playwright or Selenium, so it can open the page, fill in the form and return the result to the flow."
  - question: "Can Kestra keep our data on our own infrastructure?"
    answer: "Yes. Kestra Open Source is free to run on your own servers or in your own cloud account, and its workers connect to internal systems from inside your network. With worker groups (Kestra Enterprise), you choose which workers run which tasks, for example one group per site or network zone."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute and Kestra Enterprise reaches 7,000, with workers that scale horizontally. Leroy Merlin runs more than 5,000 flows on Kestra."

