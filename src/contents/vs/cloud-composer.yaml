architecture:
  title: "How are Cloud Composer and Kestra built?"
  lead: "Composer gives every environment its own Airflow deployment on GKE. Kestra runs one instance where teams share infrastructure through namespaces."
  competitor:
    title: "Cloud Composer: an Airflow environment on GKE"
    text: "Each environment is a self-contained Airflow deployment on GKE. Google runs its schedulers, triggerers, DAG processors, workers and Cloud SQL database in a tenant project, and the environment's bucket in your project holds the DAGs."
    list:
      - "DAG files sync from the bucket's /dags folder"
      - "DAG processors turn each file into DAG objects"
      - "Workers autoscale, and their resources are billed in DCU-hours"
      - "Logs and plugins live in the same bucket"
  kestra:
    title: "Kestra: one instance, workers where you need them"
    text: "Flows are YAML documents that Kestra reads without importing code. The executor plans each run, and workers can sit in any network that reaches the controller over gRPC."
    list:
      - "Saving a flow validates every task's properties"
      - "Realtime triggers react to Pub/Sub messages as they arrive"
      - "Each script task brings its own container and dependencies"
      - "Task runners send heavy jobs to Google Batch or Cloud Run"

compare:
  title: "What does the same BigQuery export look like in each?"
  lead: "The same job in both: a weekly BigQuery aggregation into a reporting table, an export to Cloud Storage as CSV, and one retry after ten minutes."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Composer DAG"
    file: "weekly_revenue_export.py"
    lang: python
    code: |
      from datetime import datetime, timedelta

      from airflow import DAG
      from airflow.providers.google.cloud.operators.bigquery import BigQueryInsertJobOperator
      from airflow.providers.google.cloud.transfers.bigquery_to_gcs import BigQueryToGCSOperator

      with DAG(
          dag_id="weekly_revenue_export",
          schedule="0 7 * * 1",
          start_date=datetime(2026, 1, 1),
          catchup=False,
          default_args={"retries": 1, "retry_delay": timedelta(minutes=10)},
      ):
          aggregate = BigQueryInsertJobOperator(
              task_id="aggregate",
              configuration={
                  "query": {
                      "query": "{% include 'sql/weekly_revenue.sql' %}",
                      "useLegacySql": False,
                      "destinationTable": {
                          "projectId": "example-project",
                          "datasetId": "reporting",
                          "tableId": "weekly_revenue",
                      },
                      "writeDisposition": "WRITE_TRUNCATE",
                  }
              },
          )

          export = BigQueryToGCSOperator(
              task_id="export",
              source_project_dataset_table="example-project.reporting.weekly_revenue",
              destination_cloud_storage_uris=["gs://example-exports/weekly_revenue/*.csv"],
              export_format="CSV",
          )

          aggregate >> export
  kestra:
    code: |
      id: weekly_revenue_export
      namespace: company.finance

      retry:
        type: constant
        interval: PT10M
        maxAttempts: 2

      tasks:
        - id: aggregate
          type: io.kestra.plugin.gcp.bigquery.Query
          projectId: example-project
          sql: "{{ read('sql/weekly_revenue.sql') }}"
          destinationTable: example-project.reporting.weekly_revenue
          writeDisposition: WRITE_TRUNCATE

        - id: export
          type: io.kestra.plugin.gcp.bigquery.ExtractToGcs
          projectId: example-project
          sourceTable: example-project.reporting.weekly_revenue
          destinationUris:
            - gs://example-exports/weekly_revenue/*.csv
          format: CSV

      triggers:
        - id: weekly
          type: io.kestra.plugin.core.trigger.Schedule
          cron: "0 7 * * 1"

pairs:
  - title: "How hard is it to move from Cloud Composer to Kestra?"
    columns:
      - label: "Leaving Cloud Composer"
        brand: competitor
        text: "Composer DAGs are standard Airflow built on the Google provider, so task logic first has to come out of operators, XCom and the task context. Settings held by the environment move too, such as custom PyPI packages, Airflow configuration overrides, connections and the roles granted to its service account."
      - label: "Moving to Kestra"
        brand: kestra
        text: "BigQuery, Cloud Storage, Pub/Sub and Dataproc calls become tasks from Kestra's GCP plugin, and Python callables run in script tasks. While DAGs move in waves, a Kestra flow can start the ones still on Composer through the Airflow REST API. The <a href='/resources/migration/airflow'>Airflow migration guide</a> lists what maps one to one and what needs a decision."
  - title: "What do licensing, pricing and self-hosting look like?"
    lead: "Composer is a Google Cloud service metered on provisioned resources. Kestra's open-source edition costs nothing to run on your own infrastructure."
    columns:
      - label: "Cloud Composer"
        brand: competitor
        text: "A Google Cloud service built on open-source Airflow. Billing counts DCU-hours for workers, schedulers, DAG processors, triggerers and the web server, a DCU charge for the environment size, Cloud SQL storage and network traffic, for as long as the environment runs. It runs only on Google Cloud."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Cloud Composer teams"

commonQuestions:
  - question: "Is Cloud Composer still the product's name?"
    answer: "Google now names it Managed Service for Apache Airflow, previously known as Cloud Composer, and calls its environments Managed Airflow. The gcloud commands and API still use composer. Everything on this page applies under either name."
  - question: "Can Kestra and Composer run side by side?"
    answer: "Yes. The Kestra Airflow plugin's TriggerDagRun task starts a DAG through the Airflow REST API, which Composer exposes for each environment, and can wait for the run to end. Teams start new workflows in Kestra and move existing DAGs over in batches."
  - question: "Can we run Kestra on Google Cloud?"
    answer: "Yes. Kestra has installation guides for <a href='/docs/installation/kubernetes-gcp-gke'>GKE</a> and <a href='/docs/installation/gcp-vm'>Compute Engine</a>, and task runners can send scripts to Google Batch or Cloud Run. Kestra Enterprise reads secrets from Google Secret Manager."
  - question: "Which Google Cloud services does Kestra connect to?"
    answer: "The GCP plugin covers BigQuery, Cloud Storage, Pub/Sub, Dataproc, Dataflow, Spanner and more, out of {totalPlugins}+ plugins in total. Cloud Storage, Pub/Sub and BigQuery have triggers, and Pub/Sub also has a realtime trigger that starts a flow for each message."
  - question: "How does local development compare?"
    answer: "Google's Composer Local Development CLI runs an Airflow image that matches an environment's version in Docker or Podman, for testing only. It doesn't copy the environment's DAGs, connections or variables, and its calls to Google Cloud use your own gcloud account. Kestra runs the same image locally and in production, and flows move between them as YAML."
  - question: "What happens during a Composer upgrade?"
    answer: "An in-place Airflow upgrade redeploys the environment's components on the new version. Running tasks are terminated and retried according to each DAG's retry settings. A Kestra upgrade is a new image that you test in staging and roll out on your own schedule."
  - question: "How far does Kestra scale?"
    answer: "The <a href='/docs/performance/benchmark'>Kestra benchmark</a> records 4,000 executions a minute on the open-source edition with Postgres and 7,000 a minute on Kestra Enterprise. Leroy Merlin France runs more than 5,000 flows on GCP with Kestra."

