architecture:
  title: "How are HP Operations Orchestration and Kestra built?"
  lead: "Both describe workflows in YAML. OO deploys them to Central in content packs, and Kestra stores each flow as its own revisioned file."
  competitor:
    title: "Operations Orchestration: Central, RAS and content packs"
    text: "Flows are written in CloudSlang in Workflow Designer, packaged into content packs and deployed to OO Central, which runs them. Remote Action Servers execute operations inside your firewall or in remote data centers."
    list:
      - "A CloudSlang flow is a YAML file of steps and navigation rules"
      - "Workflow Designer keeps project source in Git"
      - "Desktop Studio builds native OO flows graphically"
      - "Central schedules flows and manages deployed content packs"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file of tasks, triggers and error handling. The executor tracks state in Kestra's database and hands each task to a worker, which runs a script, opens an SSH session or calls an API."
    list:
      - "Each plugin task is checked against its schema on save"
      - "Script tasks install their dependencies per task"
      - "Triggers live in the flow next to the tasks they start"
      - "Every save creates a revision you can diff and roll back"

compare:
  title: "What does the same runbook look like in each?"
  lead: "The same runbook in both: restart a service over SSH, check that it is active, and email the team if it fails."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "CloudSlang flow"
    file: "restart_service.sl"
    lang: yaml
    code: |
      namespace: ops.runbooks

      imports:
        ssh: io.cloudslang.base.ssh
        mail: io.cloudslang.base.mail

      flow:
        name: restart_service
        inputs:
          - host
          - service
          - username
          - password:
              sensitive: true
        workflow:
          - restart_service:
              do:
                ssh.ssh_command:
                  - host
                  - username
                  - password
                  - command: ${'sudo systemctl restart ' + service + ' && systemctl is-active ' + service}
              navigate:
                - SUCCESS: SUCCESS
                - FAILURE: on_failure
          - on_failure:
              - send_alert:
                  do:
                    mail.send_mail:
                      - hostname: smtp.example.com
                      - port: '25'
                      - from: oo@example.com
                      - to: ops@example.com
                      - subject: ${'Restart failed on ' + host}
                      - body: ${'Restart of ' + service + ' failed'}
  kestra:
    code: |
      id: restart_service
      namespace: ops.runbooks

      inputs:
        - id: host
          type: STRING
        - id: service
          type: STRING

      tasks:
        - id: restart_service
          type: io.kestra.plugin.fs.ssh.Command
          host: "{{ inputs.host }}"
          username: "{{ secret('SSH_USER') }}"
          password: "{{ secret('SSH_PASSWORD') }}"
          commands:
            - sudo systemctl restart {{ inputs.service }}
            - systemctl is-active {{ inputs.service }}

      errors:
        - id: send_alert
          type: io.kestra.plugin.email.MailSend
          host: smtp.example.com
          port: 25
          from: kestra@example.com
          to: ops@example.com
          subject: "Restart failed on {{ inputs.host }}"
          plainTextContent: "Restart of {{ inputs.service }} failed"

pairs:
  - title: "How hard is it to move from HP Operations Orchestration to Kestra?"
    columns:
      - label: "Leaving HP Operations Orchestration"
        brand: competitor
        text: "CloudSlang flows are already YAML, but each step calls an operation from a content pack, and credentials can come from system properties set in Central. Native flows built in Desktop Studio have to be mapped step by step from their graph."
      - label: "Moving to Kestra"
        brand: kestra
        text: "SSH, HTTP, email and PowerShell operations map to Kestra plugin tasks, Python inside operations moves into script tasks, and on_failure becomes an errors block. OO keeps running flows until their replacements are live, and a Kestra HTTP task can call OO Central's REST API in the meantime."
  - title: "What do licensing, pricing and self-hosting look like?"
    columns:
      - label: "HP Operations Orchestration"
        brand: competitor
        text: "Proprietary OpenText software with no published prices. The cloud edition, OpenText Core Automation Center, is licensed in AC Units counted per node or per concurrent workflow. On-premises and hyperscaler deployments can be run by you, a partner or OpenText."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from HP Operations Orchestration teams"

commonQuestions:
  - question: "What happened to HP Operations Orchestration?"
    answer: "It is now an OpenText product. OpenText says Operations Orchestration capabilities are available as part of OpenText Automation Center, together with Server Automation and Data Center Automation."
  - question: "Can Kestra run CloudSlang flows?"
    answer: "No. Kestra doesn't execute CloudSlang. The orchestration moves to Kestra YAML, and the Python or PowerShell inside operations moves into script tasks. The AI Copilot, or your own coding assistant through the Kestra MCP server, can draft a flow from a CloudSlang file for an engineer to review."
  - question: "What replaces Remote Action Servers?"
    answer: "Worker groups in Kestra Enterprise. A worker installed inside a remote network or data center joins a worker group, and tasks reach it through a workerSelector. Windows workers run PowerShell and batch commands."
  - question: "Does Kestra integrate with ServiceNow?"
    answer: "Yes. ServiceNow tasks get, create, update and delete records in a table, and a Webhook trigger lets a ticket start a flow, which can update the same ticket when it ends."
  - question: "Can operators run flows from a self-service page?"
    answer: "Yes. A flow's inputs become a form in the Kestra UI, and a Pause task waits for an approval before the next step. Kestra Enterprise adds Apps, which turn a flow into a self-service page, and RBAC that limits who can run each flow."
  - question: "How are flows versioned and promoted?"
    answer: "Every save creates a revision you can diff or roll back. Flows sync with Git, and the Terraform provider or a CI/CD pipeline such as GitHub Actions deploys them from a repository to each environment."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute, and Kestra Enterprise reaches 7,000 a minute. Workers scale horizontally as the load grows."

