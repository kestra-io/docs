title: "Kestra vs HP Operations Orchestration (OpenText)"
description: "Kestra vs HP Operations Orchestration, now OpenText: CloudSlang flows vs open-source YAML flows. The same runbook in both, licensing and how to migrate."
competitorName: "HP Operations Orchestration"
category: Infrastructure Automation
shortDescription: "CloudSlang flows deployed to OO Central in content packs vs. YAML flows that run scripts, SSH commands and API calls as tasks."

brandColor:
  color: "#0096d6"

intro:
  title: "Kestra vs. HP Operations Orchestration"
  description: "HP Operations Orchestration (OO) is now an OpenText product, and OpenText offers its capabilities as part of OpenText Automation Center. Kestra is an open-source orchestration platform that runs YAML flows for infrastructure, operations and data workflows."

choose:
  title: "HP Operations Orchestration or Kestra?"
  competitor:
    title: "HP Operations Orchestration is the better fit if"
    list:
      - "You already run OO flows and content packs, and your teams know Workflow Designer or Desktop Studio."
      - "You want OpenText's wider suite under one contract, with the service portal, patching, compliance and CMDB that come with Automation Center."
      - "You need RPA screen automation inside the same workflows as your API and server steps."
  kestra:
    title: "Choose Kestra if"
    list:
      - "You want an open-source orchestration platform you can self-host with no per-node or per-workflow licensing."
      - "Workflows start from schedules, webhooks, queue messages and file arrivals, and reach data and cloud tools as well as servers."
      - "Several teams share one instance in their own namespaces, with per-namespace secrets and permissions in Kestra Enterprise."

table:
  title: "How do HP Operations Orchestration and Kestra compare, feature by feature?"
  rows:
    - label: "Workflow definition"
      competitor: "CloudSlang YAML flows in Workflow Designer, or native flows built in Desktop Studio"
      kestra: "YAML flows, validated against each plugin's schema on save"
    - label: "Authoring"
      competitor: "Code or a low-code design canvas; AI drafts editable CloudSlang or Python"
      kestra: "Code editor, no-code editor and AI Copilot in the UI"
    - label: "Step routing"
      competitor: "Each step navigates on results such as SUCCESS or FAILURE, with an on_failure section"
      kestra: "Tasks run in order; If, Switch, Parallel and an errors block handle the rest"
    - label: "Packaging"
      competitor: "Projects are packaged into content packs and deployed to OO Central"
      kestra: "Each flow deploys on its own, from Git, the API or the Terraform provider"
    - label: "Remote execution"
      competitor: "Remote Action Servers run operations inside your firewall or remote data centers"
      kestra: "Worker groups run tasks inside the networks they reach (Kestra Enterprise)"
    - label: "Integrations"
      competitor: "Content packs, including CloudSlang base content for SSH, HTTP, email and PowerShell"
      kestra: "{totalPlugins}+ plugins, versioned apart from the core"
    - label: "Hosting"
      competitor: "On-premises, on AWS or Azure, or OpenText Core Automation Center in OpenText's cloud"
      kestra: "Self-hosted, air-gapped (Kestra Enterprise), or Kestra Cloud"
    - label: "Licensing unit"
      competitor: "Core Automation Center sells AC Units, counted per node or per concurrent workflow"
      kestra: "Free open source; Kestra Enterprise licensed per instance"
    - label: "License"
      competitor: "Proprietary OpenText software"
      kestra: "Apache 2.0"

