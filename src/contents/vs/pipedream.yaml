platformStrengths:
  title: "Built So You Never Have to Migrate in a Hurry Again"
  features:
    - title: "Managed in the Cloud, Portable by Design"
      description: "Kestra Cloud runs, scales and upgrades the platform for you, the closest move from Pipedream's hosted model. The engine is open source under Apache 2.0, so the same YAML also runs on Kestra Open Source or Enterprise on your own infrastructure, and no acquisition can switch your automation off."
    - title: "Code in Any Language, No Rewrite"
      description: "Pipedream code steps move as code. Node.js, Python, Go and Bash run as script tasks with their dependencies, on Kestra's workers, in containers, or on task runners in your AWS, GCP or Azure account for long or heavy jobs."
    - title: "Operate It Like Infrastructure"
      description: "Flows live in Git, promote from dev to prod, and ship through CI/CD. Retries, timeouts, concurrency limits, audit logs and RBAC are part of the platform, and every execution shows inputs, outputs and logs per task."

decisionGuide:
  mainTitle: "Deciding Where Your Pipedream Workflows Go"
  kestra:
    title: "Choose Kestra When"
    list:
      - "You need to move off Pipedream Workflows before March 31, 2027 without losing control flow."
      - "Your workflows loop over records, call slow APIs, or run code that outgrew a single step."
      - "You want flows in Git with dev and prod environments, tests and CI/CD."
      - "Failures should route to the right team automatically, with logs you can actually read."
      - "Finance or HR workflows need SSO, role-based access and audit logs, not a shared workspace."
      - "You want a managed platform like Pipedream today, with the option to self-host later so the next acquisition can't switch your automation off."
  competitor:
    title: "Consider Staying on Pipedream When"
    list:
      - "You only use Pipedream Connect for AI agent integrations, which is not affected by the shutdown."
      - "Your workflows can stay on Pipedream until March 2027 and you plan to retire them before then."
      - "You need a hosted SaaS-to-SaaS connector for a handful of simple triggers and no orchestration."
    shadowColor: "#C8F2D5"
    bulletColor: "#3EAA5F"

commonQuestions:
  - question: "When does Pipedream Workflows shut down?"
    answer: "Pipedream Workflows and String shut down on March 31, 2027. Existing workflows keep running until then, but the product takes no new signups or subscriptions and ships no new features. All Workflows data, including connected-account credentials and OAuth tokens, is permanently deleted by April 30, 2027. Pipedream Connect, including its API, MCP servers and API proxy, is not affected."
  - question: "How do I export my workflows from Pipedream?"
    answer: "Open each project, go to Settings and click Export Workflows. Pipedream writes a ZIP named project_export-PROJECT_ID.zip to the project's File Store, with a manifest.json and one JSON file per workflow holding its latest deployed version. One export covers up to 500 workflows or 256 MB. Credentials, OAuth tokens, environment variables, secret props, data store contents and File Store files are not included, so list and save those separately before April 30, 2027. The <a href='/resources/migration/pipedream#section-3-3'>export checklist</a> in the migration guide says where each one goes in Kestra."
  - question: "How do I migrate from Pipedream to Kestra?"
    answer: "Start on Kestra Cloud, or self-host Kestra Open Source or Enterprise. Export each project, triage the workflows (retire, merge, convert), then convert them one wave at a time. Each Pipedream trigger becomes a Kestra trigger, each code step a script task in the same language, each pre-built action a plugin task or an HTTP request, and each data store a KV Store namespace. The AI Copilot, or your own assistant through the Kestra MCP server, can draft a flow from an exported workflow for an engineer to review. Run old and new side by side, then repoint webhooks and retire the Pipedream version. The <a href='/resources/migration/pipedream'>Pipedream migration guide</a> covers each stage, and <a href='/resources/infrastructure/pipedream-alternatives'>Pipedream alternatives compared</a> sets Kestra against the other options."
  - question: "Can Kestra run my Pipedream Go and Python code steps?"
    answer: "Yes. Kestra has script tasks for Node.js, Python, Go, Bash and other languages. The code from a Pipedream step runs with its dependencies, reading inputs from flow variables instead of the steps object and returning outputs instead of exporting them. Long or memory-heavy steps can run on a task runner in your own cloud account, where there is no shared execution time limit. The migration guide walks through a <a href='/resources/migration/pipedream#section-5-1'>full worked conversion</a>."
  - question: "What happens to my Pipedream webhook URLs?"
    answer: "Every *.m.pipedream.net endpoint stops working when Workflows shuts down, so each sender, such as Stripe, GitHub or an internal system, has to be pointed at a new URL. In Kestra, a Webhook trigger exposes a URL per flow with a secret key. Plan the cutover per sender: run the Kestra flow in parallel, switch the URL in the sender, confirm executions arrive, then disable the Pipedream workflow. The <a href='/resources/migration/pipedream#section-6'>cutover plan</a> in the migration guide covers testing and promotion."
  - question: "Does Kestra have as many integrations as Pipedream?"
    answer: "Kestra has {totalPlugins}+ plugins for databases, warehouses, cloud services, messaging, AI and SaaS apps, and an HTTP task that calls any REST API. Pipedream's catalog of pre-built actions is larger for long-tail SaaS apps, so some actions become an HTTP request or a short script. For systems with no plugin yet, you can write and install a custom plugin in your own instance."
