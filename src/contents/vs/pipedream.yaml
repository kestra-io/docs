pairs:
  - title: "How hard is it to move from Pipedream to Kestra?"
    columns:
      - label: "Leaving Pipedream"
        brand: competitor
        text: "The export holds each workflow's latest deployed version as JSON. Credentials, OAuth tokens, environment variables, secret props and data store contents stay behind, and every *.m.pipedream.net webhook URL stops working at shutdown."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Code steps move into script tasks in the same language. Triggers become Kestra triggers, pre-built actions become plugin tasks or HTTP requests, and data stores become KV Store entries. The <a href='/resources/migration/pipedream'>migration guide</a> plans the move in four stages."
  - title: "How do Pipedream and Kestra compare on licensing, pricing and self-hosting?"
    columns:
      - label: "Pipedream"
        brand: competitor
        text: "A hosted service with no self-hosted option. Workflows is billed in credits, one per 30 seconds of compute, and shuts down on March 31, 2027."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Pipedream teams"

commonQuestions:
  - question: "When does Pipedream Workflows shut down?"
    answer: "Pipedream Workflows and String shut down on March 31, 2027. Existing workflows keep running until then, but the product takes no new signups or subscriptions and ships no new features. All Workflows data, including connected-account credentials and OAuth tokens, is permanently deleted by April 30, 2027. Pipedream Connect, including its API, MCP servers and API proxy, is not affected."
  - question: "How do I export my workflows from Pipedream?"
    answer: "Open each project, go to Settings and click Export Workflows. Pipedream writes a ZIP named project_export-PROJECT_ID.zip to the project's File Store, with a manifest.json and one JSON file per workflow holding its latest deployed version. One export covers up to 500 workflows or 256 MB. Credentials, OAuth tokens, environment variables, secret props, data store contents and File Store files are not included, so list and save those separately before April 30, 2027. The <a href='/resources/migration/pipedream#pd-map-title'>export checklist</a> in the migration guide says where each one goes in Kestra."
  - question: "How do I migrate from Pipedream to Kestra?"
    answer: "Start on Kestra Cloud, or self-host Kestra Open Source or Enterprise. Export each project, triage the workflows (retire, merge, convert), then convert them one wave at a time. Each Pipedream trigger becomes a Kestra trigger, each code step a script task in the same language, each pre-built action a plugin task or an HTTP request, and each data store a KV Store namespace. The AI Copilot, or your own assistant through the Kestra MCP server, can draft a flow from an exported workflow for an engineer to review. Run old and new side by side, then repoint webhooks and retire the Pipedream version. The <a href='/resources/migration/pipedream'>Pipedream migration guide</a> covers each stage, and <a href='/resources/infrastructure/pipedream-alternatives'>Pipedream alternatives compared</a> sets Kestra against the other options."
  - question: "Can Kestra run my Pipedream Go and Python code steps?"
    answer: "Yes. Kestra has script tasks for Node.js, Python, Go, Bash and other languages. The code from a Pipedream step runs with its dependencies, reading its inputs from flow variables and returning outputs to the flow. Long or memory-heavy steps can run on a task runner in your own cloud account, where there is no shared execution time limit. The migration guide walks through a <a href='/resources/migration/pipedream#pd-compare-title'>full worked conversion</a>."
  - question: "What happens to my Pipedream webhook URLs?"
    answer: "Every *.m.pipedream.net endpoint stops working when Workflows shuts down, so each sender, such as Stripe, GitHub or an internal system, has to be pointed at a new URL. In Kestra, a Webhook trigger exposes a URL per flow with a secret key. Plan the cutover per sender: run the Kestra flow in parallel, switch the URL in the sender, confirm executions arrive, then disable the Pipedream workflow. The <a href='/resources/migration/pipedream#pd-steps-title'>cutover plan</a> in the migration guide covers testing and promotion."
  - question: "How does Kestra pricing compare with Pipedream credits?"
    answer: "Pipedream bills credits: one per 30 seconds of compute, and more when a workflow runs with extra memory. Kestra Open Source is free to self-host. Kestra Cloud bills task runs, and loops, conditions and triggers aren't counted. The <a href='/pricing'>pricing page</a> lists the editions."

