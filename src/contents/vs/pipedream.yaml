intro:
  title: "Kestra vs. Pipedream"
  description: "Pipedream Workflows shuts down on March 31, 2027. Kestra, an open-source orchestration platform, runs the same webhook triggers and code steps as YAML you keep in Git, on Kestra Cloud or your own servers."

choose:
  title: "Pipedream or Kestra?"
  kestra:
    title: "Choose Kestra if"
    list:
      - "You run Pipedream Workflows and need them moved before March 31, 2027."
      - "Your workflows loop over records, retry failed calls, or run code that outgrew one step."
      - "You want flows reviewed in Git and promoted from dev to prod."
  competitor:
    title: "Pipedream is the better fit if"
    list:
      - "You only use Pipedream Connect to give AI agents access to SaaS apps. Connect isn't part of the shutdown."
      - "You rely on a pre-built action for a niche SaaS app that has no Kestra plugin, and an HTTP call won't replace it."

