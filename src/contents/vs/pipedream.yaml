compare:
  title: "A Pipedream workflow rebuilt in Kestra"
  lead: "A webhook pulls the staff list and updates each account. Pipedream loops inside a code step. Kestra uses a Loop task, and the errors block alerts the owners if any call fails."
  competitor:
    label: "Pipedream code step"
    file: "upsert_accounts.mjs"
    lang: javascript
    code: |
      import { axios } from "@pipedream/platform"

      export default defineComponent({
        async run({ steps, $ }) {
          const staff = steps.fetch_staff.$return_value.staff
          for (const person of staff) {
            await axios($, {
              method: "PUT",
              url: `https://accounts.example.com/users/${person.email}`,
              data: person,
            })
          }
          return { processed: staff.length }
        },
      })
  kestra:
    code: |
      id: staff_directory_sync
      namespace: it.integrations

      triggers:
        - id: on_change
          type: io.kestra.plugin.core.trigger.Webhook
          key: "{{ secret('SYNC_WEBHOOK_KEY') }}"

      tasks:
        - id: fetch_staff
          type: io.kestra.plugin.core.http.Request
          uri: https://hr.example.com/api/staff

        - id: each_person
          type: io.kestra.plugin.core.flow.Loop
          values: "{{ fromJson(outputs.fetch_staff.body).staff }}"
          tasks:
            - id: upsert_account
              type: io.kestra.plugin.core.http.Request
              method: PUT
              uri: "https://accounts.example.com/users/{{ fromJson(item.value).email }}"
              body: "{{ item.value }}"

      errors:
        - id: alert_owners
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          messageText: "Staff sync failed: {{ execution.id }}"

