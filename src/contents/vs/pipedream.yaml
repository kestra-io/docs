title: "Kestra vs. Pipedream: Where to Move Before the Workflows Shutdown"
description: "Pipedream Workflows shuts down on March 31, 2027. Compare Kestra vs Pipedream and see how code steps, triggers, data stores and connected apps move to declarative YAML flows you own."
competitorName: Pipedream
guideCta:
  eyebrow: "Migration guide"
  title: "Moving off Pipedream Workflows?"
  description: "Workflows shuts down on March 31, 2027 and every workflow, credential and OAuth token is deleted on April 30. The migration guide covers what the export contains, what you have to re-enter, and a four-stage plan that finishes before the deadline."
  cta:
    label: "Read the guide"
    href: "/resources/migration/pipedream"
category: Business Automation
shortDescription: "A serverless integration product being shut down vs. declarative orchestration, fully managed in Kestra Cloud or self-hosted."
seeHowTitle: "Getting Started After Pipedream"
seeHowBody: "See how a Pipedream workflow becomes a Kestra flow: same trigger, same code, with loops, retries and Git built in."

brandColor:
  color: "#34D399"
  gradient: "linear-gradient(90deg, #34D399, #0EA5E9, #1F2937)"

intro:
  title: "Kestra vs. Pipedream: Your Workflows Need a New Home"
  description: "Pipedream was acquired by Workday, and Pipedream Workflows is now in maintenance mode. It shuts down on March 31, 2027, and all Workflows data, including connected-account credentials and OAuth tokens, is deleted by April 30, 2027. Pipedream Connect stays, Workflows does not. Kestra runs the same event-driven automations as declarative YAML flows: webhook and schedule triggers, code in Node.js, Python, Go or Bash, plus loops, retries, approvals, Git and observability that Pipedream left to workarounds. Self-host it under Apache 2.0 or run it on Kestra Cloud."

philosophy:
  mainTitle: "From a Product Being Retired to a Platform You Control"
  kestra:
    title: "Declarative Orchestration You Own"
    description: "Every workflow is a YAML file you can read, review and keep in Git. Triggers, inputs, retries, timeouts, concurrency and error handling are part of the definition, not settings hidden in a UI. Code runs in any language, in containers or on your own runners. If a vendor changes direction, your flows keep running because the engine is open source."
    subCardText: '"How do I move 60 workflows off Pipedream before March, without rebuilding them twice?"'
  competitor:
    title: "Serverless Integration, Now in Maintenance Mode"
    description: "Pipedream made API glue fast: a trigger, a few code steps in Node.js or Python, and pre-built actions for SaaS apps. Since the Workday acquisition, Workflows takes no new signups and ships no new features, and the product shuts down on March 31, 2027. The export gives you workflow structure as JSON, but not credentials, environment variables or data store contents."
    shadowColor: "#C8F2D5"
    subCardBg: "#edfdf8"
    subCardText: '"What happens to our webhook URLs, OAuth connections and data stores when Pipedream deletes everything?"'

businessValue:
  mainTitle: "A Deadline Is a Chance<br />to Fix What Pipedream Never Did"
  kestra:
    title: "What You Gain by Moving to Kestra"
    list:
      - "Native Loop, Switch, Parallel and subflows instead of workarounds for iteration"
      - "Large outputs stored once and passed by reference, not copied into every step"
      - "Retries, timeouts and an errors block per task, plus replay from the failed step"
      - "Flows in Git with dev and prod promotion, unit tests and CI/CD"
      - "Kestra Cloud, fully managed like Pipedream, or self-hosted with Kestra Open Source or Enterprise"
  competitor:
    title: "What Pipedream Workflows Leaves You With"
    list:
      - "Shutdown on March 31, 2027; all Workflows data deleted by April 30, 2027"
      - "Credentials, OAuth tokens, env vars and secret props are never exported"
      - "Every *.m.pipedream.net webhook URL stops working at shutdown"
      - "Credits billed per 30 seconds of compute, scaled up when you raise memory"
      - "Cloud-only, with no self-hosted option to fall back on"
    shadowColor: "#C8F2D5"
    bulletColor: "#3EAA5F"
  footerText: "Pipedream did the job for many teams: fast webhooks, quick code steps, SaaS actions. The shutdown forces a move either way. Moving to Kestra means the workflows you rebuild once are versioned in Git, observable end to end, and no longer tied to the roadmap of whoever owns your automation vendor. The <a href='/resources/migration/pipedream'>Pipedream migration guide</a> plans that move in four stages."

setupSpeed:
  title: "Time to Your First Migrated Workflow"
  subtitle: "Pipedream no longer accepts new signups, so there is no new account to compare against. This shows the path from a Pipedream export to a running Kestra flow."
  kestra:
    title:
      one: "~1"
      two: Hour
    description: "Start on Kestra Cloud, which keeps Pipedream's hosted model with nothing to install, or run Kestra Open Source with the Docker Compose command below if you prefer to self-host. Export a Pipedream project from Settings, give one workflow's JSON to the AI Copilot or your own assistant through the Kestra MCP server, review the YAML it proposes, re-create the secrets, and run the flow next to the Pipedream original."
    command: |
      curl -o docker-compose.yml \
      https://raw.githubusercontent.com/kestra-io/kestra/develop/docker-compose.yml
      docker compose up

      # Open localhost:8080
      # Paste one exported workflow into the AI Copilot,
      # review the flow, add secrets, run it.
    lang: sh
  competitor:
    title:
      one: "Before"
      two: March 31
    description: "Pipedream's export runs one project at a time from Settings, writes a ZIP to the project's File Store and covers up to 500 workflows or 256 MB per export. You then re-enter every secret, reconnect every app and repoint every webhook on the new platform."
    shadowColor: "#C8F2D5"
    command: |
      # Pipedream: Project > Settings > Export Workflows
      # Output: project_export-<project_id>.zip
      #   manifest.json        # status and warnings per workflow
      #   <workflow>.json      # latest deployed version
      # Not included: credentials, OAuth tokens,
      #   env vars, secret props, data store contents,
      #   File Store files, event history
    lang: sh

easeOfUse:
  title: "The Same Workflow, Without the Workarounds"
  kestra:
    title: "Kestra: A Loop Is a Task, Not a Hack"
    description: "A webhook starts the flow, a Loop processes each record, a Go or Python script does the custom work, and an errors block routes failures to the right team. The <a href='/docs/ai-tools/ai-copilot' target='_blank'>AI Copilot</a> drafts the YAML from a description or an exported workflow, and every step is tested and replayable."
    code: |
      id: staff_directory_sync
      namespace: it.integrations

      triggers:
        - id: on_change
          type: io.kestra.plugin.core.trigger.Webhook
          key: "{{ secret('SYNC_WEBHOOK_KEY') }}"

      tasks:
        - id: fetch_staff
          type: io.kestra.plugin.core.http.Request
          uri: "https://hr.example.com/api/staff"
          headers:
            Authorization: "Bearer {{ secret('HR_TOKEN') }}"

        - id: each_person
          type: io.kestra.plugin.core.flow.Loop
          values: "{{ fromJson(outputs.fetch_staff.body).staff }}"
          tasks:
            - id: upsert_account
              type: io.kestra.plugin.scripts.go.Script
              script: |
                package main
                import "fmt"
                func main() { fmt.Println("upsert {{ item.value.email }}") }

      errors:
        - id: alert_owners
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          messageText: "Staff sync failed: {{ execution.id }}"
    lang: yaml
  competitor:
    title: "Pipedream: Iteration and Errors in Your Own Code"
    description: "Pipedream workflows run steps top to bottom. Iterating over records means writing the loop inside a code step or re-invoking the workflow, and each step's return value is kept for the steps after it. Error routing across workflows has to be assembled by hand."
    shadowColor: "#C8F2D5"
    code: |
      // Pipedream code step (Node.js)
      export default defineComponent({
        async run({ steps, $ }) {
          const staff = steps.fetch_staff.$return_value.staff;
          // No native loop step: iterate inside the step
          for (const person of staff) {
            await upsertAccount(person);   // one failure fails all
          }
          // Return value is exported to every later step
          return { processed: staff.length, staff };
        },
      });
    lang: javascript

visualPreview:
  mainTitle: "One Orchestrator for Integrations, Data and Operations"
  kestra:
    description: "Webhooks, schedules and app events start flows that call APIs, run code in any language, move files, load warehouses and wait for approvals, with logs, outputs and a Gantt view for every execution. Apps give non-technical teams a form to start a flow without seeing YAML."
  competitor:
    description: "Pipedream connects SaaS apps with event triggers, code steps and pre-built actions in a hosted builder. Workflows is in maintenance mode and shuts down on March 31, 2027; Pipedream Connect, its API and MCP layer for AI agents, continues."
    shadowColor: "#C8F2D5"

