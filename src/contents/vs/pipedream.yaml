architecture:
  title: "How are Pipedream and Kestra built?"
  competitor:
    title: "Pipedream: hosted steps"
    text: "A workflow is a trigger followed by steps in Pipedream's builder. Each step runs on Pipedream's serverless runtime and exports its return value to the steps after it."
    list:
      - "HTTP, schedule and app-event triggers"
      - "Code steps in Node.js, Python, Go or Bash"
      - "Pre-built actions for SaaS apps"
      - "Compute billed in credits, one per 30 seconds"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file. Kestra validates it against each plugin's schema when you save it and shows the topology before anything runs."
    list:
      - "Webhook, schedule, event and flow triggers"
      - "Script tasks for Node.js, Python, Go, Bash and more"
      - "Outputs and files stored once and passed by reference"
      - "Workers run on Kestra Cloud or your own servers"

compare:
  title: "What does the same workflow look like in each?"
  lead: "The same workflow in both: a webhook, a call that fetches the staff list, an update per person and a Slack alert when a task fails."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Pipedream code step"
    file: "upsert_accounts.mjs"
    lang: javascript
    code: |
      import { axios } from "@pipedream/platform"

      export default defineComponent({
        async run({ steps, $ }) {
          const staff = steps.fetch_staff.$return_value.staff
          for (const person of staff) {
            await axios($, {
              method: "PUT",
              url: `https://accounts.example.com/users/${person.email}`,
              data: person,
            })
          }
          return { processed: staff.length }
        },
      })
  kestra:
    code: |
      id: staff_directory_sync
      namespace: it.integrations

      triggers:
        - id: on_change
          type: io.kestra.plugin.core.trigger.Webhook
          key: "{{ secret('SYNC_WEBHOOK_KEY') }}"

      tasks:
        - id: fetch_staff
          type: io.kestra.plugin.core.http.Request
          uri: https://hr.example.com/api/staff

        - id: each_person
          type: io.kestra.plugin.core.flow.Loop
          values: "{{ fromJson(outputs.fetch_staff.body).staff }}"
          tasks:
            - id: upsert_account
              type: io.kestra.plugin.core.http.Request
              method: PUT
              uri: "https://accounts.example.com/users/{{ fromJson(item.value).email }}"
              body: "{{ item.value }}"

      errors:
        - id: alert_owners
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          messageText: "Staff sync failed: {{ execution.id }}"

