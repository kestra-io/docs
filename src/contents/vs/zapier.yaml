architecture:
  title: "How are Zapier and Kestra built?"
  competitor:
    title: "Zapier: hosted Zaps"
    text: "A Zap is a trigger followed by action steps, built in Zapier's editor. Zapier polls the trigger app or receives a webhook, then runs each action on its own cloud and counts a task for each one that succeeds."
    list:
      - "Polling triggers and webhooks start Zaps"
      - "Each action maps fields from the steps before it"
      - "Formatter and Filter steps shape data without using tasks"
      - "Paths split a Zap into branches by condition"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file. Kestra validates it against each plugin's schema when you save it and shows the topology before anything runs."
    list:
      - "Webhook, schedule, event and flow triggers"
      - "Script tasks install their dependencies per task, in containers"
      - "Outputs and files stored once and passed by reference"
      - "Workers run on Kestra Cloud or your own servers"

pairs:
  - title: "How hard is it to move from Zapier to Kestra?"
    columns:
      - label: "Leaving Zapier"
        brand: competitor
        text: "Zaps live in Zapier's editor, so each one is read step by step, with its trigger, actions, field mappings, filters and paths. Connected app accounts don't move and have to be authorized again on the other side."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Triggers become Kestra triggers, actions become plugin tasks or HTTP requests, Paths become If or Switch tasks and Code steps become Node.js or Python script tasks. Kestra's Zapier plugin can start an existing Zap from a flow, so both run side by side while Zaps move."
  - title: "What do licensing, pricing and self-hosting look like?"
    columns:
      - label: "Zapier"
        brand: competitor
        text: "A hosted service billed in tasks, where each successful action counts as one. The Free plan includes 100 tasks a month and two-step Zaps. With pay-per-task turned on, extra tasks cost 1.25 times the base rate on annual plans and 2.5 times on monthly plans."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Zapier teams"

commonQuestions:
  - question: "What happens when we run out of Zapier tasks?"
    answer: "Without pay-per-task, Zapier holds new Zap runs until the billing cycle resets or you upgrade, and the held runs can be replayed afterwards. With pay-per-task turned on, Zapier bills extra tasks at an overage rate and pauses Zaps once usage reaches three times your plan's task limit. Kestra Open Source has no usage limit, and Kestra Cloud bills task runs, without counting loops, conditions or triggers."
  - question: "Can Kestra start our existing Zaps?"
    answer: "Yes. Kestra's Zapier plugin triggers and manages Zaps from a flow, so a Zap can stay in place as one step while the steps around it move to Kestra. Once a Zap is rebuilt as a flow, you turn it off in Zapier."
  - question: "Can people who don't write code still build automations?"
    answer: "Partly. Kestra's no-code editor builds a flow block by block through forms, and the AI Copilot drafts flows from a description, but someone still needs to understand tasks, inputs and outputs. In most teams, engineers own the flows and everyone else runs them through input forms, or through Apps in Kestra Enterprise."
  - question: "How do Paths, Filters and Code steps map to Kestra?"
    answer: "Paths become If or Switch tasks, Filters become conditions on a task or trigger, and Formatter steps become expressions. Code steps move into Python or Node.js script tasks, which can install any package and run as long as their timeout allows."
  - question: "Can Kestra reach systems on our private network?"
    answer: "Yes. Self-hosted Kestra runs inside your network, so tasks reach databases, file shares and internal APIs directly. Kestra Enterprise adds worker groups, which place execution in the network zone or site that needs it."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute, and Kestra Enterprise reaches 7,000 a minute. Workers scale horizontally, and Fila runs 2.5 million executions a month on Kestra."

