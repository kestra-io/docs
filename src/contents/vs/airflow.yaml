compare:
  title: "What does the same pipeline look like in each?"
  lead: "The same pipeline in both: a SQL staging step, a dbt build and a Slack alert when a task fails."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Airflow DAG"
    file: "orders_daily.py"
    lang: python
    code: |
      from datetime import datetime, timedelta

      from airflow import DAG
      from airflow.operators.bash import BashOperator
      from airflow.providers.common.sql.operators.sql import SQLExecuteQueryOperator
      from airflow.providers.slack.notifications.slack_webhook import send_slack_webhook_notification

      with DAG(
          dag_id="orders_daily",
          schedule="0 6 * * *",
          start_date=datetime(2026, 1, 1),
          catchup=False,
          default_args={"retries": 2, "retry_delay": timedelta(minutes=5)},
          on_failure_callback=send_slack_webhook_notification(
              slack_webhook_conn_id="slack_alerts",
              text="orders_daily failed",
          ),
      ):
          stage = SQLExecuteQueryOperator(
              task_id="stage_orders",
              conn_id="warehouse",
              sql="sql/stage_orders.sql",
          )

          build = BashOperator(
              task_id="dbt_build",
              bash_command="dbt build --select orders+ --project-dir /opt/dbt --profiles-dir /opt/dbt",
          )

          stage >> build
  kestra:
    code: |
      id: orders_daily
      namespace: company.data

      retry:
        type: constant
        interval: PT5M
        maxAttempts: 3

      tasks:
        - id: stage_orders
          type: io.kestra.plugin.jdbc.postgresql.Queries
          url: "{{ secret('WAREHOUSE_JDBC_URL') }}"
          username: "{{ secret('WAREHOUSE_USER') }}"
          password: "{{ secret('WAREHOUSE_PASSWORD') }}"
          sql: "{{ read('sql/stage_orders.sql') }}"

        - id: dbt_build
          type: io.kestra.plugin.dbt.cli.DbtCLI
          containerImage: ghcr.io/kestra-io/dbt-postgres:latest
          namespaceFiles:
            enabled: true
          projectDir: dbt
          commands:
            - dbt build --select orders+

      errors:
        - id: slack_alert
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          messageText: "orders_daily failed"

      triggers:
        - id: daily
          type: io.kestra.plugin.core.trigger.Schedule
          cron: "0 6 * * *"

setup:
  title: "What does it take to get running?"
  lead: "Both projects ship a Docker Compose file for a first run."
  competitor:
    title: "Airflow"
    tag: "Learning setup"
    text: "Airflow's <a href='https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html'>Docker guide</a> calls this setup a way to learn and explore, with no security guarantees for production. For production it points to Kubernetes and the official Helm chart."
    code: |
      curl -LfO 'https://airflow.apache.org/docs/apache-airflow/stable/docker-compose.yaml'
      mkdir -p ./dags ./logs ./plugins ./config
      echo -e "AIRFLOW_UID=$(id -u)" > .env
      docker compose up airflow-init
      docker compose up
  kestra:
    title: "Kestra"
    tag: "Database included"
    text: "One Compose file starts Kestra and its Postgres database. Open localhost:8080, pick a blueprint and run it. Production runs the same image on Kubernetes with the <a href='/docs/installation/kubernetes'>Kestra Helm chart</a>."
    code: |
      curl -o docker-compose.yml https://raw.githubusercontent.com/kestra-io/kestra/develop/docker-compose.yml
      docker compose up

pairs:
  - title: "How hard is it to move from Airflow to Kestra?"
    columns:
      - label: "Leaving Airflow"
        brand: competitor
        text: "A DAG file is Python that imports Airflow: operators, provider hooks, XCom and the task context. Task code often calls those APIs directly, so the business logic has to be separated from the Airflow wiring before it moves."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Python, SQL, dbt and shell code moves into script tasks unchanged. You rewrite the DAG wiring: each operator becomes a task, each schedule a trigger and each XCom an output. Airflow keeps running until the last DAG moves, and the <a href='/resources/migration/airflow'>migration guide</a> maps every concept."
  - title: "What do licensing, pricing and self-hosting look like?"
    lead: "Both projects are open source under Apache 2.0, and both run on your own infrastructure."
    columns:
      - label: "Airflow"
        brand: competitor
        text: "Apache 2.0, governed by the Apache Software Foundation. You self-host it, or pay for a managed service from Astronomer, AWS (MWAA) or Google Cloud (Cloud Composer), each priced on its own terms."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Airflow teams"

commonQuestions:
  - question: "Is Kestra a drop-in replacement for Airflow?"
    answer: "No. A DAG file doesn't run on Kestra as it is. The orchestration moves to YAML, and the Python, SQL and dbt code inside the tasks runs unchanged. The <a href='/resources/migration/airflow'>migration guide</a> covers the mapping."
  - question: "Can Airflow DAGs be converted to Kestra automatically?"
    answer: "Partly. The AI Copilot, or your own coding assistant through the Kestra MCP server, drafts a flow from a DAG file, and an engineer reviews it before it runs. The migration guide lists what maps one to one and what needs a decision."
  - question: "Should we upgrade Airflow or move to Kestra?"
    answer: "Airflow 2 reached end of life in April 2026, so teams still on it have to choose. Both take work. An Airflow upgrade means removing deprecated features, updating context variables and moving to new provider packages, and the DAGs stay Python. A move to Kestra means taking the business logic out of the DAG files and declaring the orchestration in YAML, while your Python, SQL and shell code runs unchanged. The <a href='/resources/airflow-2-eol-whitepaper'>Airflow 2 end-of-life whitepaper</a> compares both paths."
  - question: "Do I have to migrate all my DAGs at once?"
    answer: "No. Most teams run Airflow and Kestra side by side and move DAGs in waves, starting with new workflows and low-risk DAGs. While both run, a Kestra flow can call Airflow's REST API with an HTTP task. The <a href='/resources/migration/airflow'>Airflow migration guide</a> covers the concept mapping and the cutover plan."
  - question: "What happens to my Python code and custom operators?"
    answer: "The Python stays as it is. It runs in a Python script task with its dependencies installed per task, so you don't refactor it into decorators or operator subclasses. Custom operator logic that calls an API or runs a transformation becomes a script or HTTP task with the same code."
  - question: "We run Airflow on MWAA or Cloud Composer. Does that change anything?"
    answer: "Managed Airflow follows the cloud provider's upgrade schedule. Kestra runs on Docker or Kubernetes in any cloud, or as Kestra Cloud, and has plugins for the AWS, GCP and Azure services your DAGs already call."
  - question: "How does Kestra version workflows?"
    answer: "Every save creates a revision you can diff, roll back or audit. Flows also sync with Git, and the Terraform provider and CI/CD tools such as GitHub Actions deploy them from a repository."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute with each execution finishing in under a second, and Kestra Enterprise reaches 7,000 a minute. Workers scale horizontally, and Leroy Merlin runs more than 5,000 flows on Kestra."

