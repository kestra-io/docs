title: "Kestra vs Windmill: Workflow Orchestration at Scale"
description: "Compare Kestra and Windmill side by side: scripts and flows vs. declarative YAML, the same signup flow in both, setup, licensing and pricing."
competitorName: Windmill
category: Data Orchestration
shortDescription: "A developer platform for scripts, flows and internal apps vs. a YAML orchestrator with {totalPlugins}+ plugins."

brandColor:
  color: "#3B82F6"

intro:
  title: "Kestra vs. Windmill"
  description: "Windmill turns scripts in more than 20 languages into endpoints, flows and internal apps, with a visual flow editor. Kestra declares workflows in YAML, with plugins for data, cloud and infrastructure tools and scripts as tasks."

choose:
  title: "Windmill or Kestra?"
  competitor:
    title: "Windmill is the better fit if"
    list:
      - "You want internal tools as well as workflows, with React or Svelte apps that call the same scripts."
      - "Every script should get a generated form, an API endpoint and a webhook without extra work."
  kestra:
    title: "Choose Kestra if"
    list:
      - "You'd rather configure a plugin for dbt, Snowflake, Kafka or Terraform than write and maintain the client code."
      - "You need an Apache 2.0 license for embedding or redistributing the orchestrator."
      - "Flows should start from Kafka, NATS or SQS messages, and you want those triggers in the open-source edition."

table:
  title: "How do Windmill and Kestra compare, feature by feature?"
  rows:
    - label: "Workflow definition"
      competitor: "Scripts with a main function, chained into flows in the visual editor or as OpenFlow YAML"
      kestra: "YAML flows, written in the editor, the no-code view or Git"
    - label: "Languages"
      competitor: "20+, including TypeScript, Python, Go, Bash, SQL, PHP, Rust and C#"
      kestra: "Python, Node.js, Go, R, Shell, PowerShell, Ruby, PHP and more, plus SQL through database plugins"
    - label: "Integrations"
      competitor: "200+ resource types and a community Hub of scripts"
      kestra: "{totalPlugins}+ plugins, versioned apart from the core"
    - label: "Triggers"
      competitor: "HTTP, cron, email, WebSocket, MQTT and Postgres CDC; Kafka, NATS and SQS on self-hosted Enterprise"
      kestra: "Schedules, webhooks, flow triggers, polling and realtime triggers for Kafka, NATS, SQS, MQTT and Postgres CDC"
    - label: "User interfaces"
      competitor: "Generated forms for every script, and full-code or low-code apps for internal tools"
      kestra: "Typed input forms for every flow, and Apps for forms and approvals in Kestra Enterprise"
    - label: "Free edition limits"
      competitor: "3 workspaces, 50 users, SSO for 10 users, Git sync for 2 users"
      kestra: "No caps on flows, executions or namespaces; one shared login"
    - label: "License"
      competitor: "AGPLv3 core, proprietary Enterprise features"
      kestra: "Apache 2.0"
    - label: "GitHub stars"
      competitor: "18k+"
      kestra: "30k+"

