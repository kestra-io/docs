architecture:
  title: "How are Windmill and Kestra built?"
  lead: "Both run stateless servers and workers on top of a database. They differ in what a workflow step is."
  competitor:
    title: "Windmill: scripts first"
    text: "Each script is a standalone unit with a main function, its own lockfile and an HTTP endpoint. Flows chain scripts and pass each step's result to the next through JavaScript input expressions."
    list:
      - "Postgres holds all state, and servers and workers are stateless"
      - "Workers pull jobs from the queue in scheduled order"
      - "Worker groups listen to tags to take specific jobs"
      - "Dependencies are resolved into a lockfile per script"
  kestra:
    title: "Kestra: plugins first"
    text: "Each task in a flow is a plugin with a typed schema, whether it runs a script, a SQL query or a cloud API call. Outputs move between tasks through expressions and internal storage."
    list:
      - "Flows are checked against plugin schemas on save"
      - "The executor runs the state machine and dispatches tasks"
      - "Workers stream jobs and results through a gRPC controller"
      - "Plugins ship and upgrade separately from the core"

compare:
  title: "What does the same flow look like in each?"
  lead: "The same flow in both: a signup arrives by webhook, a company lookup is retried twice, and a CRM call uses its result."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Windmill flow"
    file: "flow.yaml"
    lang: yaml
    code: |
      summary: Enrich new signup
      schema:
        type: object
        properties:
          email: {type: string}
      value:
        modules:
          - id: lookup_company
            retry:
              constant: {attempts: 2, seconds: 30}
            value:
              type: rawscript
              language: python3
              content: |
                import requests
                def main(email: str):
                    domain = email.split("@")[1]
                    r = requests.get(f"https://enrich.example.com/companies/{domain}")
                    r.raise_for_status()
                    return r.json()
              input_transforms:
                email: {type: javascript, expr: flow_input.email}
          - id: create_lead
            value:
              type: rawscript
              language: python3
              content: |
                import requests
                def main(email: str, company: dict):
                    requests.post("https://crm.example.com/api/leads",
                                  json={"email": email, "company": company["name"]}).raise_for_status()
              input_transforms:
                email: {type: javascript, expr: flow_input.email}
                company: {type: javascript, expr: results.lookup_company}
  kestra:
    code: |
      id: enrich_signup
      namespace: company.growth

      tasks:
        - id: lookup_company
          type: io.kestra.plugin.core.http.Request
          uri: "https://enrich.example.com/companies/{{ trigger.body.email | split('@') | last }}"
          retry:
            type: constant
            interval: PT30S
            maxAttempts: 3

        - id: create_lead
          type: io.kestra.plugin.core.http.Request
          method: POST
          uri: https://crm.example.com/api/leads
          contentType: application/json
          body: |
            {
              "email": "{{ trigger.body.email }}",
              "company": "{{ fromJson(outputs.lookup_company.body).name }}"
            }

      triggers:
        - id: signup
          type: io.kestra.plugin.core.trigger.Webhook
          key: "{{ secret('SIGNUP_WEBHOOK_KEY') }}"

setup:
  title: "What does it take to get running?"
  lead: "Both ship a Docker Compose file that includes the database."
  competitor:
    title: "Windmill"
    tag: "Postgres and Caddy"
    text: "Windmill's <a href='https://www.windmill.dev/docs/advanced/self_host'>self-host guide</a> downloads a Compose file, a Caddyfile and an .env file, then serves the UI on localhost through Caddy. Postgres holds all of Windmill's state, and the guide says to change the default superadmin login on first setup."
    code: |
      curl https://raw.githubusercontent.com/windmill-labs/windmill/main/docker-compose.yml -o docker-compose.yml
      curl https://raw.githubusercontent.com/windmill-labs/windmill/main/Caddyfile -o Caddyfile
      curl https://raw.githubusercontent.com/windmill-labs/windmill/main/.env -o .env
      docker compose up -d
  kestra:
    title: "Kestra"
    tag: "Database included"
    text: "One Compose file starts Kestra and its Postgres database. Open localhost:8080, pick a blueprint and run it. Production runs the same image on Kubernetes with the <a href='/docs/installation/kubernetes'>Kestra Helm chart</a>."
    code: |
      curl -o docker-compose.yml https://raw.githubusercontent.com/kestra-io/kestra/develop/docker-compose.yml
      docker compose up

pairs:
  - title: "How hard is it to move from Windmill to Kestra?"
    columns:
      - label: "Leaving Windmill"
        brand: competitor
        text: "Scripts are standard TypeScript, Python, Go or Bash with a main function, so their code is portable. Flow wiring is Windmill's own: input transforms, step results, retries and failure modules. Windmill apps have no direct counterpart and need a plan of their own."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Each script becomes a script task in the same language, or a plugin task where one covers the call. Step results become outputs, failure modules an errors block, and schedules and webhooks triggers in the flow file. Windmill's webhooks let both run in parallel until each flow is switched over."
  - title: "What do licensing, pricing and self-hosting look like?"
    lead: "Both are free to self-host, under different licenses."
    columns:
      - label: "Windmill"
        brand: competitor
        text: "The core is AGPLv3, and the Community Edition images add proprietary code under a free-use license that rules out reselling or running it as a managed service. The free edition has no execution limit but caps workspaces, users, SSO and Git sync. Enterprise is billed per builder and per compute unit of worker memory, and quoted on request."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Windmill teams"

commonQuestions:
  - question: "Can Kestra replace Windmill apps?"
    answer: "Partly. Every Kestra flow gets a form generated from its typed inputs, and Apps in Kestra Enterprise add custom forms, output displays and approval buttons in front of a flow. Windmill apps go further for general internal tools, with React or Svelte frontends wired to Windmill scripts, so teams that rely on them often keep them."
  - question: "Do I need to write client code for my tools in Kestra?"
    answer: "Usually not. Plugins cover databases, warehouses, dbt, Airbyte, Kafka, cloud services and infrastructure tools as typed tasks with documented properties. For an API without a plugin, the HTTP Request task makes the call, and a script task runs your own client code when you need it."
  - question: "How does Kestra handle secrets compared to Windmill variables and resources?"
    answer: "Credentials are Kestra secrets, read with the secret() function in any task property. Non-secret settings go in the KV Store. Kestra Enterprise adds secrets scoped per namespace and connects to external managers such as HashiCorp Vault and Azure Key Vault."
  - question: "How do several teams share one Kestra instance?"
    answer: "Each team works in its own namespaces, with flows, files and KV pairs kept apart. Kestra Enterprise adds RBAC scoped to namespaces, SSO, audit logs and fully isolated tenants. Acxiom runs more than 50 enterprise clients as isolated tenants on Kestra."
  - question: "Can Kestra and Windmill run side by side?"
    answer: "Yes. Every Windmill script and flow has a webhook URL, so a Kestra flow can call it with an HTTP Request task. Teams often move the pipelines that need plugins first and keep internal tools on Windmill."
  - question: "Is Kestra's license a factor for embedding it in a product?"
    answer: "Kestra's open-source edition is Apache 2.0, which allows modification and redistribution, including inside commercial products. Windmill's license file asks for a commercial license to embed the Community Edition in a product you sell or to offer it as a managed service."

