  eyebrow: "Comparison guide"
  title: "Comparing IaC platforms?"
  description: "The Spacelift alternatives guide compares HCP Terraform, env0, Scalr, Pulumi Cloud, Atlantis, Terrateam and Kestra by scope, deployment model and policy support."
  cta:
    label: "Read the guide"
