platformStrengths:
  title: Kestra Is Built for How Platform Teams Work
  features:
    - title: The change, not just the run
      description: "A Terraform apply is rarely the whole job. The ticket comes before it; the Ansible run, the CMDB update and the notification come after. Kestra runs all of it in one workflow, with the plan file passed to the approval and the apply, so what was reviewed is what gets deployed."
    - title: Runs where your infrastructure lives
      description: "Kestra is open source and runs on Kubernetes, VMs or air-gapped networks, with secrets read from the vault you already use. In Kestra 2.0, workers connect to the control plane over gRPC, so they can run inside your network wherever the control plane is hosted."
    - title: One orchestrator instead of several
      description: "Teams often run Spacelift for IaC, AWX or Rundeck for playbooks, and n8n or scripts for the rest. Kestra covers infrastructure, data, AI and business workflows in one platform with one RBAC model, one audit trail and one place to look when something fails."

decisionGuide:
  mainTitle: The Right Tool for the Right Job
  kestra:
    title: Choose Kestra When
    list:
      - "Infrastructure changes are steps in longer processes: tickets, approvals, configuration, checks, notifications."
      - "You run Ansible, scripts and cloud APIs alongside Terraform and want them in one workflow, without restructuring playbooks."
      - "The platform must run in your own network or air-gapped, or data residency rules out a SaaS control plane."
      - "You want to read secrets from Vault, CyberArk or Delinea instead of copying them into another tool."
      - "You'd rather consolidate IaC, runbook and workflow tools into one open-source orchestrator."
  competitor:
    title: Choose Spacelift When
    list:
      - "Your main need is a managed GitOps workflow for many Terraform or OpenTofu stacks."
      - "You want managed state, stack dependencies and a private module registry out of the box."
      - "Rego policies on every plan and apply are central to your governance."
      - "Built-in drift detection and remediation matter more than orchestrating steps outside IaC."
      - "A SaaS control plane fits your security and residency requirements."
    shadowColor: "#8B7FF5"
    bulletColor: "#8B7FF5"

commonQuestions:
  - question: How is Kestra different from Spacelift?
    answer: "Spacelift is an IaC management platform: it runs Terraform, OpenTofu, Pulumi and Ansible stacks from your VCS, manages state, chains stacks and enforces Rego policies on runs. Kestra is a general orchestration platform: it runs those same tools as tasks inside YAML workflows that also handle tickets, approvals, configuration, checks, notifications, data pipelines and AI steps. Spacelift governs the IaC run; Kestra orchestrates the process the run belongs to."
  - question: Can Kestra replace Spacelift?
    answer: "For teams whose Terraform runs are part of larger workflows, yes. Kestra plans, waits for approval, applies the reviewed plan file, runs Ansible and notifies, all in one flow, with state in your own backend. Kestra does not ship a managed state backend, a private module registry or native Rego policies on every plan. If those are the core of your requirement, Spacelift covers more of that surface, and the two tools can run side by side."
  - question: Can Kestra and Spacelift work together?
    answer: "Yes. Some teams keep Spacelift for stack management and use Kestra as the layer around it. A Kestra workflow can start from a ServiceNow ticket, a webhook or an alert, trigger a Spacelift run through its API, wait for the result, then continue with Ansible, CMDB updates, tests and notifications. Teams that do this usually wrap the call in a reusable subflow so every workflow triggers and polls Spacelift the same way."
  - question: How does Kestra compare to Spacelift Flows?
    answer: "Spacelift Flows, launched in October 2026, adds day 2 automation to Spacelift: workflows built on a visual canvas or with an AI assistant, with apps for AWS, Kubernetes, Datadog, PagerDuty, ServiceNow, Jira and Slack, and custom apps written in TypeScript. Kestra workflows are declarative YAML, with {totalPlugins}+ plugins and scripts in any language, and the same engine runs data, AI and business workflows. Flows is free until the end of 2026, with pricing to be announced in Q1 2027."
  - question: Can Kestra run inside our own network or air-gapped?
    answer: "Yes. Kestra is open source and runs on Docker, Kubernetes or VMs, including air-gapped environments, with no call home required. Kestra Enterprise adds RBAC, SSO, audit logs and worker isolation for regulated teams. Spacelift's control plane is SaaS; private workers start on the Business tier and the self-hosted edition is available on request."
  - question: How do secrets work compared to Spacelift?
    answer: "In Spacelift, secrets usually live in contexts as secret environment variables or mounted files, or are fetched from a cloud provider through OIDC or hooks. Kestra Enterprise reads secrets directly from HashiCorp Vault, AWS Secrets Manager, Azure Key Vault, Google Secret Manager, CyberArk, Delinea, 1Password, Doppler and others, scoped per namespace, so credentials stay in the vault you already govern."
  - question: Does Kestra support Ansible without restructuring our playbooks?
    answer: "Yes. The Ansible plugin runs ansible-playbook or Ansible Runner in a container against your existing repository layout, inventories and roles. Each playbook run is one task in a workflow, so you can run it after a Terraform apply, in parallel across inventories, or behind an approval, without reorganizing playbooks into a stack model."
  - question: How does Kestra handle drift detection?
    answer: "Spacelift ships drift detection on its Business and Enterprise tiers. In Kestra, drift detection is a scheduled workflow: run terraform plan -detailed-exitcode on a cron, and when drift is found, alert Slack, open a ticket or start a reviewed remediation apply. You choose the response per environment. See our <a href='/resources/infrastructure/terraform-drift-detection'>Terraform drift detection guide</a>."
  - question: How does pricing compare between Kestra and Spacelift?
    answer: "As of November 2026, Spacelift lists a Free plan for 2 users, Starter from $399 per month with 10 users and 2 public workers, and quote-based Business and Enterprise tiers; drift detection and private workers start on Business. Kestra's open-source edition is free with most plugins and unlimited workflows. Kestra Enterprise and Kestra Cloud add governance features without per-worker metering on your IaC runs."
  - question: Is Kestra open source like Atlantis?
    answer: "Yes, Kestra is open source under Apache 2.0. Atlantis is a focused pull-request bot for Terraform and OpenTofu plans and applies. Kestra covers IaC runs plus the workflow around them: approvals, configuration, ITSM, data and AI steps, with a UI, execution history and event triggers. Spacelift is proprietary."
  - question: How hard is it to migrate from Spacelift to Kestra?
    answer: "Your Terraform, OpenTofu and Ansible code does not change. Each Spacelift stack becomes a Kestra task or subflow that clones the repository and runs the same commands against the same state backend. Stack dependencies become task order or flow triggers, and approval policies become Pause tasks with RBAC. Most teams start by orchestrating new end-to-end workflows in Kestra, then move stacks over at renewal."
