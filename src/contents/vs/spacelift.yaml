brandColor:
  color: "#5B4FE9"

intro:
  title: "Kestra vs. Spacelift: Orchestrate the Change, Not Just the Terraform Run"
  description: "Spacelift is a SaaS platform for running and governing Terraform, OpenTofu, Pulumi and Ansible stacks. Kestra is an open-source orchestration platform that runs those same tools as steps in larger workflows: tickets, approvals, configuration, checks and notifications, in YAML you version in Git and run wherever you need."

philosophy:
  mainTitle: IaC Run Management vs. End-to-End Orchestration
  kestra:
    title: "Orchestration Around Every Infrastructure Change"
    description: "Declarative YAML workflows that call Terraform, OpenTofu, Terragrunt, Ansible, Helm, cloud CLIs and any API in one execution, with approvals, retries and event triggers built in. The same engine also runs data, AI and business workflows. Open source, self-hosted on your own network or fully managed in Kestra Cloud."
    subCardText: '"How do we automate the whole change, from the ticket to the Terraform apply to the Ansible run to the Slack message, in one place we own?"'
  competitor:
    title: IaC Management Platform
    description: "Spacelift manages IaC stacks: it runs plans and applies from your VCS, stores state, chains stacks with dependencies, enforces Rego policies on runs, and detects drift. Spacelift Flows, launched in October 2026, adds a visual canvas for day 2 operations. The control plane is SaaS, with private workers and a self-hosted edition on higher tiers."
    shadowColor: "#8B7FF5"
    subCardBg: "var(--ks-background-blue-light)"
    subCardText: '"How do we give every team a governed, GitOps workflow for Terraform and OpenTofu stacks?"'

businessValue:
  mainTitle: "Spacelift Governs the IaC Run.<br />Kestra Orchestrates Everything Around It."
  kestra:
    title: Open-Source Orchestration
    list:
      - "Terraform, OpenTofu, Terragrunt and Ansible as steps in multi-tool workflows"
      - "Event-driven: webhooks, Git pushes, tickets, alerts, schedules and queues start workflows"
      - "Approvals, retries, timeouts and error handling written in the same YAML"
      - "Self-hosted on Kubernetes, VMs or air-gapped networks, or fully managed in Kestra Cloud"
      - "Open source core with {totalPlugins}+ plugins; no per-worker or per-run metering on IaC"
  competitor:
    title: IaC Management Platform
    list:
      - "GitOps runs for Terraform, OpenTofu, Terragrunt, Pulumi, CloudFormation, Kubernetes and Ansible"
      - "Managed state, stack dependencies and a private module registry"
      - "Rego policies on plans, approvals, pushes and access"
      - "Drift detection and remediation on Business and Enterprise tiers"
      - "SaaS control plane; private workers and self-hosting on higher tiers"
    shadowColor: "#8B7FF5"
    bulletColor: "#8B7FF5"
  footerText: "Spacelift is a strong choice when your main need is a governed, managed home for many Terraform and OpenTofu stacks. Kestra is the better fit when an infrastructure change is one step in a longer process, when the platform has to run inside your own network, or when you want a single orchestrator for infrastructure, data and business workflows instead of one tool per domain."

setupSpeed:
  title: Time to First Workflow
  subtitle: "Spacelift is SaaS, so there is nothing to install, but each stack needs a VCS connection, a cloud integration and run settings before the first plan, and private workers need their own deployment. Kestra starts with one Docker Compose command and runs Terraform in a container with no extra setup."
  kestra:
    title:
      one: "~5"
      two: Minutes
    description: "Download the Docker Compose file, spin it up, and you're ready (database and config included). Open the UI, pick a Terraform or Ansible Blueprint, run it."
    command: |
      curl -o docker-compose.yml \
      https://raw.githubusercontent.com/kestra-io/kestra/develop/docker-compose.yml
      docker compose up

      # Open localhost:8080
      # Pick a Terraform Blueprint, run it. Done.
    lang: sh
  competitor:
    title:
      one: "~30"
      two: Minutes
    description: "Sign up, connect your VCS provider, create a stack pointing at a repository and project root, attach a cloud integration for credentials, then trigger the first run. Running inside your network adds a private worker pool, which starts on the Business tier."
    shadowColor: "#8B7FF5"
    command: |
      # 1. Sign up at spacelift.io
      # 2. Install the GitHub / GitLab integration
      # 3. Create a stack: repo, branch, project root
      # 4. Attach an AWS / Azure / GCP integration
      # 5. Add contexts for env vars and secrets
      # 6. Trigger the first run, confirm the apply

      # Private workers (Business tier and up):
      # deploy a worker pool in your network
      # (Docker launcher or Kubernetes operator)
    lang: sh

easeOfUse:
  title: One Workflow vs. Stacks, Dependencies and Policies
  kestra:
    title: "Kestra: The whole change in one YAML file"
    description: "Plan, approval, apply, configuration and notification live in one readable workflow, versioned in Git. Docs are embedded in the editor, the <a href='/docs/develop-with-ai/ai-copilot' target='_blank'>AI Copilot</a> writes flows for you, and Blueprints cover common Terraform and Ansible patterns."
    code: |
      id: provision_and_configure
      namespace: infra.platform

      inputs:
        - id: environment
          type: SELECT
          values: [staging, prod]

      tasks:
        - id: plan
          type: io.kestra.plugin.terraform.cli.TerraformCLI
          beforeCommands:
            - terraform init -input=false
          commands:
            - terraform plan -out=tfplan -var env={{ inputs.environment }}
          outputFiles:
            - tfplan

        - id: approve
          type: io.kestra.plugin.core.flow.Pause
          pauseDuration: PT8H
          behavior: CANCEL

        - id: apply
          type: io.kestra.plugin.terraform.cli.TerraformCLI
          inputFiles:
            tfplan: "{{ outputs.plan.outputFiles.tfplan }}"
          beforeCommands:
            - terraform init -input=false
          commands:
            - terraform apply tfplan
            - terraform output -json > outputs.json
          outputFiles:
            - outputs.json

        - id: configure
          type: io.kestra.plugin.ansible.cli.AnsibleCLI
          commands:
            - ansible-playbook -i inventory.ini site.yml

        - id: notify
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {"text": "{{ inputs.environment }} provisioned and configured"}
    lang: yaml
  competitor:
    title: "Spacelift: Stacks wired together with dependencies and policies"
    description: "In Spacelift, each Terraform root and each Ansible playbook is its own stack. You chain them with stack dependencies, gate them with Rego policies, and configure them in the UI or with the Spacelift Terraform provider. Steps outside IaC, like tickets or notifications, go through hooks, webhooks or Spacelift Flows."
    shadowColor: "#8B7FF5"
    code: |
      resource "spacelift_stack" "network" {
        name              = "network-prod"
        repository        = "infra"
        branch            = "main"
        project_root      = "network"
        terraform_version = "1.9.0"
      }

      resource "spacelift_stack" "config" {
        name         = "config-prod"
        repository   = "infra"
        branch       = "main"
        project_root = "ansible"
        ansible {
          playbook = "site.yml"
        }
      }

      resource "spacelift_stack_dependency" "config_after_network" {
        stack_id            = spacelift_stack.config.id
        depends_on_stack_id = spacelift_stack.network.id
      }

      resource "spacelift_policy" "approval" {
        name = "require-approval"
        type = "APPROVAL"
        body = file("policies/approval.rego")
      }

      resource "spacelift_policy_attachment" "network_approval" {
        policy_id = spacelift_policy.approval.id
        stack_id  = spacelift_stack.network.id
      }
    lang: hcl

