architecture:
  title: "How are n8n and Kestra built?"
  lead: "n8n passes lists of items from node to node on a canvas. Kestra runs a YAML flow where each task hands outputs and files to the next."
  competitor:
    title: "n8n: nodes on a canvas"
    text: "A workflow is a graph of nodes stored as JSON. Each node receives a list of items and runs its operation once per item, and in queue mode the main instance hands executions to workers through Redis."
    list:
      - "Trigger nodes start workflows from webhooks, schedules and app events"
      - "Code nodes run JavaScript or Python against the incoming items"
      - "Credentials are stored encrypted in n8n's database"
      - "SQLite by default; Postgres for teams and queue mode"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file. Kestra validates it against each plugin's schema when you save it and shows the topology before anything runs."
    list:
      - "Webhook, schedule, event and flow triggers"
      - "Script tasks install their dependencies per task, in containers"
      - "Outputs and files stored once and passed by reference"
      - "Task runners send heavy jobs to Kubernetes or your cloud account"

compare:
  title: "What does the same workflow look like in each?"
  lead: "The same workflow in both: a webhook receives a batch of orders, each order is posted to the ERP with up to three tries, and an alert goes out if the run fails."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "n8n workflow"
    file: "order_sync.json"
    lang: json
    code: |
      {
        "nodes": [
          {
            "name": "Orders webhook",
            "type": "n8n-nodes-base.webhook",
            "typeVersion": 2,
            "position": [0, 0],
            "parameters": { "httpMethod": "POST", "path": "orders" }
          },
          {
            "name": "One item per order",
            "type": "n8n-nodes-base.splitOut",
            "typeVersion": 1,
            "position": [220, 0],
            "parameters": { "fieldToSplitOut": "body.orders" }
          },
          {
            "name": "Send to ERP",
            "type": "n8n-nodes-base.httpRequest",
            "typeVersion": 4.2,
            "position": [440, 0],
            "retryOnFail": true,
            "maxTries": 3,
            "parameters": {
              "method": "POST",
              "url": "https://erp.example.com/api/orders",
              "sendBody": true,
              "specifyBody": "json",
              "jsonBody": "={{ JSON.stringify($json) }}"
            }
          }
        ],
        "connections": {
          "Orders webhook": { "main": [[{ "node": "One item per order", "type": "main", "index": 0 }]] },
          "One item per order": { "main": [[{ "node": "Send to ERP", "type": "main", "index": 0 }]] }
        },
        "settings": { "errorWorkflow": "Hx3kP9qLm2Vt7RaZ" }
      }
  kestra:
    code: |
      id: order_sync
      namespace: sales.integrations

      triggers:
        - id: orders_webhook
          type: io.kestra.plugin.core.trigger.Webhook
          key: "{{ secret('ORDERS_WEBHOOK_KEY') }}"

      tasks:
        - id: each_order
          type: io.kestra.plugin.core.flow.Loop
          values: "{{ trigger.body.orders }}"
          tasks:
            - id: send_to_erp
              type: io.kestra.plugin.core.http.Request
              method: POST
              uri: https://erp.example.com/api/orders
              contentType: application/json
              body: "{{ item.value }}"
              retry:
                type: constant
                interval: PT1S
                maxAttempts: 3

      errors:
        - id: alert
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          messageText: "Order sync failed: {{ execution.id }}"

setup:
  title: "What does it take to get n8n and Kestra running?"
  lead: "Both projects start from a Docker Compose setup for a first run."
  competitor:
    title: "n8n"
    tag: "SQLite by default"
    text: "n8n's <a href='https://docs.n8n.io/deploy/host-n8n/install-options/one-line-setup'>one-line setup</a> checks for Docker, writes a Compose file and starts n8n on localhost:5678 with a built-in SQLite database. For a team or production install, the docs point to Docker Compose with Postgres."
    code: |
      curl -fsSL https://get.n8n.io | sh
  kestra:
    title: "Kestra"
    tag: "Database included"
    text: "One Compose file starts Kestra and its Postgres database. Open localhost:8080, pick a blueprint and run it. Production runs the same image on Kubernetes with the <a href='/docs/installation/kubernetes'>Kestra Helm chart</a>."
    code: |
      curl -o docker-compose.yml https://raw.githubusercontent.com/kestra-io/kestra/develop/docker-compose.yml
      docker compose up

pairs:
  - title: "How hard is it to move from n8n to Kestra?"
    columns:
      - label: "Leaving n8n"
        brand: competitor
        text: "Each workflow downloads as a JSON file with its nodes, parameters and connections. Credentials stay behind, since the file holds only their names and IDs. Code nodes use n8n helpers such as $json and $input, so their JavaScript needs small edits to read Kestra inputs."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Trigger nodes become Kestra triggers, HTTP Request nodes become HTTP tasks, app nodes become plugin tasks and Code nodes become Node.js or Python script tasks. While workflows move in waves, a Kestra HTTP task can call an n8n webhook, so both run side by side."
  - title: "How do n8n and Kestra compare on licensing, pricing and self-hosting?"
    columns:
      - label: "n8n"
        brand: competitor
        text: "The Community edition is free to self-host under the Sustainable Use License, which allows use for internal business, non-commercial or personal purposes. Files marked .ee need an n8n Enterprise License, and SSO, Git, environments and projects need a paid plan. n8n Cloud is billed by workflow executions, one per run whatever its step count."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from n8n teams"

commonQuestions:
  - question: "Is n8n open source?"
    answer: "n8n's source code is public on GitHub, but it is licensed under the Sustainable Use License, which limits use to internal business, non-commercial or personal purposes and restricts distribution to free, non-commercial use. Files marked .ee fall under a separate enterprise license. Kestra's open-source edition is Apache 2.0, with no restriction on commercial use."
  - question: "Can I import n8n workflows into Kestra?"
    answer: "Not directly. Download each workflow as JSON and hand it to the AI Copilot, or to your own coding assistant through the Kestra MCP server, to draft a flow that an engineer reviews before it runs. Recreate credentials as Kestra secrets, since the n8n export doesn't carry them."
  - question: "Does Kestra have a visual editor like n8n?"
    answer: "Kestra has a no-code editor that builds a flow from forms, a live topology view and a code editor with the plugin documentation beside it. Every change, from either editor, is saved as YAML, so the same flow can be reviewed in a pull request."
  - question: "Can Kestra run AI agents?"
    answer: "Yes. The AIAgent task gives a model a goal and tools such as web search, code execution or other flows, and LLM tasks handle fixed steps like classification or extraction. Both run as tasks in a flow, next to the data and infrastructure steps around them, with the same retries and logs."
  - question: "What happens when a run fails halfway?"
    answer: "In n8n, a node can retry on failure, an error workflow can send an alert, and the Save execution progress setting lets a run resume where it stopped. In Kestra, each task sets its own retries and timeouts, the errors block runs alert tasks, and <a href='/docs/how-to-guides/replay'>replay</a> reruns an execution from any task, skipping the tasks that already succeeded."
  - question: "Where do credentials live?"
    answer: "Tasks read credentials with the secret() function. The open-source edition reads secrets from environment variables, and Kestra Enterprise reads them from managers such as HashiCorp Vault, AWS Secrets Manager or Azure Key Vault. In n8n, external secrets need a paid plan."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute, and Kestra Enterprise reaches 7,000 a minute. Workers scale horizontally, and Fila runs 2.5 million executions a month on Kestra."

