architecture:
  title: "How are Chef and Kestra built?"
  lead: "Chef describes the state each node should reach and converges it from an agent on the node. Kestra describes the steps of a workflow and runs them from its workers."
  competitor:
    title: "Chef: recipes converged on each node"
    text: "A recipe is Ruby code that declares resources, stored in a cookbook. Chef Infra Client on each node syncs its cookbooks from Chef Infra Server, compiles the resources and acts on them, then reports the run to Chef Automate."
    list:
      - "A run-list sets which recipes apply to a node"
      - "Why-run mode reports changes without making them"
      - "InSpec profiles run in each client's Compliance Phase"
      - "Chef Courier runs ad hoc and scheduled jobs on node groups"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file of tasks that run in sequence, in parallel or in loops. The executor tracks state in Kestra's database and hands each task to a worker, which runs a script, opens an SSH session or calls an API."
    list:
      - "Each plugin task is checked against its schema on save"
      - "Script tasks install their dependencies per task"
      - "Worker groups place workers next to the hosts they manage (Kestra Enterprise)"
      - "Every save creates a revision you can diff and roll back"

compare:
  title: "What does the same rolling restart look like in each?"
  lead: "The same job in both: restart nginx on each web node one at a time, check that it is active, and retry a failed node twice before the job fails."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Chef Courier job"
    file: "restart-nginx.json"
    lang: json
    code: |
      {
        "name": "restart-nginx",
        "scheduleRule": "immediate",
        "exceptionRules": [],
        "target": {
          "executionType": "sequential",
          "groups": [
            {
              "timeoutSeconds": 240,
              "batchSize": { "type": "number", "value": 1 },
              "distributionMethod": "batching",
              "successCriteria": [{ "numRuns": { "type": "percent", "value": 100 }, "status": "success" }],
              "nodeListType": "nodes",
              "nodeIdentifiers": ["--WEB1--", "--WEB2--", "--WEB3--"]
            }
          ]
        },
        "actions": {
          "accessMode": "agent",
          "steps": [
            {
              "name": "restart and check nginx",
              "interpreter": {
                "name": "chef-platform/shell-interpreter",
                "skill": { "minVersion": "1.0.0", "maxVersion": "1.9.99" }
              },
              "command": { "linux": ["sudo systemctl restart nginx", "systemctl is-active nginx"] },
              "retryCount": 2,
              "failureBehavior": {
                "action": "retryThenFail",
                "retryBackoffStrategy": { "type": "linear", "delaySeconds": 1, "arguments": [1, 3, 5] }
              }
            }
          ]
        }
      }
  kestra:
    code: |
      id: restart_nginx
      namespace: ops.runbooks

      inputs:
        - id: hosts
          type: ARRAY
          itemType: STRING
          defaults: [web1.example.com, web2.example.com, web3.example.com]

      tasks:
        - id: each_node
          type: io.kestra.plugin.core.flow.Loop
          values: "{{ inputs.hosts }}"
          concurrencyLimit: 1
          tasks:
            - id: restart
              type: io.kestra.plugin.fs.ssh.Command
              host: "{{ item.value }}"
              username: "{{ secret('SSH_USER') }}"
              authMethod: PUBLIC_KEY
              privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
              retry:
                type: constant
                interval: PT5S
                maxAttempts: 3
              commands:
                - sudo systemctl restart nginx
                - systemctl is-active nginx

pairs:
  - title: "How hard is it to move from Chef to Kestra?"
    columns:
      - label: "Leaving Chef"
        brand: competitor
        text: "Cookbooks describe node state, so they have no direct Kestra equivalent. They can keep running under Chef, or move to Ansible or scripts that Kestra runs. Wrapper scripts, cron jobs and Courier jobs are the parts that move first."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Shell and PowerShell steps run unchanged in script or SSH tasks, node lists become flow inputs or a CMDB lookup, and InSpec runs in a script task. A flow can also run chef-client --once on a node over SSH, so cookbooks keep converging while the steps around them move."
  - title: "What do licensing, pricing and self-hosting look like?"
    columns:
      - label: "Chef"
        brand: competitor
        text: "The source of Chef's open-source projects is Apache 2.0. Progress licenses its binaries as Free (non-production, personal and non-commercial use), Trial (30 days) or Commercial. Chef 360 SaaS is licensed per node, and pricing is quoted on request."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Chef teams"

commonQuestions:
  - question: "Does Kestra replace Chef?"
    answer: "For node configuration, no. Kestra has no agent that converges nodes to a desired state. It takes over the scripts, cron jobs and manual steps around Chef, such as provisioning, approvals, checks and tickets, and can run chef-client as one task when you need it."
  - question: "Can a Kestra flow start a Chef Infra Client run?"
    answer: "Yes. An SSH Command task runs chef-client --once on a node, which skips the interval and splay. A Loop task runs it across a list of nodes, one at a time or in parallel, and the next task can check the result."
  - question: "What does the Chef Infra Server deprecation mean for us?"
    answer: "Progress marks Chef Infra Server as deprecated, with end of life on November 30, 2026, and points to Chef 360 Platform as its replacement. Teams planning that move often review which jobs belong in Chef and which belong in a general orchestrator. The guide to <a href='/resources/infrastructure/chef-alternatives'>Chef alternatives</a> compares other options."
  - question: "How do InSpec checks fit in a Kestra flow?"
    answer: "Run inspec exec in a script task against a target over SSH, keep the report as an output file, and branch on the result with an If task. A failed check can open a ticket or start a remediation flow."
  - question: "Do I need an agent on each node?"
    answer: "No. Kestra workers reach hosts over SSH, call APIs, or run Ansible and Terraform. Worker groups (Kestra Enterprise) run tasks on workers installed inside a specific network."
  - question: "How are passwords and SSH keys stored?"
    answer: "Tasks read credentials with the secret() function. The open-source edition reads secrets from environment variables, and Kestra Enterprise adds namespace-level secrets and external managers such as HashiCorp Vault and Azure Key Vault."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute, and Kestra Enterprise reaches 7,000 a minute. Workers scale horizontally, and Crédit Agricole runs its automation for more than 100 clusters on Kestra."

