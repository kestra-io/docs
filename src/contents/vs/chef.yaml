title: "Kestra vs Chef: Orchestration vs Configuration"
description: "Compare Kestra and Progress Chef: Ruby cookbooks and Courier jobs vs YAML flows, the same rolling restart in both, migration and licensing."
competitorName: Chef
category: Infrastructure Automation
shortDescription: "Ruby cookbooks converged by an agent on every node vs. YAML flows that run scripts, playbooks and API calls as tasks."

brandColor:
  color: "#5ce500"

intro:
  title: "Kestra vs. Chef"
  description: "Chef is Progress's configuration management suite, where Chef Infra Client brings each node to the state its Ruby recipes describe. Kestra is an open-source orchestrator that runs YAML flows, where scripts, SSH commands, Ansible playbooks and Terraform are tasks."

choose:
  title: "Chef or Kestra?"
  competitor:
    title: "Chef is the better fit if"
    list:
      - "You need every node held in a desired state, with an agent that converges it again every 30 minutes by default."
      - "Your team has a cookbook library and Ruby skills, and runs InSpec profiles with each Chef Infra Client run."
      - "You want configuration, compliance scans and fleet jobs from one vendor in Chef 360 Platform."
  kestra:
    title: "Choose Kestra if"
    list:
      - "Your work is multi-step operations such as provisioning, configuration, checks and tickets, more than the state of one node."
      - "Workflows start from webhooks, queue messages and other flows, as well as schedules."
      - "You want workflows in YAML, free to self-host under Apache 2.0, with no license counted per node."

table:
  title: "How do Chef and Kestra compare, feature by feature?"
  rows:
    - label: "What it manages"
      competitor: "Node state, such as packages, files, services and settings"
      kestra: "Workflows of tasks across systems, with no per-node state"
    - label: "Definition"
      competitor: "Recipes in Ruby, grouped in cookbooks, with YAML and JSON recipes for basic cases"
      kestra: "YAML flows, validated against each plugin's schema on save"
    - label: "Where work runs"
      competitor: "Chef Infra Client on each node syncs cookbooks from Chef Infra Server and converges"
      kestra: "Workers run each task and reach hosts over SSH or through APIs"
    - label: "When it runs"
      competitor: "The client runs every 1,800 seconds by default, with a random splay"
      kestra: "Schedules, webhooks, flow triggers, polling and realtime triggers"
    - label: "Ad hoc jobs"
      competitor: "Chef Courier jobs in JSON or YAML, run on node groups in sequential, parallel or batched patterns"
      kestra: "Flows run from the UI, API or a trigger, with Loop and Parallel over hosts"
    - label: "Compliance"
      competitor: "InSpec profiles run in the Compliance Phase of every client run"
      kestra: "No compliance profiles; InSpec or other scanners run as script tasks"
    - label: "Content"
      competitor: "Community cookbooks on Chef Supermarket"
      kestra: "{totalPlugins}+ plugins, versioned apart from the core"
    - label: "Hosting"
      competitor: "Chef 360 Platform as SaaS, on an embedded cluster or on your own Kubernetes; Chef Infra Server reaches end of life on November 30, 2026"
      kestra: "Self-hosted, air-gapped (Kestra Enterprise), or Kestra Cloud"
    - label: "Pricing"
      competitor: "Chef 360 SaaS licensed per node; quoted on request"
      kestra: "Free open source; Kestra Cloud billed on usage"
    - label: "License"
      competitor: "Apache 2.0 source; Progress binaries under Free, Trial or Commercial licenses"
      kestra: "Apache 2.0"

