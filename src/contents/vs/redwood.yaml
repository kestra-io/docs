title: "Kestra vs Redwood RunMyJobs: Workload Automation"
description: "Compare Kestra and Redwood RunMyJobs: a SaaS job scheduler built around SAP vs open-source YAML flows, how each is built, pricing, hosting and migration."
competitorName: Redwood
category: Infrastructure Automation
shortDescription: "Redwood's SaaS workload automation, built around SAP, vs. open-source YAML flows you self-host or run on Kestra Cloud."

brandColor:
  color: "#e24650"

intro:
  title: "Kestra vs. Redwood RunMyJobs"
  description: "RunMyJobs by Redwood is a SaaS workload automation service, endorsed by SAP, that runs process and chain definitions across SAP and other systems. Kestra is an open-source orchestrator that runs YAML flows on your own infrastructure or on Kestra Cloud."

choose:
  title: "Redwood RunMyJobs or Kestra?"
  competitor:
    title: "Redwood RunMyJobs is the better fit if"
    list:
      - "Your automation centers on SAP, and you want the SAP Endorsed App that is part of the RISE with SAP reference architecture."
      - "You want a fully managed scheduler with a 99.95% uptime guarantee and no servers of your own to run."
      - "You want job scheduling and managed file transfer from one vendor."
  kestra:
    title: "Choose Kestra if"
    list:
      - "You need to self-host, including air-gapped, or want the choice between self-hosting and a managed cloud."
      - "Engineers want to define workflows in YAML, review them in Git and deploy them through CI/CD."
      - "Your workflows reach past ERP into data pipelines, infrastructure and scripts in Python, SQL or shell."

table:
  title: "How do Redwood RunMyJobs and Kestra compare, feature by feature?"
  rows:
    - label: "Workflow definition"
      competitor: "Process and chain definitions built in the RunMyJobs editors, with RedwoodScript for custom logic"
      kestra: "YAML flows, validated against each plugin's schema on save"
    - label: "Hosting"
      competitor: "Single-tenant SaaS run by Redwood"
      kestra: "Self-hosted, air-gapped (Kestra Enterprise), or Kestra Cloud"
    - label: "Upgrades"
      competitor: "Redwood handles updates, availability and maintenance"
      kestra: "You upgrade self-hosted instances; Kestra Cloud is managed for you"
    - label: "SAP"
      competitor: "SAP Endorsed App, Premium certified, part of the RISE with SAP reference architecture"
      kestra: "No SAP-certified integration; flows call SAP APIs over HTTP or submit RunMyJobs processes (Kestra Enterprise)"
    - label: "File transfer"
      competitor: "Managed file transfer, with JSCAPE and Cerberus as separate Redwood products"
      kestra: "SFTP, FTP and FTPS tasks and triggers, with OpenPGP encryption"
    - label: "Environments"
      competitor: "Up to three pre-production environments included"
      kestra: "Separate instances per environment, with flow promotion between them (Kestra Enterprise)"
    - label: "Pricing"
      competitor: "Quote only"
      kestra: "Free open source; Kestra Cloud billed on usage"
    - label: "License"
      competitor: "Proprietary"
      kestra: "Apache 2.0"

