architecture:
  title: "How are Redwood RunMyJobs and Kestra built?"
  lead: "RunMyJobs runs as a service that Redwood hosts and connects to your systems through connectors and agents. Kestra runs where you deploy it, or on Kestra Cloud."
  competitor:
    title: "RunMyJobs: SaaS with agents"
    text: "Redwood runs the RunMyJobs servers. Chain definitions call process definitions as steps, and each process runs through a queue on a process server, reaching SAP and cloud applications through connectors and your own servers through Platform Agents."
    list:
      - "Chain steps map parameters from the chain or earlier steps"
      - "Process definition types decide which service runs a process"
      - "Platform Agents run OS-level jobs on your servers"
      - "A Platform Agent behind your firewall can act as a secure gateway over HTTPS"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file of tasks, triggers and error handlers. The executor tracks state in Kestra's database and hands each task to a worker, which calls an API or runs a script."
    list:
      - "Plugin tasks call databases, file servers, clouds and SaaS APIs"
      - "Script tasks install their dependencies per task"
      - "Worker groups run tasks inside a given network (Kestra Enterprise)"
      - "Every save creates a revision you can diff and roll back"

pairs:
  - title: "How hard is it to move from Redwood RunMyJobs to Kestra?"
    columns:
      - label: "Leaving Redwood RunMyJobs"
        brand: competitor
        text: "Process and chain definitions live inside RunMyJobs, with parameters mapped between steps and RedwoodScript for custom logic. SAP jobs depend on Redwood's SAP connectors, which have no one-to-one equivalent in Kestra."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Scripts move into shell, Python or PowerShell tasks. Each chain becomes a flow, each step a task and each schedule a trigger. During the move, the RunMyJobs task (Kestra Enterprise) submits existing process definitions from a flow and can wait for them to finish, so SAP chains can stay in RunMyJobs while the rest moves."
  - title: "What do licensing, pricing and self-hosting look like?"
    columns:
      - label: "Redwood RunMyJobs"
        brand: competitor
        text: "A proprietary SaaS service, priced by quote. Redwood includes its enterprise connectors and templates, and up to three pre-production environments, at no extra cost, along with 24x7 support."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Redwood RunMyJobs teams"

commonQuestions:
  - question: "Can Kestra run our SAP jobs?"
    answer: "Kestra has no SAP-certified integration. Flows can call SAP APIs over HTTP, and the RunMyJobs task (Kestra Enterprise) submits RunMyJobs process definitions, SAP ones included, and waits for them to finish. Many teams keep SAP scheduling in RunMyJobs and move the surrounding data and infrastructure work to Kestra."
  - question: "Do we have to run Kestra ourselves?"
    answer: "No. Kestra Cloud is a managed service. Teams whose data has to stay on their own network self-host the open-source edition or Kestra Enterprise on Docker or Kubernetes, air-gapped if needed."
  - question: "How does Kestra reach servers behind our firewall?"
    answer: "Self-hosted Kestra runs inside your network, so its workers reach databases, file servers and APIs directly. Commands that must run on a given machine can go over SSH with the SSH Command task, and worker groups (Kestra Enterprise) place workers in the networks that need them."
  - question: "Can Kestra convert our chain definitions?"
    answer: "Partly. Describe a chain and its process definitions to the AI Copilot, or hand them to your own coding assistant through the Kestra MCP server, and it drafts a flow for an engineer to review. RedwoodScript logic is rewritten as script tasks or Kestra expressions during that review."
  - question: "How does Kestra handle access control and audit?"
    answer: "Namespaces separate each team's flows, files and secrets. Kestra Enterprise adds RBAC, SSO through OIDC or LDAP, SCIM provisioning and audit logs, and reads secrets from HashiCorp Vault, AWS Secrets Manager, Azure Key Vault or Google Secret Manager."
  - question: "How are flows versioned and promoted?"
    answer: "Each save creates a revision you can diff or roll back. Flows sync with Git, the Terraform provider or a CI/CD pipeline deploys them from a repository, and Kestra Enterprise promotes flows from one environment to the next."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres runs 4,000 executions a minute and Kestra Enterprise reaches 7,000, with workers that scale horizontally. FILA runs 2.5 million executions a month on Kestra."

