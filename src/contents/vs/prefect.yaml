title: "Kestra vs Prefect: Python Workflow Orchestration"
description: "Compare Kestra and Prefect: Python flows and work pools vs. YAML flows, the same daily API-to-S3 job in both, setup, migration and pricing."
competitorName: Prefect
category: Data Orchestration
shortDescription: "Decorated Python functions run by your workers vs. YAML flows that run scripts in any language."

brandColor:
  color: "#2d6df6"

intro:
  title: "Kestra vs. Prefect"
  description: "Prefect is a Python workflow orchestration framework that turns functions into flows and tasks with decorators, and runs them from a served process or a worker. Kestra is a declarative orchestration platform: workflows are YAML, and Python, SQL, shell and other languages run as tasks."

choose:
  title: "Prefect or Kestra?"
  competitor:
    title: "Prefect is the better fit if"
    list:
      - "Your workflows are Python and you want ordinary if statements, loops and function calls to drive them."
      - "Your engineers would rather add a decorator to existing code than write workflow definitions."
      - "You want Prefect Cloud to run flows on push or managed work pools, with no worker of your own."
  kestra:
    title: "Choose Kestra if"
    list:
      - "Workflows belong to several teams, and some of those people don't write Python."
      - "You want the schedule, triggers, retries and error handling declared in one file you review in Git."
      - "You need RBAC, SSO and audit logs on infrastructure you run yourself."

table:
  title: "How do Prefect and Kestra compare, feature by feature?"
  rows:
    - label: "Workflow definition"
      competitor: "Python functions decorated with @flow and @task"
      kestra: "YAML flows holding tasks, triggers and retries in one file"
    - label: "Control flow"
      competitor: "Native Python: if, for and function calls"
      kestra: "If, Switch, Loop, Parallel and Subflow tasks"
    - label: "Languages"
      competitor: "Python"
      kestra: "Python plus SQL, Node.js, Go, R, shell and others, each as a task"
    - label: "Schedules and events"
      competitor: "Cron, interval and RRule schedules, plus automations that react to events"
      kestra: "Schedules, webhooks, flow triggers, polling and realtime triggers"
    - label: "Where runs execute"
      competitor: "A process started with serve(), or workers polling a work pool"
      kestra: "Kestra workers, with task runners for containers"
    - label: "Integrations"
      competitor: "Python packages such as prefect-aws, prefect-dbt and prefect-snowflake"
      kestra: "{totalPlugins}+ plugins, versioned apart from the core"
    - label: "Access control"
      competitor: "RBAC, SSO and audit logs in Prefect Cloud"
      kestra: "RBAC, SSO and audit logs in Kestra Enterprise, which you can self-host"
    - label: "Hosting"
      competitor: "Self-hosted server, or Prefect Cloud with hybrid, push or managed work pools"
      kestra: "Self-hosted, air-gapped (Kestra Enterprise), or Kestra Cloud"
    - label: "License"
      competitor: "Apache 2.0"
      kestra: "Apache 2.0"
    - label: "GitHub stars"
      competitor: "24k+"
      kestra: "30k+"

proof:
  title: "Which data teams picked Kestra over Prefect?"
  stories:
    - story: boosted-productivity-slashed-costs-and-accelerated-delivery
      industry: "Advertising"
      stat: ">90%"
      label: "lower toolchain costs after replacing SuperMetrics, Prefect and dbt Cloud with Kestra."
    - story: apple-ml-team-orchestrates-large-scale-data-pipelines-with-kestra
      industry: "Technology"
      stat: "200"
      label: "ML engineers run ETL on Kestra, picked over Prefect and Dagster when the team left Airflow."

architecture:
  title: "How are Prefect and Kestra built?"
  lead: "Prefect orchestrates Python code that you deploy and run. Kestra reads a YAML definition and runs each task on its own workers."
  competitor:
    title: "Prefect: decorated Python"
    text: "A flow is a Python function with the @flow decorator, and it calls tasks that can retry, cache and run concurrently. A deployment tells the server when to run the flow and where its code lives."
    list:
      - "serve() starts a long-running process that watches the server for runs"
      - "Workers poll work pools and start runs on your infrastructure"
      - "Push and managed work pools run flows without a worker"
      - "The server keeps state in SQLite by default, or PostgreSQL"
  kestra:
    title: "Kestra: YAML flows"
    text: "A flow lists its tasks, inputs, triggers and error handlers in one YAML file. The executor tracks each execution's state and dispatches tasks, and workers run them."
    list:
      - "Flows are validated against plugin schemas when saved"
      - "Triggers are declared in the flow, next to the tasks"
      - "Script tasks install their dependencies at run time"
      - "Every save creates a revision you can diff and roll back"

compare:
  title: "What does the same job look like in each?"
  lead: "The same job in both: an API call retried twice, a Python step that writes a CSV, an upload to S3, a daily schedule and a Slack alert when the run fails."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Prefect flow"
    file: "exchange_rates.py"
    lang: python
    code: |
      import csv
      from datetime import date

      import boto3
      import httpx
      from prefect import flow, task
      from prefect.blocks.notifications import SlackWebhook

      @task(retries=2, retry_delay_seconds=60)
      def fetch_rates() -> dict:
          response = httpx.get("https://api.example.com/rates")
          response.raise_for_status()
          return response.json()["rates"]

      @task
      def to_csv(rates: dict) -> str:
          with open("rates.csv", "w", newline="") as f:
              writer = csv.writer(f)
              writer.writerow(["currency", "rate"])
              writer.writerows(rates.items())
          return "rates.csv"

      @task
      def upload(path: str) -> None:
          boto3.client("s3").upload_file(path, "finance-data", f"rates/{date.today()}.csv")

      def notify(flow, flow_run, state):
          SlackWebhook.load("data-alerts").notify(f"{flow_run.name} failed")

      @flow(on_failure=[notify])
      def exchange_rates():
          upload(to_csv(fetch_rates()))

      if __name__ == "__main__":
          exchange_rates.serve(name="daily", cron="0 7 * * *")
  kestra:
    code: |
      id: exchange_rates
      namespace: company.finance

      tasks:
        - id: fetch_rates
          type: io.kestra.plugin.core.http.Request
          uri: https://api.example.com/rates
          retry:
            type: constant
            interval: PT1M
            maxAttempts: 3

        - id: to_csv
          type: io.kestra.plugin.scripts.python.Script
          inputFiles:
            rates.json: "{{ outputs.fetch_rates.body }}"
          outputFiles:
            - rates.csv
          script: |
            import csv, json
            rates = json.load(open("rates.json"))["rates"]
            with open("rates.csv", "w", newline="") as f:
                writer = csv.writer(f)
                writer.writerow(["currency", "rate"])
                writer.writerows(rates.items())

        - id: upload
          type: io.kestra.plugin.aws.s3.Upload
          from: "{{ outputs.to_csv.outputFiles['rates.csv'] }}"
          bucket: finance-data
          key: "rates/{{ execution.startDate | date('yyyy-MM-dd') }}.csv"
          region: eu-west-1

      errors:
        - id: slack_alert
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          messageText: "exchange_rates failed: {{ execution.id }}"

      triggers:
        - id: daily
          type: io.kestra.plugin.core.trigger.Schedule
          cron: "0 7 * * *"

setup:
  title: "What does it take to get Prefect and Kestra running?"
  lead: "Both projects publish a Docker image for a first local run."
  competitor:
    title: "Prefect"
    tag: "Server plus runner"
    text: "Prefect's <a href='https://docs.prefect.io/v3/get-started/quickstart'>quickstart</a> starts the API and UI on localhost:4200 with one Docker command. Scheduled runs also need a process running serve(), or a worker polling a work pool. The server uses SQLite by default, and Prefect recommends PostgreSQL for production."
    code: |
      docker run -p 4200:4200 -d --rm prefecthq/prefect:3-python3.12 prefect server start --host 0.0.0.0
      prefect config set PREFECT_API_URL=http://127.0.0.1:4200/api
      python exchange_rates.py
  kestra:
    title: "Kestra"
    tag: "Database included"
    text: "One Compose file starts Kestra and its Postgres database. Open localhost:8080, pick a blueprint and run it. Production runs the same image on Kubernetes with the <a href='/docs/installation/kubernetes'>Kestra Helm chart</a>."
    code: |
      curl -o docker-compose.yml https://raw.githubusercontent.com/kestra-io/kestra/develop/docker-compose.yml
      docker compose up

pairs:
  - title: "How hard is it to move from Prefect to Kestra?"
    columns:
      - label: "Leaving Prefect"
        brand: competitor
        text: "Prefect code is plain Python with decorators on top, so the task bodies come out cleanly. The work sits in what the decorators and deployments carry: retries, caching, blocks for credentials, schedules and the work pool each deployment targets."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Each task body runs in a Python script task, or is replaced by a plugin task when one exists. Retries move to the task's retry block, blocks to secrets, deployments and schedules to triggers, and on_failure hooks to the errors block. Prefect and Kestra can run in parallel during the move."
  - title: "How do Prefect and Kestra compare on licensing, pricing and self-hosting?"
    lead: "Both projects are open source under Apache 2.0, and both can run on your own servers."
    columns:
      - label: "Prefect"
        brand: competitor
        text: "Apache 2.0 and free to self-host, though the open-source server has no RBAC, SSO or audit logs. Prefect Cloud has a free Hobby plan for 2 users and 5 deployments; paid plans are quoted on request."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Prefect teams"

commonQuestions:
  - question: "Can my Prefect tasks run in Kestra without changes?"
    answer: "The code inside them can. Remove the decorators, read inputs from files or flow variables, and the function body runs in a Python script task with its own dependencies. Prefect-specific calls, such as loading blocks or using task caching, need a Kestra equivalent like secrets or the KV Store."
  - question: "What replaces Prefect blocks?"
    answer: "Credentials go into Kestra secrets, read with the secret() function in any task property. Shared configuration that isn't secret, such as bucket names or API endpoints, fits in the KV Store and is read with the kv() function."
  - question: "How does Kestra handle dynamic workflows that Prefect writes as Python loops?"
    answer: "A Loop task runs its child tasks once per item in a list that an earlier task produced, sequentially or in parallel. A Subflow task starts another flow per item when the work is larger, and If and Switch tasks pick a branch at run time."
  - question: "Do I need workers and work pools in Kestra?"
    answer: "Kestra ships its own workers, so a single docker compose up runs flows without any extra process. To send heavy scripts elsewhere, a task runner starts the task in a container, or in Kubernetes and cloud batch services with Kestra Enterprise."
  - question: "How does Kestra react to events compared to Prefect automations?"
    answer: "In Kestra the trigger lives in the flow file. Webhook triggers expose a URL per flow, polling triggers watch S3, databases and file systems, and realtime triggers start an execution for each message on Kafka, SQS, Pub/Sub, AMQP or MQTT. Flow triggers start one flow when another finishes."
  - question: "How does Kestra fit into Git and CI/CD?"
    answer: "Flows are YAML files, so they are reviewed in pull requests like any other code. Git sync keeps a namespace in step with a repository, and the Terraform provider and GitHub Actions deploy flows from CI. Every change in the UI is saved as a revision."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres handles 4,000 executions a minute and Kestra Enterprise 7,000. Foundation Data runs more than 50 production workflows on Kestra with one engineer."

