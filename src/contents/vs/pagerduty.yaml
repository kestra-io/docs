architecture:
  title: "How are PagerDuty Process Automation and Kestra built?"
  lead: "PagerDuty Process Automation runs Rundeck jobs and ties them to PagerDuty incidents. Kestra runs flows that any event, schedule or person can start."
  competitor:
    title: "Process Automation: Rundeck jobs, run by PagerDuty or by you"
    text: "A job is a list of steps with options and a node filter. The SaaS edition hands steps to Runbook Runners inside your network, and the self-hosted edition runs them from its own servers or through runners."
    list:
      - "Runners poll PagerDuty's public endpoint for steps to run"
      - "Node executors reach hosts over SSH or WinRM"
      - "Automation Actions expose jobs as buttons on PagerDuty services"
      - "Jobs can be drafted from a prompt with AI-generated runbooks"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file of tasks, triggers and error handling. The executor tracks state in Kestra's database and hands each task to a worker, which runs a script, opens an SSH session or calls an API."
    list:
      - "Webhook triggers accept PagerDuty, ServiceNow or monitoring events"
      - "Pause tasks wait for an approval before the next step"
      - "Outputs and files pass from one task to the next"
      - "Every save creates a revision you can diff and roll back"

compare:
  title: "What does the same remediation runbook look like in each?"
  lead: "The same runbook in both: the responder picks restart or rollback, and the action runs on each web server in turn."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Runbook Automation job"
    file: "web-remediation.yaml"
    lang: yaml
    code: |
      - name: web-remediation
        group: incident/web
        description: Restart or roll back the web service on the web nodes
        loglevel: INFO
        options:
        - name: action
          required: true
          enforced: true
          values:
          - restart
          - rollback
        nodefilters:
          dispatch:
            threadcount: 1
            keepgoing: false
          filter: 'tags: web'
        sequence:
          keepgoing: false
          strategy: node-first
          commands:
          - type: conditional
            nodeStep: true
            conditionGroups:
              - - key: "${option.action}"
                  operator: "=="
                  value: restart
            subSteps:
              - exec: sudo systemctl restart web
          - type: conditional
            nodeStep: true
            conditionGroups:
              - - key: "${option.action}"
                  operator: "=="
                  value: rollback
            subSteps:
              - exec: sudo /opt/web/rollback.sh
  kestra:
    code: |
      id: web_remediation
      namespace: ops.incident

      inputs:
        - id: action
          type: SELECT
          values: [restart, rollback]
        - id: hosts
          type: ARRAY
          itemType: STRING

      tasks:
        - id: each_host
          type: io.kestra.plugin.core.flow.Loop
          values: "{{ inputs.hosts }}"
          tasks:
            - id: remediate
              type: io.kestra.plugin.core.flow.Switch
              value: "{{ inputs.action }}"
              cases:
                restart:
                  - id: restart
                    type: io.kestra.plugin.fs.ssh.Command
                    host: "{{ item.value }}"
                    username: "{{ secret('SSH_USER') }}"
                    password: "{{ secret('SSH_PASSWORD') }}"
                    commands: [sudo systemctl restart web]
                rollback:
                  - id: rollback
                    type: io.kestra.plugin.fs.ssh.Command
                    host: "{{ item.value }}"
                    username: "{{ secret('SSH_USER') }}"
                    password: "{{ secret('SSH_PASSWORD') }}"
                    commands: [sudo /opt/web/rollback.sh]

pairs:
  - title: "How hard is it to move from PagerDuty Process Automation to Kestra?"
    columns:
      - label: "Leaving PagerDuty Process Automation"
        brand: competitor
        text: "Jobs export as YAML, but Automation Actions, runners, node sources and ACL policies live in PagerDuty and Runbook Automation. Each action responders press on an incident needs a new entry point before the job behind it moves."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Job steps become SSH, shell, PowerShell or Ansible tasks, options become inputs, and conditional steps become If or Switch tasks. A PagerDuty webhook subscription can start a flow through a Webhook trigger, so incidents keep starting automation while jobs move one at a time."
  - title: "How do PagerDuty Process Automation and Kestra compare on licensing, pricing and self-hosting?"
    columns:
      - label: "PagerDuty Process Automation"
        brand: competitor
        text: "Proprietary. PagerDuty lists Runbook Automation as an add-on purchased separately, with no published price, and Automation Actions need a PD Automation Actions user license. Rundeck Community stays free under Apache 2.0, without the commercial features."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from PagerDuty Process Automation teams"

commonQuestions:
  - question: "Are PagerDuty Process Automation and Runbook Automation the same product?"
    answer: "Yes. PagerDuty renamed Rundeck Enterprise to Process Automation, and its support pages now call the product PagerDuty Runbook Automation, formerly Rundeck Enterprise. PagerDuty's docs and UI still use both names, for example in the runner types."
  - question: "Can a PagerDuty incident start a Kestra flow?"
    answer: "Yes. A PagerDuty webhook subscription posts incident events such as incident.triggered to a Kestra Webhook trigger, and the flow reads the incident from the request body. When a flow fails, a PagerDuty task can open an alert in PagerDuty."
  - question: "Can responders approve a step before it runs?"
    answer: "Yes. A Pause task stops the execution until someone resumes it, and it can ask for inputs on resume, such as a reason or a choice of action, which the next tasks can read."
  - question: "Can jobs stay in Runbook Automation while we move?"
    answer: "Yes. A Kestra HTTP task can start an existing job through the Rundeck API, so a flow can call a job that hasn't moved yet. Move one runbook at a time and keep the incident entry point working throughout."
  - question: "Does Kestra run on-premises and in air-gapped networks?"
    answer: "Yes. Kestra runs on Docker or Kubernetes in your own data center, including air-gapped networks, with Postgres as its database. Kestra Cloud is the hosted option."
  - question: "How do people outside the ops team run a runbook?"
    answer: "A flow's inputs become a form in the Kestra UI, with select and multi-select fields. Kestra Enterprise adds Apps, which turn a flow into a self-service page, and RBAC limits who can run what in each namespace."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute, and Kestra Enterprise reaches 7,000 a minute. Realtime triggers start a flow for each message on Kafka, SQS and other queues."

