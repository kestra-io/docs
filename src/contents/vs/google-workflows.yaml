title: "Google Workflows Alternative: Kestra Compared"
description: "Compare Kestra and Google Cloud Workflows: steps that call APIs vs flows that also run code, the same BigQuery pipeline in both, limits, pricing and hosting."
competitorName: Google Workflows
category: Data Orchestration
shortDescription: "Serverless step orchestration of Google Cloud APIs vs. YAML flows that call services and run code, on any cloud."

brandColor:
  color: "#4285f4"
  gradient: "linear-gradient(90deg, #4285f4, #669df6, #aecbfa)"

intro:
  title: "Kestra vs. Google Workflows"
  description: "Google Workflows is a serverless Google Cloud service that runs steps written in YAML or JSON, calling Google Cloud APIs and HTTP endpoints in the order you define. Kestra is an open-source orchestrator whose YAML flows call those same services and also run Python, SQL and shell code, on Google Cloud, other clouds or your own servers."

choose:
  title: "Google Workflows or Kestra?"
  competitor:
    title: "Google Workflows is the better fit if"
    list:
      - "Your logic already lives in Cloud Run services and Google Cloud APIs, and you only need to call them in order."
      - "You want nothing to operate and a bill counted in steps, with 5,000 internal and 2,000 external steps free each month."
      - "Your workflows start from Eventarc events or Pub/Sub messages inside Google Cloud."
  kestra:
    title: "Choose Kestra if"
    list:
      - "You want to run Python, SQL, dbt or shell code as a step, with no service to deploy for each piece of logic."
      - "Your steps hand each other files or result sets larger than a workflow's 512 KB of variable memory."
      - "You orchestrate Google Cloud, other clouds and on-premises systems from one place."

table:
  title: "How do Google Workflows and Kestra compare, feature by feature?"
  rows:
    - label: "Workflow definition"
      competitor: "YAML or JSON steps, up to 128 KB of source"
      kestra: "YAML flows, checked against plugin schemas on save"
    - label: "Running code"
      competitor: "None in the workflow; logic runs in the services it calls"
      kestra: "Python, SQL, dbt, shell, Node.js and more as tasks"
    - label: "Integrations"
      competitor: "Connectors for Google Cloud APIs, plus HTTP calls to any endpoint"
      kestra: "{totalPlugins}+ plugins, including BigQuery, GCS, Pub/Sub, Dataproc and Vertex AI, plus HTTP"
    - label: "Data between steps"
      competitor: "512 KB for all variables; HTTP responses up to 2 MB"
      kestra: "Task outputs, with files kept in internal storage and passed by URI"
    - label: "Triggers"
      competitor: "Cloud Scheduler, Eventarc events, Pub/Sub messages and API calls"
      kestra: "Schedules with backfills, webhooks, flow triggers, and GCS or Pub/Sub triggers"
    - label: "Parallelism"
      competitor: "Up to 10 branches per parallel step and 20 concurrent branches or iterations per execution"
      kestra: "Parallel and Loop tasks, spread across workers"
    - label: "Operations"
      competitor: "Serverless, with no charge while idle"
      kestra: "Self-hosted on Docker or Kubernetes, or managed on Kestra Cloud"
    - label: "Execution history"
      competitor: "Kept for 90 days after an execution completes"
      kestra: "Kept in your database until a purge task removes it"
    - label: "Pricing"
      competitor: "Billed per internal and external step after a monthly free tier"
      kestra: "No per-step fees in open source; Kestra Cloud billed on usage"
    - label: "License"
      competitor: "Proprietary Google Cloud service"
      kestra: "Apache 2.0"

