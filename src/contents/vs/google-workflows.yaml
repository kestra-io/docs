architecture:
  title: "How are Google Workflows and Kestra built?"
  lead: "Google Workflows orchestrates services that already exist. Kestra calls services too, and runs code on its own workers."
  competitor:
    title: "Google Workflows: steps that call services"
    text: "A workflow is a list of steps that assign variables, branch, loop and call HTTP endpoints or connectors. Workflows keeps each execution's state while it waits on a call, a callback or a sleep, for up to a year."
    list:
      - "Connectors wrap Google Cloud APIs and wait on long-running operations"
      - "try, retry and except blocks handle errors per step"
      - "Subworkflows split a definition into reusable parts"
      - "Callbacks pause an execution until an HTTP request arrives"
  kestra:
    title: "Kestra: flows that call services and run code"
    text: "A flow is a YAML file of tasks. Workers run plugin tasks against APIs and run scripts in containers, and the executor stores the state and outputs of every task run."
    list:
      - "Python, SQL and shell scripts run with their own dependencies"
      - "Task runners send heavy jobs to Cloud Run, Google Batch or Kubernetes"
      - "Namespaces hold each team's flows, files and secrets"
      - "Subflows reuse one flow inside another"

compare:
  title: "What does the same BigQuery pipeline look like in each?"
  lead: "The same pipeline in both: a BigQuery insert, a call to a Cloud Run service with retries, and an alert if either step fails."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Google Workflows definition"
    file: "orders_daily.yaml"
    lang: yaml
    code: |
      main:
        steps:
          - run_pipeline:
              try:
                steps:
                  - build_daily_orders:
                      call: googleapis.bigquery.v2.jobs.insert
                      args:
                        projectId: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
                        body:
                          configuration:
                            query:
                              query: INSERT INTO shop.daily_orders SELECT * FROM shop.orders WHERE order_date = CURRENT_DATE()
                              useLegacySql: false
                      result: query_job
                  - refresh_service:
                      try:
                        call: http.post
                        args:
                          url: https://orders-sync-abc123-uc.a.run.app/refresh
                          auth:
                            type: OIDC
                          body:
                            job_id: ${query_job.jobReference.jobId}
                      retry: ${http.default_retry}
              except:
                as: e
                steps:
                  - post_alert:
                      call: http.post
                      args:
                        url: https://alerts.example.com/hooks/orders
                        body:
                          text: orders_daily failed
                  - fail:
                      raise: ${e}
  kestra:
    code: |
      id: orders_daily
      namespace: company.analytics

      tasks:
        - id: build_daily_orders
          type: io.kestra.plugin.gcp.bigquery.Query
          sql: |
            INSERT INTO shop.daily_orders
            SELECT * FROM shop.orders WHERE order_date = CURRENT_DATE()

        - id: refresh_service
          type: io.kestra.plugin.gcp.function.HttpFunction
          httpMethod: POST
          url: https://orders-sync-abc123-uc.a.run.app/refresh
          httpBody:
            job_id: "{{ outputs.build_daily_orders.jobId }}"
          retry:
            type: exponential
            interval: PT1S
            maxInterval: PT1M
            delayFactor: 1.25
            maxAttempts: 6

      errors:
        - id: post_alert
          type: io.kestra.plugin.core.http.Request
          method: POST
          uri: "{{ secret('ALERT_WEBHOOK_URL') }}"
          body: '{"text": "orders_daily failed: {{ execution.id }}"}'

pairs:
  - title: "How hard is it to move from Google Workflows to Kestra?"
    columns:
      - label: "Leaving Google Workflows"
        brand: competitor
        text: "The workflow definition is often short, because the logic sits in the Cloud Run services and functions it calls, each with its own deployment, service account and IAM bindings. Expressions use the Workflows syntax and standard library, so each one is rewritten."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Each call step becomes an HTTP, Cloud Run or plugin task, connectors such as BigQuery map to Kestra's GCP plugins, and try, retry and except become task retries and an errors block. Code from small single-purpose functions can move into script tasks, and services other systems depend on stay where they are."
  - title: "What do licensing, pricing and self-hosting look like?"
    columns:
      - label: "Google Workflows"
        brand: competitor
        text: "A proprietary Google Cloud service with no self-hosted version. Each month, 5,000 internal steps and 2,000 external HTTP steps are free. After that, internal and external steps are billed separately, and every retry attempt counts as a step. The Cloud Run services and APIs a workflow calls are billed on their own."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Google Workflows teams"

commonQuestions:
  - question: "Does Kestra run on Google Cloud?"
    answer: "Yes. Kestra runs on GKE or a Compute Engine VM, with Cloud SQL for PostgreSQL as its database and Cloud Storage as internal storage. Plugins cover BigQuery, Cloud Storage, Pub/Sub, Dataproc, Firestore and Vertex AI."
  - question: "Can we keep our Cloud Run services?"
    answer: "Yes. A flow calls them with an HTTP task, or with the GCP HttpFunction task, which authenticates with a Google service account. Functions that only exist to wrap a short script can become script tasks instead."
  - question: "Which costs less, per-step pricing or Kestra?"
    answer: "For a few small workflows, the Workflows free tier and per-step price cost very little. Kestra open source has no per-step or per-execution fee, so the cost is the infrastructure it runs on, while Kestra Cloud is billed on usage. In both cases the services each step calls are billed separately."
  - question: "Can a Kestra flow wait for a person or an outside system?"
    answer: "Yes. The Pause task holds an execution until someone resumes it from the UI or the API, and a Webhook trigger starts a flow when another system calls its URL. Google Workflows covers the same need with callbacks."
  - question: "How does Kestra authenticate to Google Cloud?"
    answer: "GCP tasks use a service account key stored as a Kestra secret, impersonate another service account, or use the default credentials of the worker. Kestra Enterprise can also read secrets from Google Secret Manager."
  - question: "Can Kestra translate our existing workflow definitions?"
    answer: "Partly. Give a workflow's YAML to the AI Copilot, or to your own coding assistant through the Kestra MCP server, and review the flow it drafts before you run it. While you migrate, a Kestra flow can run an existing workflow and wait for its result with gcloud workflows run in the gcloud CLI task."
  - question: "How much load can Kestra take?"
    answer: "Kestra's <a href='/docs/performance/benchmark'>benchmark</a> puts the open-source edition on Postgres at 4,000 executions a minute and Kestra Enterprise at 7,000. Workers scale horizontally, and Leroy Merlin runs more than 5,000 flows on Kestra."

