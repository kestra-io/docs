title: "Tines Alternative: Kestra vs Tines"
description: "Compare Kestra and Tines: stories on a storyboard vs YAML flows in Git. The same alert triage in both, plus code steps, hosting, migration and pricing."
competitorName: Tines
category: Business Automation
shortDescription: "Automations built as stories on a storyboard vs. open-source YAML flows for security, data and infrastructure work."

brandColor:
  color: "#6B4FBB"

intro:
  title: "Kestra vs. Tines"
  description: "Tines is a workflow platform where security, IT and other teams build automations and AI agents as stories on a visual storyboard. Kestra is an open-source orchestrator that runs YAML flows, so security workflows can share one platform with data pipelines and infrastructure automation."

choose:
  title: "Tines or Kestra?"
  competitor:
    title: "Tines is the better fit if"
    list:
      - "Your security analysts build and change their own workflows on a storyboard, with drafts and approvals before a change goes live."
      - "You want to start from a library of pre-built stories for security and IT operations tools."
      - "Your team wants to start free, with unlimited users on a few live workflows, in a vendor-run cloud."
  kestra:
    title: "Choose Kestra if"
    list:
      - "Your alerts feed data work too, such as enrichment at volume, dbt models and warehouse queries."
      - "You want workflows as YAML, reviewed in Git and promoted like code."
      - "You want to self-host for free under an open-source license, on your own servers or air-gapped."

table:
  title: "How do Tines and Kestra compare, feature by feature?"
  rows:
    - label: "Workflow definition"
      competitor: "Stories built on a storyboard, exported as JSON"
      kestra: "YAML flows, written as code or in the no-code editor"
    - label: "Building blocks"
      competitor: "Eight action types, such as HTTP Request, Condition and AI Agent, plus tools such as Run Script"
      kestra: "{totalPlugins}+ plugins, script tasks and flow-control tasks"
    - label: "Triggers"
      competitor: "Webhooks, inbound email, schedules on any action, and calls from other stories"
      kestra: "Schedules, webhooks, flow triggers, polling and realtime triggers"
    - label: "Custom code"
      competitor: "Python in Run Script, with a 10-second default timeout and 110 seconds at most in the cloud"
      kestra: "Python, Node.js, shell, Go, R and more, with dependencies per task"
    - label: "Retries"
      competitor: "HTTP Request retries on the status codes you list, 25 times by default with exponential backoff"
      kestra: "Retry policy per task or flow, with errors and finally blocks"
    - label: "Change management"
      competitor: "Change control with drafts, review and approval"
      kestra: "A revision on every save, Git sync and a Terraform provider"
    - label: "Hosting"
      competitor: "Tines cloud, or self-hosted on Business and Enterprise editions"
      kestra: "Any cloud, on-premises, air-gapped (Kestra Enterprise), or Kestra Cloud"
    - label: "Pricing"
      competitor: "Free edition with 3 live workflows; paid editions quote only"
      kestra: "Free open source; Kestra Cloud billed on usage"
    - label: "License"
      competitor: "Proprietary"
      kestra: "Apache 2.0"

proof:
  title: "Which security teams run their automation on Kestra?"
  stories:
    - story: orchestrating-cybersecurity-for-100-users-and-billions-of-rows
      industry: "Banking"
      stat: "4,000+"
      label: "API pulls a week feed threat intelligence to more than 100 cybersecurity users at JPMorgan Chase."
    - story: government-soc-team
      industry: "Government"
      stat: "100+"
      label: "SOC workflows replaced Palo Alto XSOAR, self-hosted with no cloud dependencies."

architecture:
  title: "How are Tines and Kestra built?"
  competitor:
    title: "Tines: actions linked into stories"
    text: "A story is a set of actions linked on a storyboard. Each action receives events, does one job and emits new events to the actions linked after it."
    list:
      - "Webhook and Receive Email actions start a story"
      - "Condition actions send events down up to 10 paths"
      - "Event Transformation explodes, deduplicates or delays events"
      - "Send to Story actions hand events to another story"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file of tasks. Kestra validates it against each plugin's schema when you save it, and workers run each task with its inputs and outputs recorded in the execution."
    list:
      - "If and Switch tasks route an execution"
      - "Loop runs tasks once per item, concurrently if you choose"
      - "Subflows call another flow with typed inputs"
      - "Script tasks run in containers with their own dependencies"

compare:
  title: "What does the same alert triage look like in each?"
  lead: "The same workflow in both: a webhook that receives an alert, a check that keeps high-severity alerts, a VirusTotal lookup with retries and a Slack message."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Tines story export (excerpt)"
    file: "alert_triage.json"
    lang: json
    code: |
      {
        "name": "Alert triage",
        "agents": [
          {
            "type": "Agents::WebhookAgent",
            "name": "Receive alert",
            "options": { "path": "4f2b9c1e7a6d3e8f", "secret": "9d3a7e1c5b2f8a4d", "verbs": "post" }
          },
          {
            "type": "Agents::TriggerAgent",
            "name": "Severity is high",
            "options": { "rules": [{ "type": "field==value", "value": "high", "path": "<<receive_alert.severity>>" }] }
          },
          {
            "type": "Agents::HTTPRequestAgent",
            "name": "Look up IP",
            "options": {
              "url": "https://www.virustotal.com/api/v3/ip_addresses/<<receive_alert.source_ip>>",
              "method": "get",
              "headers": { "x-apikey": "<<CREDENTIAL.virustotal>>" },
              "retry_on_status": ["429", "500-599"],
              "retries": 5
            }
          },
          {
            "type": "Agents::HTTPRequestAgent",
            "name": "Post to Slack",
            "options": {
              "url": "https://slack.com/api/chat.postMessage",
              "method": "post",
              "content_type": "json",
              "headers": { "Authorization": "Bearer <<CREDENTIAL.slack>>" },
              "payload": { "channel": "#soc-alerts", "text": "High alert from <<receive_alert.source_ip>>, malicious votes: <<look_up_ip.body.data.attributes.last_analysis_stats.malicious>>" }
            }
          }
        ],
        "links": [{ "source": 0, "receiver": 1 }, { "source": 1, "receiver": 2 }, { "source": 2, "receiver": 3 }]
      }
  kestra:
    code: |
      id: alert_triage
      namespace: security.soc

      triggers:
        - id: receive_alert
          type: io.kestra.plugin.core.trigger.Webhook
          key: "{{ secret('ALERT_WEBHOOK_KEY') }}"

      tasks:
        - id: severity_is_high
          type: io.kestra.plugin.core.flow.If
          condition: "{{ trigger.body.severity == 'high' }}"
          then:
            - id: look_up_ip
              type: io.kestra.plugin.core.http.Request
              uri: "https://www.virustotal.com/api/v3/ip_addresses/{{ trigger.body.source_ip }}"
              headers:
                x-apikey: "{{ secret('VIRUSTOTAL_API_KEY') }}"
              retry:
                type: exponential
                interval: PT5S
                maxInterval: PT10M
                maxAttempts: 6

            - id: post_to_slack
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              url: "{{ secret('SLACK_WEBHOOK') }}"
              messageText: "High alert from {{ trigger.body.source_ip }}, malicious votes: {{ fromJson(outputs.look_up_ip.body).data.attributes.last_analysis_stats.malicious }}"

pairs:
  - title: "How hard is it to move from Tines to Kestra?"
    columns:
      - label: "Leaving Tines"
        brand: competitor
        text: "A story exports as a JSON file with its actions, their options and the links between them. Credentials, resources and the events a story generated stay behind, and the JSON is Tines' own format, so each story is rebuilt in the target tool."
      - label: "Moving to Kestra"
        brand: kestra
        text: "HTTP Request actions become HTTP or plugin tasks, Condition actions become If or Switch tasks, Event Transformation in explode mode becomes a Loop, and Send to Story becomes a Subflow. Run Script code moves into a Python script task. Senders such as a SIEM are pointed at a Kestra webhook one story at a time."
  - title: "What do licensing, pricing and self-hosting look like?"
    columns:
      - label: "Tines"
        brand: competitor
        text: "A proprietary platform. The free edition allows 3 live workflows with unlimited users. Paid editions have no published prices and are quoted by sales, and the Business and Enterprise editions can be self-hosted with Docker Compose or Kubernetes, set up through Tines' account team."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Tines teams"

commonQuestions:
  - question: "Can Kestra call the security tools our stories use?"
    answer: "Yes. An HTTP task calls any REST API, such as VirusTotal, MISP or your EDR, with credentials kept in Kestra secrets, and plugins cover tools such as Elasticsearch, Slack and the major clouds. A Python script task handles anything that needs an SDK. Check the actions your stories rely on before you plan the move."
  - question: "Can Kestra and Tines run side by side?"
    answer: "Yes. A Tines Webhook action can receive a call from a Kestra HTTP task, and a Tines HTTP Request action can call a Kestra Webhook trigger. Move one story at a time and keep the rest in Tines until they're replaced."
  - question: "How do approvals work, for example before locking an account?"
    answer: "A Pause task stops the execution until someone resumes it from the UI or the API, and it can collect inputs from the approver, such as a reason, that later tasks read. Apps (Kestra Enterprise) give the approver a screen with the alert details and approve or reject buttons."
  - question: "How does Kestra track incidents from failed workflows?"
    answer: "Cases (Kestra Enterprise) open an incident from a flow's errors block or from any task, next to the executions that caused it. With deduplication turned on, repeated failures of the same flow and task attach to the case that is already open."
  - question: "Can analysts build workflows without writing YAML?"
    answer: "Yes. The no-code editor builds flows on a visual canvas and stays in sync with the YAML, and the AI Copilot drafts or edits a flow from a plain-language request. Engineers can review the same flow as YAML in Git before it reaches production."
  - question: "Can Kestra run AI agents in a security workflow?"
    answer: "Yes. The AIAgent task gives a model a goal and only the tools you list, such as specific flows, web search or an MCP server, for example to summarize an alert before it reaches the on-call channel. Each agent run is recorded in the execution with its inputs and outputs."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute and Kestra Enterprise reaches 7,000, with workers that scale horizontally. Leroy Merlin runs more than 5,000 flows on Kestra."

