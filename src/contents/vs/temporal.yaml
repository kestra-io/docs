architecture:
  title: "How are Temporal and Kestra built?"
  lead: "Temporal keeps workflow state in an event history and replays your code against it. Kestra stores the state of each task run and picks the next task from it."
  competitor:
    title: "Temporal: durable execution in code"
    text: "A workflow is a function written with a Temporal SDK. The Temporal Service records each step in an event history, and workers replay that history to rebuild state after a failure."
    list:
      - "Workers you run poll task queues for workflow and activity tasks"
      - "Workflow code must make the same calls in the same order on replay"
      - "Activities hold the side effects, such as API calls and database writes"
      - "The Frontend, History and Matching services sit on Cassandra, MySQL or PostgreSQL"
  kestra:
    title: "Kestra: declarative orchestration"
    text: "A flow is YAML that lists tasks, triggers and error handlers. The executor stores each task run's state in the backend and dispatches the next task to a worker."
    list:
      - "Flow definitions are data, checked against plugin schemas"
      - "Each task's outputs are stored and passed to later tasks by expression"
      - "A Pause task holds an execution until someone resumes it"
      - "The default backend is a relational database such as Postgres"

compare:
  title: "What does the same process look like in each?"
  lead: "The same process in both: create an environment through an API, wait for an approval, then deploy it, with three attempts and a timeout on each call."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Temporal workflow (Python SDK)"
    file: "provision.py"
    lang: python
    code: |
      from datetime import timedelta

      import httpx
      from temporalio import activity, workflow
      from temporalio.common import RetryPolicy

      API = "https://infra.example.com/api/environments"
      RETRY = RetryPolicy(maximum_attempts=3)

      @activity.defn
      async def create_environment(name: str) -> str:
          async with httpx.AsyncClient() as client:
              r = await client.post(API, json={"name": name})
              r.raise_for_status()
              return r.json()["id"]

      @activity.defn
      async def deploy(env_id: str) -> None:
          async with httpx.AsyncClient() as client:
              r = await client.post(f"{API}/{env_id}/deploy")
              r.raise_for_status()

      @workflow.defn
      class ProvisionEnvironment:
          def __init__(self) -> None:
              self.approved = False

          @workflow.signal
          def approve(self) -> None:
              self.approved = True

          @workflow.run
          async def run(self, name: str) -> None:
              env_id = await workflow.execute_activity(
                  create_environment, name,
                  start_to_close_timeout=timedelta(minutes=5), retry_policy=RETRY,
              )
              await workflow.wait_condition(lambda: self.approved)
              await workflow.execute_activity(
                  deploy, env_id,
                  start_to_close_timeout=timedelta(minutes=30), retry_policy=RETRY,
              )
  kestra:
    code: |
      id: provision_environment
      namespace: platform.environments

      inputs:
        - id: name
          type: STRING

      tasks:
        - id: create_environment
          type: io.kestra.plugin.core.http.Request
          method: POST
          uri: https://infra.example.com/api/environments
          contentType: application/json
          body: '{"name": "{{ inputs.name }}"}'
          timeout: PT5M
          retry:
            type: constant
            interval: PT10S
            maxAttempts: 3

        - id: approval
          type: io.kestra.plugin.core.flow.Pause

        - id: deploy
          type: io.kestra.plugin.core.http.Request
          method: POST
          uri: "https://infra.example.com/api/environments/{{ fromJson(outputs.create_environment.body).id }}/deploy"
          timeout: PT30M
          retry:
            type: constant
            interval: PT10S
            maxAttempts: 3

setup:
  title: "What does it take to get running?"
  lead: "Both start locally with a couple of commands. Production is where they differ."
  competitor:
    title: "Temporal"
    tag: "Dev server"
    text: "Temporal's <a href='https://docs.temporal.io/cli/server'>CLI docs</a> start a local development server with one command, with the Web UI on localhost:8233, and say it isn't meant for production. A production Temporal Service needs Cassandra, MySQL or PostgreSQL, a visibility store, and the worker processes that run your code."
    code: |
      brew install temporal
      temporal server start-dev
  kestra:
    title: "Kestra"
    tag: "Database included"
    text: "One Compose file starts Kestra and its Postgres database. Open localhost:8080, pick a blueprint and run it. Production runs the same image on Kubernetes with the <a href='/docs/installation/kubernetes'>Kestra Helm chart</a>."
    code: |
      curl -o docker-compose.yml https://raw.githubusercontent.com/kestra-io/kestra/develop/docker-compose.yml
      docker compose up

pairs:
  - title: "How hard is it to move from Temporal to Kestra?"
    columns:
      - label: "Leaving Temporal"
        brand: competitor
        text: "Workflow code is written against the SDK, with activities, signals, timers and the determinism rules that make replay work. Activity bodies are ordinary functions that call APIs, so they move with little change. The orchestration around them has to be redrawn as tasks."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Each activity becomes a script or HTTP task, each signal wait a Pause task, each timer a pause duration, and each Temporal schedule a trigger. Application workflows that depend on replay can stay on Temporal and be started from a Kestra flow."
  - title: "What do licensing, pricing and self-hosting look like?"
    lead: "Both are open source and free to self-host, under MIT and Apache 2.0."
    columns:
      - label: "Temporal"
        brand: competitor
        text: "MIT licensed and free to self-host, which means running the Temporal Service, its database and your workers. Temporal Cloud is billed per Action plus storage, and plans are quoted on request."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Temporal teams"

commonQuestions:
  - question: "Is Kestra a durable execution engine like Temporal?"
    answer: "They recover from failures at different levels. Temporal replays a workflow's event history so a function resumes where it stopped after a crash, which suits application logic. Kestra stores the state of every task run, retries failed tasks under each task's policy, and lets you replay an execution from any task after a fix."
  - question: "Can a Kestra workflow wait for days, or for a person?"
    answer: "Yes. A Pause task holds the execution until someone resumes it from the UI, the API or an App, and onResume inputs collect a decision and a comment. With pauseDuration set, the task resumes, warns, cancels or fails once the time runs out."
  - question: "Do I need an SDK to write Kestra tasks?"
    answer: "No. Plugin tasks are configured in YAML, and script tasks run your code as it is in Python, Node.js, Go, Shell and other languages. If your Python code needs to report outputs or metrics to the flow, the optional Kestra library handles it."
  - question: "Can Kestra start or signal Temporal workflows?"
    answer: "Yes. A Python script task can use the Temporal Python SDK to start a workflow or send it a signal, so a Kestra flow can hand application work to Temporal and wait for the result."
  - question: "How does Kestra handle retries and timeouts?"
    answer: "Each task, or the whole flow, takes a retry block with a constant, exponential or random delay and a maximum number of attempts, plus a timeout as an ISO 8601 duration. An errors block runs when a task still fails after its retries, and a finally block runs whatever the outcome."
  - question: "What does running Kestra in production involve?"
    answer: "A standalone server and a Postgres database are enough to start, and each server role can be split out and scaled on Kubernetes later. Temporal needs the Temporal Service, its persistence database, a visibility store and the worker processes that run your code."
  - question: "How far does Kestra scale?"
    answer: "Kestra's <a href='/docs/performance/benchmark'>benchmark</a> recorded 4,000 executions a minute for the open-source edition on Postgres and 7,000 for Kestra Enterprise. Víssimo runs around 600 production workflows on a self-hosted open-source instance."

