title: "Kestra vs Temporal: Workflow Orchestration Compared"
description: "Compare Kestra and Temporal: durable execution in SDK code vs. declarative YAML workflows, the same approval process in both, hosting and pricing."
competitorName: Temporal
category: Infrastructure Automation
shortDescription: "Durable execution inside application code vs. declarative workflows for data, infrastructure and business processes."

brandColor:
  color: "#444CE7"

intro:
  title: "Kestra vs. Temporal"
  description: "Temporal runs workflows written with its SDKs in Go, Java, Python, TypeScript and more, and replays their event history to survive failures. Kestra runs YAML workflows that call scripts, APIs and infrastructure tools as tasks."

choose:
  title: "Temporal or Kestra?"
  competitor:
    title: "Temporal is the better fit if"
    list:
      - "Your workflows live inside an application, such as an order or payment process that has to survive a crash halfway through a function."
      - "Your developers want workflow logic in the same language and repository as the service it belongs to."
      - "You want Temporal Cloud to run the service while your own workers run the code."
  kestra:
    title: "Choose Kestra if"
    list:
      - "Your workflows coordinate tools and teams, such as data pipelines, infrastructure provisioning, approvals and scheduled jobs."
      - "Platform, data and ops teams need to read and change workflows without learning an SDK and its determinism rules."
      - "You want schedules, webhooks, retries and approvals declared in the same file as the workflow."

table:
  title: "How do Temporal and Kestra compare, feature by feature?"
  rows:
    - label: "Workflow definition"
      competitor: "Workflow and activity code written with a Temporal SDK"
      kestra: "Declarative YAML, checked against plugin schemas when saved"
    - label: "Languages"
      competitor: "SDKs for Go, Java, Python, TypeScript, .NET, PHP and Ruby"
      kestra: "Python, Node.js, Go, Shell, .NET, Ruby and more as script tasks, with no SDK required"
    - label: "Code rules"
      competitor: "Workflow code must be deterministic, with I/O moved into activities"
      kestra: "No determinism rules for task code"
    - label: "Recovery"
      competitor: "Event history replay restores workflow state after a worker crash"
      kestra: "Task run state is stored in the database, and executions replay from any task"
    - label: "Retries"
      competitor: "Activities retry without limit by default, with exponential backoff"
      kestra: "Set per task or per flow: constant, exponential or random delays"
    - label: "Who runs the code"
      competitor: "Worker processes you build, deploy and scale"
      kestra: "Kestra workers, which load plugins and run tasks"
    - label: "Triggers"
      competitor: "Schedules managed through the CLI, SDK or UI, and signals from other code"
      kestra: "Schedules, webhooks, flow triggers, polling and realtime triggers in the flow file"
    - label: "Integrations"
      competitor: "Activities you write with your own client libraries"
      kestra: "{totalPlugins}+ plugins, versioned apart from the core"
    - label: "Hosting"
      competitor: "Self-hosted on Cassandra, MySQL or PostgreSQL, or Temporal Cloud"
      kestra: "Self-hosted, air-gapped (Kestra Enterprise), or Kestra Cloud"
    - label: "License"
      competitor: "MIT"
      kestra: "Apache 2.0"

proof:
  title: "Which teams run integration and infrastructure workflows on Kestra?"
  stories:
