imgFile: "ansible"

brandColor:
  color: "#ee0000"

intro:
  title: "Kestra vs. Ansible Automation Platform: Keep Your Playbooks, Replace the Controller"
  description: "Kestra runs your existing Ansible playbooks and replaces the automation controller with workflows that also run Terraform, scripts and ServiceNow, without a per-node license."

philosophy:
  mainTitle: "Playbook Execution Engine vs. Full IT Orchestration Control Plane"
  kestra:
    title: "Orchestrate Everything, Including Ansible"
    description: "Kestra is the control plane that sits above your tools. Run Ansible playbooks as tasks inside multi-step workflows that include Terraform provisioning, API calls, approvals, and ITSM updates. Define every workflow in YAML, version it in Git, and deploy through CI/CD. Ansible does what it does best—Kestra coordinates the rest."
    subCardText: '"How do I chain Ansible with Terraform, ServiceNow, and approvals in one auditable flow?"'
  competitor:
    title: "Ansible-First Automation Platform"
    description: "Red Hat Ansible Automation Platform (AAP, formerly Ansible Tower) centrally manages Ansible playbook execution with Tower/Controller, a private content hub, and Event-Driven Ansible. It's the standard for running playbooks at scale. In August 2026, Red Hat <a href='https://forum.ansible.com/t/introducing-automation-orchestrator-for-ansible-automation-platform/46221'>announced</a> an optional paid add-on, the automation orchestrator, that adds workflow logic above the controller on its own OpenShift cluster."
    shadowColor: "#EE0000"
    subCardBg: "var(--ks-background-blue-light)"
    subCardText: '"How do I centrally run and manage Ansible playbooks across my fleet?"'

businessValue:
  mainTitle: "Ansible Runs Your Playbooks.<br />Kestra Orchestrates Your Operations."
  kestra:
    title: "Cross-Tool IT Orchestration"
    list:
      - "Ansible as one task in multi-step workflows (alongside Terraform, PowerShell, scripts)"
      - "Dynamic self-service Apps with approval gates and RBAC"
      - "Full audit trail and evidence logging per execution"
      - "Event-driven triggers from webhooks, ServiceNow, queues, or schedules"
      - "Replaces the controller, or calls your existing job templates while you migrate"
  competitor:
    title: "Ansible-Centric Execution"
    list:
      - "Centralized playbook execution and inventory management"
      - "Workflow templates that branch on success, failure or always (conditions and loops need the paid orchestrator add-on)"
      - "Event-Driven Ansible for reactive automation (separate component)"
      - "Strong for Ansible-native teams, thinner outside the Ansible ecosystem"
      - "Per-managed-node subscription model scales with fleet size"
    shadowColor: "#EE0000"
    bulletColor: "#EE0000"
  footerText: "Choose Ansible Automation Platform if all you need is centralized playbook execution with inventory and RBAC. Choose Kestra when Ansible is one step in a larger process, alongside Terraform, approvals, ServiceNow or self-service forms. Moving off AAP? Keep your playbooks, replace the controller, and call your existing job templates from Kestra while you migrate."

setupSpeed:
  title: "Time to First Orchestrated Workflow"
  subtitle: "Kestra starts in minutes with a single Docker Compose command. Ansible Automation Platform requires RHEL, an active Red Hat subscription, and a multi-component installation (Controller, Hub, EDA) that typically takes hours for dev and days for production."
  kestra:
    title:
      one: "~5"
      two: Minutes
    description: "Download <a href='/docs/installation/docker-compose'>Docker Compose</a>, start it up, and pick an IT automation <a href='/blueprints/infrastructure'>Blueprint</a>. Your first Ansible-integrated workflow is YAML with parameters, secrets, and retries already built in, the same format it will run in production."
    command: |
      curl -o docker-compose.yml \
      https://raw.githubusercontent.com/kestra-io/kestra/develop/docker-compose.yml
      docker compose up

      # Open localhost:8080
      # Pick an Ansible Blueprint, customize it. Done.
    lang: sh
  competitor:
    title:
      one: Hours
      two: to days
    description: "AAP requires a RHEL subscription, installation of Automation Controller, Private Automation Hub, and optionally Event-Driven Ansible as separate components. Production HA setup with clustered controllers, execution environments, and receptor nodes takes significant configuration time."
    shadowColor: "#EE0000"
    command: |
      # Ansible Automation Platform requires:
      # - Active Red Hat subscription
      # - RHEL 8/9 infrastructure
      # - Ansible Automation Platform installer

      # Installation steps:
      # 1. Download AAP setup bundle
      # 2. Configure inventory file
      # 3. Run setup.sh (installs Controller + Hub + EDA)
      # 4. Configure organizations, credentials, inventories...
    lang: sh

easeOfUse:
  title: "Declarative Event Orchestration vs. Multi-Component AAP Configuration"
  kestra:
    title: "Kestra: Ansible as a First-Class Workflow Step"
    description: "Your playbooks run as tasks in one YAML workflow, next to any other tool. The survey becomes typed inputs, the approval a Pause task and the rollback an errors block, all in one file you review in a pull request."
    code: |
      id: patch_and_verify
      namespace: ops.patching

      inputs:
        - id: target_hosts
          type: STRING
        - id: patch_type
          type: SELECT
          values: [security, full, kernel]
          defaults: security

      tasks:
        - id: request_approval
          type: io.kestra.plugin.core.flow.Pause
          onResume:
            - id: approved_by
              type: STRING

        - id: run_patch_playbook
          type: io.kestra.plugin.ansible.cli.AnsibleCLI
          namespaceFiles:
            enabled: true
          commands:
            - ansible-playbook -i inventory/production --limit "{{ inputs.target_hosts }}" -e "patch_type={{ inputs.patch_type }}" patch.yml

        - id: verify_patch
          type: io.kestra.plugin.ansible.cli.AnsibleCLI
          namespaceFiles:
            enabled: true
          commands:
            - ansible-playbook -i inventory/production --limit "{{ inputs.target_hosts }}" verify.yml

        - id: notify_team
          type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          messageText: "Patching complete for {{ inputs.target_hosts }}, approved by {{ outputs.request_approval.onResume.approved_by }}"

      errors:
        - id: rollback
          type: io.kestra.plugin.ansible.cli.AnsibleCLI
          namespaceFiles:
            enabled: true
          commands:
            - ansible-playbook -i inventory/production --limit "{{ inputs.target_hosts }}" rollback.yml
    lang: yaml
  competitor:
    title: "AAP: Job Templates + Workflow Template (ansible.controller collection)"
    description: "In AAP, every job template, survey, approval, notification and workflow node is a separate controller object. You can manage them as code with the ansible.controller collection, but the workflow graph is wired node by node and stored in the controller database. Non-Ansible steps need webhooks, custom scripts or the paid automation orchestrator."
    shadowColor: "#EE0000"
    code: |
      # Configuration as code for the automation controller (ansible.controller collection)
      - name: Configure patching in the automation controller
        hosts: localhost
        gather_facts: false
        collections:
          - ansible.controller
        tasks:
          - name: Slack notification template
            notification_template:
              name: patching-slack
              organization: Ops
              notification_type: slack
              notification_configuration:
                token: "{{ slack_token }}"
                channels:
                  - "#ops"

          - name: One job template per playbook
            job_template:
              name: "{{ item.name }}"
              organization: Ops
              job_type: run
              inventory: production-linux
              project: ops-playbooks
              playbook: "{{ item.playbook }}"
              credentials:
                - linux-ssh
              ask_limit_on_launch: true
              ask_variables_on_launch: true
            loop:
              - { name: patch-servers, playbook: patch.yml }
              - { name: verify-servers, playbook: verify.yml }
              - { name: rollback-servers, playbook: rollback.yml }

          - name: Workflow with survey, approval and rollback
            workflow_job_template:
              name: patch-and-verify
              organization: Ops
              inventory: production-linux
              ask_limit_on_launch: true
              survey_enabled: true
              survey_spec:
                name: Patch options
                description: ""
                spec:
                  - question_name: Patch type
                    variable: patch_type
                    type: multiplechoice
                    choices: [security, full, kernel]
                    default: security
                    required: true
              notification_templates_success:
                - patching-slack
              workflow_nodes:
                - identifier: approve
                  approval_node:
                    name: Approve patching
                    timeout: 3600
                  related:
                    success_nodes:
                      - identifier: patch
                - identifier: patch
                  unified_job_template:
                    name: patch-servers
                    type: job_template
                  related:
                    success_nodes:
                      - identifier: verify
                    failure_nodes:
                      - identifier: rollback
                - identifier: verify
                  unified_job_template:
                    name: verify-servers
                    type: job_template
                - identifier: rollback
                  unified_job_template:
                    name: rollback-servers
                    type: job_template

      # Terraform or ServiceNow steps: webhooks, custom scripts,
      # or the paid automation orchestrator (AAP 2.7+, on OpenShift)
    lang: yaml

cardSection:
  title: "Before Your Next AAP Renewal"
  cards:
    - title: "Licensed per managed node"
      body: |
        Ansible Automation Platform is licensed per managed node, and every node you're entitled to manage counts toward the subscription ([how Red Hat counts managed nodes](https://access.redhat.com/articles/3331481)). As your estate grows, so does the bill. Kestra Enterprise isn't priced per node, so automating more servers and devices doesn't change your license.
    - title: "The automation orchestrator add-on"
      body: |
        Red Hat's automation orchestrator, [announced in August 2026](https://forum.ansible.com/t/introducing-automation-orchestrator-for-ansible-automation-platform/46221), is an optional, paid add-on for Ansible Automation Platform 2.7 and later. It adds a workflow layer above the controller: job templates become steps, with conditions, loops, webhook and event triggers, AI task agents and approvals.

        - It needs its own OpenShift cluster, even when AAP itself runs on VMs.
        - Workflows live in the orchestrator's database. Git is possible by exporting and importing JSON files.
        - It's built around Ansible. Terraform, scripts and APIs are generic steps.

        Kestra gives you the same workflow layer on any Kubernetes, Docker or VMs, with YAML in Git as the source, across every tool, without a per-node license.

