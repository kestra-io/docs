architecture:
  title: "How are Ansible Automation Platform and Kestra built?"
  lead: "Ansible Automation Platform runs playbooks as jobs from templates stored in its controller. Kestra stores each workflow as a YAML file, and a playbook is one of its tasks."
  competitor:
    title: "Ansible Automation Platform: templates in a controller"
    text: "A job template ties a playbook from a project to an inventory and credentials. A workflow job template links templates as nodes, and the controller runs each job in an execution environment, a container image built with ansible-builder."
    list:
      - "Projects sync playbooks from Git"
      - "Inventories and credentials are controller objects"
      - "Automation hub serves certified and private collections"
      - "Event-Driven Ansible matches events to rulebook actions"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file of tasks, triggers and error handlers. The executor tracks state in Kestra's database and hands each task to a worker, which runs a playbook in a container, a Terraform plan or an API call."
    list:
      - "Playbooks and inventories come from Git or namespace files"
      - "Each plugin task is checked against its schema on save"
      - "Worker groups run tasks inside a given network (Kestra Enterprise)"
      - "Every save creates a revision you can diff and roll back"

compare:
  title: "What does the same patching workflow look like in each?"
  lead: "The same workflow in both: an approval, a patch playbook, a verification playbook, and a rollback playbook if either one fails."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Workflow job template as code"
    file: "patch_workflow.yml"
    lang: yaml
    code: |
      - name: Patch, verify and roll back on failure
        ansible.controller.workflow_job_template:
          name: patch-and-verify
          organization: Ops
          inventory: production-linux
          extra_vars:
            patch_type: security
          workflow_nodes:
            - identifier: approve
              unified_job_template:
                name: Approve patching
                type: workflow_approval
              related:
                success_nodes:
                  - identifier: patch
            - identifier: patch
              unified_job_template:
                name: patch-servers
                type: job_template
              related:
                success_nodes:
                  - identifier: verify
                failure_nodes:
                  - identifier: rollback
            - identifier: verify
              unified_job_template:
                name: verify-servers
                type: job_template
              related:
                failure_nodes:
                  - identifier: rollback
            - identifier: rollback
              unified_job_template:
                name: rollback-servers
                type: job_template
  kestra:
    code: |
      id: patch_and_verify
      namespace: ops.patching

      inputs:
        - id: patch_type
          type: SELECT
          values: [security, full, kernel]
          defaults: security

      tasks:
        - id: approve
          type: io.kestra.plugin.core.flow.Pause

        - id: patch
          type: io.kestra.plugin.ansible.cli.AnsibleCLI
          containerImage: cytopia/ansible:latest-tools
          namespaceFiles:
            enabled: true
          commands:
            - ansible-playbook -i inventory.ini patch.yml -e patch_type={{ inputs.patch_type }}

        - id: verify
          type: io.kestra.plugin.ansible.cli.AnsibleCLI
          containerImage: cytopia/ansible:latest-tools
          namespaceFiles:
            enabled: true
          commands:
            - ansible-playbook -i inventory.ini verify.yml

      errors:
        - id: rollback
          type: io.kestra.plugin.ansible.cli.AnsibleCLI
          containerImage: cytopia/ansible:latest-tools
          namespaceFiles:
            enabled: true
          commands:
            - ansible-playbook -i inventory.ini rollback.yml

setup:
  title: "What does it take to get running?"
  lead: "Both run on your own infrastructure. Ansible Automation Platform installs on RHEL with Red Hat's installer, and Kestra starts from one Compose file."
  competitor:
    title: "Ansible Automation Platform"
    tag: "Subscription required"
    text: "Red Hat's <a href='https://docs.redhat.com/en/documentation/red_hat_ansible_automation_platform/2.6/install-proc_installing_containerized_aap'>containerized installation guide</a> installs the platform as Podman containers on RHEL 9 or 10. It needs an Ansible Automation Platform subscription and a RHEL subscription, at least 16 GB of RAM and 4 CPUs per VM, and an inventory file you fill in before running the installer."
    code: |
      tar xfvz ansible-automation-platform-containerized-setup-<version_number>.tar.gz
      cd ansible-automation-platform-containerized-setup-<version_number>
      ansible-playbook -i inventory ansible.containerized_installer.install
  kestra:
    title: "Kestra"
    tag: "Database included"
    text: "One Compose file starts Kestra and its Postgres database. Open localhost:8080, pick a blueprint and run it. Production runs the same image on Kubernetes with the <a href='/docs/installation/kubernetes'>Kestra Helm chart</a>."
    code: |
      curl -o docker-compose.yml https://raw.githubusercontent.com/kestra-io/kestra/develop/docker-compose.yml
      docker compose up

pairs:
  - title: "How hard is it to move from Ansible Automation Platform to Kestra?"
    columns:
      - label: "Leaving Ansible Automation Platform"
        brand: competitor
        text: "Playbooks, roles, collections and inventories are Ansible content in Git, so they move unchanged. Job templates, surveys, credentials, schedules and workflow graphs live in the controller database, so each one has to be listed and mapped."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Each job template becomes an Ansible task, each survey becomes flow inputs, each workflow graph becomes a flow with an errors block, and each schedule becomes a trigger. While templates move in waves, a Kestra HTTP task can launch an existing job template through the controller's REST API."
  - title: "What do licensing, pricing and self-hosting look like?"
    columns:
      - label: "Ansible Automation Platform"
        brand: competitor
        text: "A Red Hat subscription with Standard (business hours) or Premium (24x7) support, priced on request. Red Hat counts managed nodes for the subscription, and the managed estate may not exceed the number entitled. AWX, the upstream project, is Apache 2.0, and its README says releases are paused during a large refactoring."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Ansible Automation Platform teams"

commonQuestions:
  - question: "Do I have to rewrite my playbooks?"
    answer: "No. The Ansible CLI task runs ansible-playbook with your playbooks, roles and inventories from Git or namespace files, and typed options set check mode, diff, limit and tags. The Ansible Runner task runs the same playbook inside an execution environment image."
  - question: "Can later tasks use values a playbook returns?"
    answer: "Yes. The Ansible CLI task turns playbook results into task outputs. With <a href='/docs/how-to-guides/ansible-explicit-outputs'>outputsMode EXPLICIT</a>, it keeps only the values you declare with the bundled kestra module, so host data you don't need stays out of Kestra's storage."
  - question: "How does Kestra compare to AWX?"
    answer: "AWX is the open-source upstream of the automation controller, under Apache 2.0. Its README says releases are paused during a large refactoring, and its last release came out in July 2024. Kestra runs the same playbooks and keeps the workflow around them in YAML. The guide to <a href='/resources/infrastructure/awx-alternatives'>AWX alternatives</a> compares other options."
  - question: "Can events start a playbook run, as with Event-Driven Ansible?"
    answer: "Yes. A Webhook trigger, a file or database polling trigger, or a realtime trigger on Kafka, SQS, AMQP queues or Azure Service Bus starts a flow, and the flow runs the playbook as one of its tasks."
  - question: "What is Red Hat's automation orchestrator?"
    answer: "Red Hat describes it as a visual workflow canvas add-on for Ansible Automation Platform. It reuses job templates as nodes and adds branch, loop and switch nodes, webhook and Event-Driven Ansible triggers, AI task agents and YAML export. In Kestra, branches, loops, event triggers and approvals are part of every flow, and Ansible is one of {totalPlugins}+ plugins."
  - question: "Where do vault passwords and SSH keys go?"
    answer: "Tasks read credentials with the secret() function. The open-source edition reads secrets from environment variables, and Kestra Enterprise adds namespace-level secrets and external managers such as HashiCorp Vault and Azure Key Vault."
  - question: "Is Kestra an alternative to Ansible Tower?"
    answer: "Ansible Tower became the automation controller in Ansible Automation Platform. Kestra replaces that controller layer and keeps your playbooks, roles and inventories. The guide to <a href='/resources/infrastructure/ansible-tower-alternatives'>Ansible Tower alternatives</a> compares the other options."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute, and Kestra Enterprise reaches 7,000 a minute. Workers scale horizontally, and Fila runs 2.5 million executions a month on Kestra."

