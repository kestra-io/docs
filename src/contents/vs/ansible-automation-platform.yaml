platformStrengths:
  title: "Kestra Extends What Ansible Does Best"
  features:
    - title: "Ansible as a Task, Not a Platform"
      description: "Keep your existing Ansible playbooks and inventory. Kestra wraps them in YAML workflows that add approvals, Terraform provisioning, ServiceNow updates, and PowerShell steps—without rewriting a single playbook."
    - title: "Self-Service Without the Portal Tax"
      description: "Kestra Apps give ops teams dynamic, data-backed forms for triggering workflows—no separate service catalog software required. Forms pull live data from APIs or databases, approvals are inline, and every execution is logged."
    - title: "Built for Regulated Environments"
      description: "Full audit trails, secrets via enterprise vaults (CyberArk, HashiCorp Vault), AD/OIDC SSO, and air-gapped deployment. Built for teams in healthcare, government and financial services that need both execution evidence and access controls."

decisionGuide:
  mainTitle: "When to Choose Kestra vs. Ansible Automation Platform"
  kestra:
    title: "Choose Kestra When"
    list:
      - "Workflows span multiple tools—Terraform, Ansible, PowerShell, ServiceNow, cloud APIs."
      - "You need approval gates, dynamic self-service forms, or multi-step branching logic."
      - "Full audit trails and compliance evidence are non-negotiable requirements."
      - "Your team works in Python, Bash, Go, or SQL alongside Ansible."
      - "You want to use Ansible as an execution engine without locking into the AAP ecosystem."
  competitor:
    title: "Choose Ansible AAP When"
    list:
      - "Your automation is entirely Ansible-native with no need for cross-tool orchestration."
      - "Central inventory management, credential vaulting, and RBAC for Ansible are the primary needs."
      - "Your organization is already deeply invested in the Red Hat ecosystem."
      - "Event-Driven Ansible for reactive Ansible-only workflows is the core requirement."
      - "You're on AAP 2.7, already run OpenShift, and want to stay with Red Hat for workflow orchestration too."
    shadowColor: "#EE0000"
    bulletColor: "#EE0000"

commonQuestions:
  - question: "Is Kestra a replacement for Ansible Automation Platform?"
    answer: "Yes, for the controller. Kestra runs your existing playbooks and replaces job templates, workflow templates, surveys and schedules with YAML workflows. If you're not ready to switch everything at once, Kestra can call your existing job templates through the controller API while you migrate."
  - question: "Can I use my existing Ansible playbooks with Kestra?"
    answer: "Yes. Kestra's Ansible plugin runs any existing playbook with the same parameters, inventory, and vault secrets you use today. You don't need to rewrite anything. Kestra adds orchestration on top: chain the playbook run with pre-approval steps, Terraform provisioning, post-execution verification, and ITSM ticket closure—all in one YAML workflow."
  - question: "How does Kestra compare to AWX (the open-source version of AAP)?"
    answer: "AWX is the upstream open-source project for Ansible Automation Platform—it provides Controller UI, job templates, and workflow templates without a subscription. Kestra differs fundamentally in scope: where AWX manages Ansible execution, Kestra orchestrates cross-tool workflows. AWX is Ansible-centric by design; Kestra is language- and tool-agnostic. If you outgrow AWX's Ansible-only model, Kestra is a natural next step."
  - question: "Does Kestra support Event-Driven Ansible (EDA) style automation?"
    answer: "Yes, and without requiring a separate component. Kestra has built-in event-driven triggers—webhooks, message queues (Kafka, SQS, Pub/Sub), file detection, and polling triggers—that can kick off any workflow, including ones that run Ansible playbooks. EDA in AAP is Ansible-specific; Kestra's event system works across all tools in a workflow."
  - question: "How does Kestra handle Ansible secrets and inventory?"
    answer: "Kestra integrates with enterprise secrets managers (CyberArk, HashiCorp Vault, AWS Secrets Manager, Azure Key Vault) to inject credentials at runtime. Inventory can be passed as inputs, read from files, or fetched from an API as a workflow step. You maintain your existing inventory management and simply reference secrets via Kestra's secrets manager integration in the workflow YAML."
  - question: "Is Kestra suitable for large-scale Ansible fleet management?"
    answer: "Kestra scales horizontally with worker groups, allowing you to run Ansible against different network segments, data centers, or cloud regions using dedicated workers. For pure Ansible fleet management at massive scale, AAP's Controller with execution environments is well-optimized. For workflows that combine Ansible with other tools—which most enterprise automation requires—Kestra's architecture handles both the orchestration and execution at scale."
  - question: "Is Kestra an alternative to Ansible Tower or the automation controller?"
    answer: "Yes. Ansible Tower became the automation controller inside Ansible Automation Platform. Kestra replaces that controller layer and keeps your playbooks, roles and inventories. Our guide to <a href='/resources/infrastructure/ansible-tower-alternatives'>Ansible Tower and automation controller alternatives</a> compares the other options. If you run AWX, see <a href='/resources/infrastructure/awx-alternatives'>AWX alternatives</a>."
  - question: "How does Kestra's licensing compare to AAP's?"
    answer: "AAP is licensed per managed node. Kestra Enterprise isn't priced per node, so automating more servers and devices doesn't change your license. Kestra's open source edition is free under Apache 2.0."
  - question: "What about Red Hat's automation orchestrator?"
    answer: "It's a paid add-on for AAP 2.7 and later that adds workflow logic above the controller, on its own OpenShift cluster. Kestra covers the same workflow layer on any infrastructure, with YAML in Git, across every tool."
