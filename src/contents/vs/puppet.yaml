architecture:
  title: "How are Puppet and Kestra built?"
  lead: "Puppet compiles a catalog of the state each node should be in, and an agent on the node applies it. Kestra runs the steps of a workflow from its workers."
  competitor:
    title: "Puppet: catalogs applied by agents"
    text: "Manifests in the Puppet language declare resources in modules. On each run the agent sends its facts to the primary server, which compiles a catalog from manifests, modules and data and returns it for the agent to apply."
    list:
      - "Agents run every 30 minutes by default"
      - "The agent sends a report after each run"
      - "PuppetDB stores the data each run generates"
      - "Bolt runs tasks and plans over SSH or WinRM"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file of tasks that run in sequence, in parallel or in loops. The executor tracks state in Kestra's database and hands each task to a worker, which runs a script, opens an SSH session or calls an API."
    list:
      - "Each plugin task is checked against its schema on save"
      - "Script tasks install their dependencies per task"
      - "Worker groups place workers next to the hosts they manage (Kestra Enterprise)"
      - "Every save creates a revision you can diff and roll back"

compare:
  title: "What does the same runbook look like in each?"
  lead: "The same runbook in both: restart a service on each server in turn, check that it is active, and stop at the first server where it fails."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Bolt plan"
    file: "restart_service.pp"
    lang: puppet
    code: |
      plan ops::restart_service (
        TargetSpec $targets,
        Enum['nginx', 'haproxy'] $service = 'nginx',
      ) {
        get_targets($targets).each |$target| {
          $result = run_command(
            "sudo systemctl restart ${service} && systemctl is-active ${service}",
            $target,
            '_catch_errors' => true,
          )
          unless $result.ok {
            fail_plan("${service} did not restart on ${target.name}")
          }
        }
        out::message("${service} restarted on all targets")
      }
  kestra:
    code: |
      id: restart_service
      namespace: ops.runbooks

      inputs:
        - id: service
          type: SELECT
          values: [nginx, haproxy]
          defaults: nginx
        - id: hosts
          type: ARRAY
          itemType: STRING

      tasks:
        - id: each_host
          type: io.kestra.plugin.core.flow.Loop
          values: "{{ inputs.hosts }}"
          concurrencyLimit: 1
          tasks:
            - id: restart
              type: io.kestra.plugin.fs.ssh.Command
              host: "{{ item.value }}"
              username: "{{ secret('SSH_USER') }}"
              authMethod: PUBLIC_KEY
              privateKey: "{{ secret('SSH_PRIVATE_KEY') }}"
              commands:
                - sudo systemctl restart {{ inputs.service }}
                - systemctl is-active {{ inputs.service }}

        - id: done
          type: io.kestra.plugin.core.log.Log
          message: "{{ inputs.service }} restarted on all hosts"

setup:
  title: "What does it take to get running?"
  lead: "Both run on your own servers. Puppet Enterprise installs from a tarball, and Kestra starts from one Compose file."
  competitor:
    title: "Puppet Enterprise"
    tag: "Single node"
    text: "Puppet's <a href='https://help.puppet.com/pe/2025.9/topics/install-pe-using-installer-tarball.htm'>install guide</a> puts the primary server, the console and PuppetDB on one *nix node, run as root, which is enough to try Puppet Enterprise with up to 10 nodes. Each managed node then needs a Puppet agent."
    code: |
      curl -JLO "<URL>"
      tar -xzf <TARBALL_FILENAME>
      cd <INSTALLER_DIRECTORY>
      ./puppet-enterprise-installer
  kestra:
    title: "Kestra"
    tag: "Database included"
    text: "One Compose file starts Kestra and its Postgres database. Open localhost:8080, pick a blueprint and run it. Production runs the same image on Kubernetes with the <a href='/docs/installation/kubernetes'>Kestra Helm chart</a>."
    code: |
      curl -o docker-compose.yml https://raw.githubusercontent.com/kestra-io/kestra/develop/docker-compose.yml
      docker compose up

pairs:
  - title: "How hard is it to move from Puppet to Kestra?"
    columns:
      - label: "Leaving Puppet"
        brand: competitor
        text: "Manifests and Hiera data describe node state, so they have no direct Kestra equivalent and can keep running under Puppet. Bolt plans, scripts, and the cron jobs or CI pipelines that call Puppet are the parts that move."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Bolt commands and scripts become shell, SSH or PowerShell tasks, plan parameters become inputs, and loops over targets become Loop tasks. A flow can also start an agent run on a node over SSH with puppet agent -t, so Puppet keeps enforcing state while the workflow around it moves."
  - title: "What do licensing, pricing and self-hosting look like?"
    columns:
      - label: "Puppet"
        brand: competitor
        text: "Perforce ships new Puppet builds as Puppet Core, free under a developer license on up to 25 nodes and commercially licensed above that. The open-source source code stays under Apache 2.0. Puppet Enterprise and Puppet Enterprise Advanced are priced on request."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Puppet teams"

commonQuestions:
  - question: "Is open-source Puppet still available?"
    answer: "The source code is still published under Apache 2.0. Since early 2025, Perforce ships new builds and packages as Puppet Core from a private location, free under a developer license up to 25 nodes, with a commercial license above that."
  - question: "Does Kestra replace Puppet?"
    answer: "For node configuration, no. Kestra has no agent that enforces a desired state. It takes over the scripts, cron jobs and manual steps around Puppet, such as provisioning, approvals, checks and tickets, and can start an agent run as one task when you need it."
  - question: "How does Kestra compare to Bolt?"
    answer: "Both run steps across hosts without an agent on the targets. A Bolt plan is Puppet-language code that you run from the Bolt CLI or Puppet Enterprise. A Kestra flow is YAML with its own triggers, retries per task, a UI with execution history, and a revision for every save."
  - question: "Does Kestra detect configuration drift?"
    answer: "No. Enforcing state stays with Puppet. A scheduled flow can still run checks, and the Ansible CLI task's checkMode and diff options report what a playbook would change without applying it, and the next task can open a ticket when it finds a change."
  - question: "Do I need an agent on each node?"
    answer: "No. Kestra workers reach hosts over SSH, call APIs, or run Ansible and Terraform. Worker groups (Kestra Enterprise) run tasks on workers installed inside a specific network, including Windows workers for PowerShell."
  - question: "How are passwords and SSH keys stored?"
    answer: "Tasks read credentials with the secret() function. The open-source edition reads secrets from environment variables, and Kestra Enterprise adds namespace-level secrets and external managers such as HashiCorp Vault and Azure Key Vault."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute, and Kestra Enterprise reaches 7,000 a minute. Workers scale horizontally, and Leroy Merlin France runs more than 5,000 flows on Kestra."

