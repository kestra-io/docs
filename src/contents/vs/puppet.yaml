title: "Kestra vs Puppet: Orchestration vs Configuration"
description: "Compare Kestra and Puppet: manifests enforced by agents and Bolt plans vs YAML flows, the same service restart in both, setup, migration and licensing."
competitorName: Puppet
category: Infrastructure Automation
shortDescription: "Puppet code enforced by an agent on every node vs. YAML flows that run scripts, SSH commands and playbooks as tasks."

brandColor:
  color: "#4c00ff"

intro:
  title: "Kestra vs. Puppet"
  description: "Puppet, from Perforce, keeps nodes in the state its manifests describe, with an agent that applies a catalog compiled by the primary server. Kestra is an open-source orchestrator that runs YAML flows, where scripts, SSH commands, Ansible playbooks and Terraform are tasks."

choose:
  title: "Puppet or Kestra?"
  competitor:
    title: "Puppet is the better fit if"
    list:
      - "You need a large fleet held in a desired state, with drift detected and corrected on every agent run."
      - "Your Puppet modules and Hiera data already describe how your servers should be configured."
      - "You want CIS and DISA STIG compliance enforced by the same tool, as Puppet Enterprise offers."
  kestra:
    title: "Choose Kestra if"
    list:
      - "Your work is multi-step operations across systems, such as provisioning, configuration, checks, tickets and notifications."
      - "Workflows start on webhooks, queue messages, file arrivals and other flows, as well as schedules."
      - "You want an orchestrator under Apache 2.0, free to self-host, with no node count in the license."

table:
  title: "How do Puppet and Kestra compare, feature by feature?"
  rows:
    - label: "What it manages"
      competitor: "Node state, such as packages, files and services, enforced by an agent"
      kestra: "Workflows of tasks across systems, with no per-node state"
    - label: "Definition"
      competitor: "Manifests and modules in the Puppet language, with Hiera data"
      kestra: "YAML flows, with Python, shell, PowerShell and other scripts as tasks"
    - label: "Where work runs"
      competitor: "The agent sends facts, the primary server compiles a catalog, and the agent applies it"
      kestra: "Workers run each task and reach hosts over SSH or through APIs"
    - label: "When it runs"
      competitor: "Agent runs every 30 minutes by default"
      kestra: "Schedules, webhooks, flow triggers, polling and realtime triggers"
    - label: "Ad hoc orchestration"
      competitor: "Bolt tasks and plans over SSH or WinRM, with no agent on the targets"
      kestra: "Flows with Loop, Parallel, If and subflows, started from the UI, API or a trigger"
    - label: "Drift"
      competitor: "Detected and corrected on each agent run"
      kestra: "No drift detection; a scheduled flow can run checks"
    - label: "Content"
      competitor: "Modules on the Puppet Forge"
      kestra: "{totalPlugins}+ plugins, versioned apart from the core"
    - label: "Builds"
      competitor: "Puppet Core builds from Perforce, free for development on up to 25 nodes; source code stays Apache 2.0"
      kestra: "Apache 2.0 builds and source"
    - label: "Pricing"
      competitor: "Puppet Core Commercial, Puppet Enterprise and Puppet Enterprise Advanced quoted by Perforce"
      kestra: "Free open source; Kestra Cloud billed on usage"
    - label: "Hosting"
      competitor: "Primary server on *nix; agents on Linux and Windows"
      kestra: "Docker or Kubernetes, air-gapped (Kestra Enterprise), or Kestra Cloud"

