architecture:
  title: "How are Dagster and Kestra built?"
  lead: "Dagster loads Python definitions from code locations and records the assets they produce. Kestra stores each flow as YAML and sends its tasks to workers."
  competitor:
    title: "Dagster: software-defined assets"
    text: "An asset is a Python function that produces a table, file or model. Code location servers load these definitions, and the daemon runs schedules, sensors and the run queue."
    list:
      - "Code location servers expose definitions to the webserver and daemon"
      - "One daemon evaluates schedules, sensors and automation conditions"
      - "A run launcher starts each run as a process, container or Kubernetes pod"
      - "Run history is stored in SQLite by default, or Postgres"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML document checked against each plugin's schema when you save it. The executor decides which task runs next, and workers run the task code."
    list:
      - "Saving a flow runs no user code"
      - "The scheduler evaluates schedule, polling and realtime triggers"
      - "Workers receive tasks from the worker controller over gRPC"
      - "Script tasks run in a container or a process, with dependencies per task"

compare:
  title: "What does the same pipeline look like in each?"
  lead: "The same pipeline in both: a CSV download with two retries, a DuckDB aggregation that runs after it, a daily schedule and a Slack alert when a run fails."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Dagster assets"
    file: "definitions.py"
    lang: python
    code: |
      import os

      import dagster as dg
      import duckdb
      import requests
      from dagster_slack import make_slack_on_run_failure_sensor

      @dg.asset(retry_policy=dg.RetryPolicy(max_retries=2, delay=300))
      def raw_orders() -> None:
          response = requests.get("https://example.com/exports/orders.csv", timeout=60)
          response.raise_for_status()
          with open("orders.csv", "wb") as f:
              f.write(response.content)

      @dg.asset(deps=[raw_orders])
      def daily_revenue() -> None:
          duckdb.sql(
              "COPY (SELECT order_date, SUM(amount) AS revenue "
              "FROM read_csv_auto('orders.csv') GROUP BY order_date) "
              "TO 'daily_revenue.csv' (HEADER)"
          )

      defs = dg.Definitions(
          assets=[raw_orders, daily_revenue],
          schedules=[
              dg.ScheduleDefinition(
                  name="daily_refresh",
                  cron_schedule="0 6 * * *",
                  target=[raw_orders, daily_revenue],
              )
          ],
          sensors=[make_slack_on_run_failure_sensor("#data-alerts", os.environ["SLACK_TOKEN"])],
      )
  kestra:
    code: |
      id: daily_revenue
      namespace: company.analytics

      tasks:
        - id: raw_orders
          type: io.kestra.plugin.core.http.Download
          uri: https://example.com/exports/orders.csv
          retry:
            type: constant
            interval: PT5M
            maxAttempts: 3

        - id: daily_revenue
          type: io.kestra.plugin.jdbc.duckdb.Query
          inputFiles:
            orders.csv: "{{ outputs.raw_orders.uri }}"
          outputFiles:
            - daily_revenue
          sql: |
            COPY (
              SELECT order_date, SUM(amount) AS revenue
              FROM read_csv_auto('{{ workingDir }}/orders.csv')
              GROUP BY order_date
            ) TO '{{ outputFiles.daily_revenue }}' (HEADER);

      errors:
        - id: slack_alert
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          messageText: "daily_revenue failed: {{ execution.id }}"

      triggers:
        - id: daily
          type: io.kestra.plugin.core.trigger.Schedule
          cron: "0 6 * * *"

setup:
  title: "What does it take to get running?"
  lead: "Both run on a laptop after a few commands."
  competitor:
    title: "Dagster"
    tag: "Python project"
    text: "Dagster's <a href='https://dagster.io/docs/getting-started/quickstart'>quickstart</a> scaffolds a uv project and starts the UI on localhost:3000 with dg dev. In production, the webserver, the daemon and each code location run as separate services, with Postgres for run storage."
    code: |
      uvx create-dagster@latest project dagster-quickstart
      cd dagster-quickstart
      source .venv/bin/activate
      dg dev
  kestra:
    title: "Kestra"
    tag: "Database included"
    text: "One Compose file starts Kestra and its Postgres database. Open localhost:8080, pick a blueprint and run it. Production runs the same image on Kubernetes with the <a href='/docs/installation/kubernetes'>Kestra Helm chart</a>."
    code: |
      curl -o docker-compose.yml https://raw.githubusercontent.com/kestra-io/kestra/develop/docker-compose.yml
      docker compose up

pairs:
  - title: "How hard is it to move from Dagster to Kestra?"
    columns:
      - label: "Leaving Dagster"
        brand: competitor
        text: "Asset functions reach into Dagster for resources, I/O managers, partitions and run context, and the graph comes from function arguments and deps. The logic in each function has to be separated from that wiring before it moves."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Python, SQL and dbt code runs in script tasks unchanged. Each asset becomes a task, each schedule or sensor a trigger, and each dependency a position in the flow. Dagster keeps running while flows move over one at a time."
  - title: "What do licensing, pricing and self-hosting look like?"
    lead: "Both are Apache 2.0 projects you can run on your own servers."
    columns:
      - label: "Dagster"
        brand: competitor
        text: "Apache 2.0, so self-hosting carries no license fee. Dagster+ is billed by plan plus credits for every asset materialization and op execution, with serverless compute billed by the minute. Pricing is quoted on request."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Dagster teams"

commonQuestions:
  - question: "Can I keep my Python code when I leave Dagster?"
    answer: "Yes. The body of each asset function is ordinary Python, and it runs in a Python script task with its packages installed per task. You drop the decorators and the Dagster resources, and pass values between tasks as outputs or files. The optional Kestra Python library sends outputs and metrics back to the flow."
  - question: "How does Kestra run dbt?"
    answer: "The dbt plugin runs dbt commands such as dbt build against a project stored in namespace files or cloned from Git, inside a container with the adapter you choose. Dagster maps each dbt model to an asset. In Kestra, the dbt command is a task, and model selection uses dbt's own selectors."
  - question: "Does Kestra track lineage like Dagster's asset graph?"
    answer: "Kestra Enterprise and Kestra Cloud record assets, the tables, files and infrastructure each task reads and writes, and build lineage from them. In the open-source edition, the topology view shows task dependencies within a flow, and flow triggers show which flows start which."
  - question: "How does Kestra handle backfills?"
    answer: "Pick a time window on a Schedule trigger and Kestra creates one execution per missed interval, with the scheduled date available to every task. Where Dagster defines partitions on the asset, a Kestra flow usually takes the partition as an input or reads it from the trigger date."
  - question: "Can Kestra and Dagster run side by side?"
    answer: "Yes. A Kestra flow can launch a Dagster job through Dagster's GraphQL API with an HTTP task, so teams move pipelines in batches while the rest keep running on Dagster."
  - question: "Do people outside the data team need Python to use Kestra?"
    answer: "No. Flows are YAML, and the editor shows the topology and plugin documentation as you type. Analysts and operators can run flows with typed inputs from the UI, while engineers keep writing Python, SQL or shell inside the tasks."
  - question: "How far does Kestra scale?"
    answer: "Kestra's <a href='/docs/performance/benchmark'>benchmark</a> measured 4,000 executions a minute for the open-source edition on Postgres and 7,000 a minute for Kestra Enterprise. Workers scale horizontally, and Apple's ML team of 200 engineers runs its ETL on Kestra."

