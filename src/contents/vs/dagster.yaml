      competitor: "Python functions decorated with @asset, registered in Definitions"
      kestra: "YAML flows, validated against plugin schemas on save"
    - label: "Unit of work"
      competitor: "Assets (tables, files, models) and ops"
      kestra: "Tasks, grouped into flows and subflows"
    - label: "Languages"
      competitor: "Python, with other languages launched from Python through Dagster Pipes"
      kestra: "Python, SQL, Node.js, Go, R, shell and more, as tasks"
    - label: "Automation"
      competitor: "Schedules, sensors, asset sensors and declarative automation conditions"
      kestra: "Schedules, webhooks, flow triggers, polling and realtime triggers"
    - label: "Data lineage"
      competitor: "Asset lineage graph, with dbt models loaded as assets"
      kestra: "Assets and lineage in Kestra Enterprise and Kestra Cloud"
    - label: "Access control"
      competitor: "Authentication, RBAC and audit logs in Dagster+"
      kestra: "Namespaces, with RBAC, SSO and audit logs in Kestra Enterprise"
    - label: "Integrations"
      competitor: "Python libraries such as dagster-dbt and dagster-slack"
      kestra: "{totalPlugins}+ plugins, versioned apart from the core"
    - label: "Hosting"
      competitor: "Self-hosted, or Dagster+ Serverless or Hybrid"
      kestra: "Self-hosted, air-gapped (Kestra Enterprise), or Kestra Cloud"
    - label: "License"
      competitor: "Apache 2.0"
      kestra: "Apache 2.0"
    - label: "GitHub stars"
      competitor: "16k+"
      kestra: "30k+"

