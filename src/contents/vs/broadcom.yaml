architecture:
  title: "How are Dollar Universe and Kestra built?"
  lead: "Dollar Universe spreads scheduling across peer servers that each run their own workload. Kestra keeps flows and their state in one place and scales by adding workers."
  competitor:
    title: "Dollar Universe: Uprocs on peer-to-peer nodes"
    text: "A Uproc wraps a script or command, and sessions chain Uprocs with their dependencies. A task schedules a Uproc or session on a management unit, and Univiewer Management Server deploys it to the nodes that run it."
    list:
      - "Each node keeps full scheduling, so rerouted work continues after a failure"
      - "Univiewer Console designs, deploys and monitors objects"
      - "Template tasks act as blueprints deployed to management units"
      - "Managers extend scheduling into SAP, Oracle and other applications"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file with its triggers, tasks and error handling in one place. The executor tracks state in Kestra's database and hands each task to a worker, which runs a script or calls an API."
    list:
      - "Schedule triggers backfill missed runs"
      - "Subflows and flow triggers chain flows across namespaces"
      - "Worker groups pin tasks to specific hosts or networks (Kestra Enterprise)"
      - "Every save creates a revision you can diff and roll back"

pairs:
  - title: "How hard is it to move from Dollar Universe to Kestra?"
    columns:
      - label: "Leaving Dollar Universe"
        brand: competitor
        text: "Uprocs, sessions, tasks and management units are Dollar Universe objects, and the scripts a Uproc calls often live on the nodes themselves. Each session's dependencies, launch formulas and conditions need mapping before it moves."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Each Uproc becomes a script or plugin task, a session becomes a flow or a set of subflows, and a task's schedule becomes a Schedule trigger. Dollar Universe keeps running sessions until the flows that replace them are live."
  - title: "What do licensing, pricing and self-hosting look like?"
    columns:
      - label: "Dollar Universe"
        brand: competitor
        text: "Proprietary Broadcom software that you install on your own servers. Broadcom publishes no prices for Dollar Universe on its product pages, and its support portal lists end-of-support dates for each release."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Dollar Universe teams"

commonQuestions:
  - question: "Is Dollar Universe still a supported product?"
    answer: "Broadcom lists Dollar Universe Workload Automation as a current product and publishes end-of-support dates for each release in its support portal. Check those dates for your release when planning a move."
  - question: "How does a Uproc map to Kestra?"
    answer: "The script a Uproc runs moves into a shell, Python or PowerShell task, its variables become inputs, and its launch conditions become an If task or a flow trigger with preconditions on other flows."
  - question: "Can Kestra run jobs on the same servers Dollar Universe uses today?"
    answer: "Yes. SSH tasks run commands on existing hosts. In Kestra Enterprise, a worker installed on a server joins a worker group so tasks run locally, including Windows workers for PowerShell and batch commands."
  - question: "Can both run side by side during the move?"
    answer: "Yes. Move one session at a time. A Uproc can call a Kestra Webhook trigger with an HTTP request, so a Dollar Universe session can hand work to a flow until the last session moves."
  - question: "What replaces Univiewer for monitoring?"
    answer: "The Kestra UI shows each execution's topology, Gantt view, logs and outputs. A failed task can be replayed after a fix without rerunning the tasks that succeeded."
  - question: "How does Kestra handle access control and audit?"
    answer: "Namespaces separate teams and environments in every edition. Kestra Enterprise adds RBAC scoped to namespaces, SSO with OIDC or LDAP, and audit logs that record every user action and resource change."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute, and Kestra Enterprise reaches 7,000 a minute. Workers scale horizontally, and Fila runs 2.5 million executions a month on Kestra."

