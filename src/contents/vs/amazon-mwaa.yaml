architecture:
  title: "How are Amazon MWAA and Kestra built?"
  lead: "MWAA hosts one Airflow deployment per environment in your AWS account. Kestra separates the control plane from the workers that run tasks, wherever you host them."
  competitor:
    title: "Amazon MWAA: an Airflow environment in your VPC"
    text: "Schedulers and workers run as AWS Fargate containers in your VPC's private subnets, with an AWS-managed Aurora PostgreSQL metadata database. Every component reads DAGs, plugins.zip and requirements.txt from a versioned S3 bucket."
    list:
      - "MWAA syncs DAG files from S3 to schedulers, workers and the web server"
      - "The Celery executor sends tasks to workers that autoscale between a minimum and maximum"
      - "All DAGs run with the environment's IAM execution role"
      - "Logs and metrics are sent to CloudWatch"
  kestra:
    title: "Kestra: a control plane and workers you place"
    text: "Kestra reads each flow as YAML, so loading it runs no user code. The executor decides what runs next, and workers connect to it over gRPC from any network that can reach the controller."
    list:
      - "The scheduler evaluates schedules, polling triggers and realtime triggers"
      - "Script tasks run in containers with dependencies declared per task"
      - "Task runners send heavy jobs to AWS Batch or Kubernetes"
      - "Every save creates a flow revision you can diff or roll back"

compare:
  title: "What does the same S3 pipeline look like in each?"
  lead: "The same pipeline in both: wait for a CSV in S3, run a Glue job, refresh an Athena query, and alert an SNS topic if a task fails."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "MWAA DAG"
    file: "sales_files.py"
    lang: python
    code: |
      from datetime import datetime

      from airflow import DAG
      from airflow.providers.amazon.aws.notifications.sns import send_sns_notification
      from airflow.providers.amazon.aws.operators.athena import AthenaOperator
      from airflow.providers.amazon.aws.operators.glue import GlueJobOperator
      from airflow.providers.amazon.aws.sensors.s3 import S3KeySensor

      with DAG(
          dag_id="sales_files",
          schedule="@hourly",
          start_date=datetime(2026, 1, 1),
          catchup=False,
          on_failure_callback=send_sns_notification(
              target_arn="arn:aws:sns:eu-west-1:123456789012:alerts",
              message="sales_files failed",
          ),
      ):
          wait_for_file = S3KeySensor(
              task_id="wait_for_file",
              bucket_name="example-landing",
              bucket_key="sales/*.csv",
              wildcard_match=True,
              mode="reschedule",
          )

          transform = GlueJobOperator(task_id="transform", job_name="clean_sales")

          refresh_report = AthenaOperator(
              task_id="refresh_report",
              query="sql/daily_sales.sql",
              database="analytics",
              output_location="s3://example-athena-results/",
          )

          wait_for_file >> transform >> refresh_report
  kestra:
    code: |
      id: sales_files
      namespace: company.analytics

      tasks:
        - id: transform
          type: io.kestra.plugin.aws.glue.StartJobRun
          region: eu-west-1
          jobName: clean_sales
          arguments:
            --input_uri: "{{ trigger.objects[0].uri }}"

        - id: refresh_report
          type: io.kestra.plugin.aws.athena.Query
          region: eu-west-1
          database: analytics
          outputLocation: s3://example-athena-results/
          query: "{{ read('sql/daily_sales.sql') }}"

      errors:
        - id: alert
          type: io.kestra.plugin.aws.sns.Publish
          region: eu-west-1
          topicArn: "{{ secret('ALERTS_TOPIC_ARN') }}"
          from:
            data: "sales_files failed: {{ execution.id }}"

      triggers:
        - id: on_upload
          type: io.kestra.plugin.aws.s3.Trigger
          region: eu-west-1
          bucket: example-landing
          prefix: sales/
          regexp: ".*\\.csv$"
          on: CREATE
          action: NONE

pairs:
  - title: "How hard is it to move from Amazon MWAA to Kestra?"
    columns:
      - label: "Leaving Amazon MWAA"
        brand: competitor
        text: "MWAA runs standard Airflow, so the DAGs carry the same coupling as anywhere else, with operators, XCom and the task context wrapped around the business logic. The environment adds its own pieces to carry over, namely the execution role's permissions, the packages in requirements.txt, and the Airflow connections and variables."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Glue, Athena, S3 and Lambda calls become tasks from the Kestra AWS plugin, and Python callables run in script tasks. During the move, a Kestra flow can start the DAGs still on MWAA through the Airflow REST API. The <a href='/resources/migration/airflow'>Airflow migration guide</a> maps each Airflow concept to its Kestra equivalent."
  - title: "How do Amazon MWAA and Kestra compare on licensing, pricing and self-hosting?"
    lead: "MWAA is an AWS service billed by the hour. Kestra is open source and runs wherever you deploy it."
    columns:
      - label: "Amazon MWAA"
        brand: competitor
        text: "A proprietary AWS service that runs open-source Airflow. You pay per hour for the environment class, plus any extra workers, schedulers and web servers, and metadata storage per GB-month. MWAA Serverless bills task run time per second with a one-minute minimum per task. Production runs only on AWS."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Amazon MWAA teams"

commonQuestions:
  - question: "Can Kestra run alongside MWAA while we migrate?"
    answer: "Yes. The Kestra Airflow plugin's TriggerDagRun task starts a DAG through the Airflow REST API and can wait for it to finish. MWAA accepts those calls with a web server access token, which you pass in the task's headers. New workflows start in Kestra, existing DAGs move in batches, and MWAA keeps running until the last one moves."
  - question: "Can Kestra run inside our AWS account?"
    answer: "Yes. Kestra has installation guides for <a href='/docs/installation/kubernetes-aws-eks'>Amazon EKS</a> and <a href='/docs/installation/aws-ec2'>EC2</a>, and task runners can send scripts to AWS Batch. Kestra Enterprise reads secrets from AWS Secrets Manager or SSM Parameter Store."
  - question: "Which AWS services does Kestra connect to?"
    answer: "The AWS plugin covers S3, Glue, Athena, EMR, Lambda, SNS, SQS, Kinesis and more, alongside {totalPlugins}+ plugins in total. S3, SQS and Kinesis also have triggers, so a file or a message can start a flow. Each task can use access keys or assume an IAM role through STS."
  - question: "MWAA Serverless also uses YAML. How does it differ from Kestra?"
    answer: "MWAA Serverless reads workflow definitions in the open-source DAG Factory format, so each task still names an Airflow operator. It provisions compute for each run, schedules through EventBridge Scheduler and runs only on AWS. Kestra flows use their own YAML format with typed plugin tasks, triggers and error handlers, and run on any infrastructure."
  - question: "How do upgrades differ?"
    answer: "MWAA upgrades an environment in place between minor Airflow versions, and a new major version means creating a new environment. AWS supports each Airflow version for at least 12 months after it becomes available and announces end of support 180 days ahead. With Kestra, you decide when to pull a new image, test it in staging and roll it out."
  - question: "How does access control compare?"
    answer: "In MWAA, IAM policies decide who can open the Airflow UI and with which Airflow role, and every DAG runs with the environment's execution role. Teams that don't trust each other's DAG code need separate environments. Kestra Enterprise scopes RBAC, secrets and variables to namespaces, adds SSO and audit logs, and can split an instance into tenants."
  - question: "How far does Kestra scale?"
    answer: "Kestra's <a href='/docs/performance/benchmark'>benchmark</a> measures 4,000 executions a minute for the open-source edition on Postgres and 7,000 a minute for Kestra Enterprise. Executors and workers are separate services, so each one scales out on its own."

