title: "Kestra vs Amazon MWAA: Managed Airflow Compared"
description: "Compare Kestra and Amazon MWAA: managed Airflow inside AWS vs YAML flows on any cloud. Architecture, pricing, the same S3 pipeline in both, and migration."
competitorName: Amazon MWAA
category: Data Orchestration
shortDescription: "Managed Airflow inside your AWS account vs. YAML flows you run on any cloud or on Kestra Cloud."

guideCta:
  title: "Moving off Amazon MWAA?"
  description: "Your DAGs are Airflow DAGs. The Airflow migration guide maps DAGs, operators and schedules to Kestra and plans the move in waves."
  cta:
    label: "Read the Airflow migration guide"
    href: "/resources/migration/airflow"

brandColor:
  color: "#FF9900"

intro:
  title: "Kestra vs. Amazon MWAA"
  description: "Amazon MWAA runs Apache Airflow for you inside your AWS account, reading DAG files from an S3 bucket. Kestra, an open-source orchestration platform, runs YAML flows on Docker, Kubernetes or Kestra Cloud, in any cloud or on-premises."

choose:
  title: "Amazon MWAA or Kestra?"
  competitor:
    title: "Amazon MWAA is the better fit if"
    list:
      - "Your pipelines are already Airflow DAGs, and the data they touch lives in AWS."
      - "You want AWS to run the schedulers, workers and metadata database, with IAM and CloudWatch wired in."
      - "You want orchestration billed on your AWS account, with no other vendor to onboard."
  kestra:
    title: "Choose Kestra if"
    list:
      - "Your workloads also run on Google Cloud, Azure or on-premises, and you want one orchestrator across all of them."
      - "Platform, analytics and ops teams need to write workflows without packaging Python for an S3 bucket."
      - "Each workflow needs its own dependencies, apart from the requirements.txt the whole environment shares."

table:
  title: "How do Amazon MWAA and Kestra compare, feature by feature?"
  rows:
    - label: "Workflow definition"
      competitor: "Python DAG files in S3; YAML definitions on MWAA Serverless"
      kestra: "YAML flows, checked against each plugin's schema on save"
    - label: "Where it runs"
      competitor: "AWS only, with schedulers and workers in your VPC"
      kestra: "Any cloud, on-premises, air-gapped (Kestra Enterprise), or Kestra Cloud"
    - label: "Pricing"
      competitor: "Hourly per environment class, plus extra workers, schedulers, web servers and storage"
      kestra: "Free open source; Kestra Cloud billed on usage; Enterprise per instance"
    - label: "Capacity"
      competitor: "Environment classes rated from 25 DAGs (mw1.micro) to 4,000 (mw1.2xlarge), up to 25 workers"
      kestra: "Workers scale horizontally; 4,000 executions a minute on Postgres in the open-source benchmark"
    - label: "Python dependencies"
      competitor: "One requirements.txt and plugins.zip for every DAG in the environment"
      kestra: "Declared per task, installed in that task's container"
    - label: "Triggers"
      competitor: "Airflow schedules and sensors such as S3KeySensor"
      kestra: "Schedules, webhooks, and S3, SQS and Kinesis triggers"
    - label: "Upgrades"
      competitor: "In-place upgrades between minor Airflow versions that AWS supports"
      kestra: "You pull a new Kestra image when your team is ready"
    - label: "Team isolation"
      competitor: "Separate environments, or an experimental multi-team mode with one shared execution role"
      kestra: "Namespaces with RBAC, SSO and tenants"
    - label: "AWS integration"
      competitor: "Amazon provider operators, an IAM execution role and CloudWatch logs and metrics built in"
      kestra: "AWS plugin for S3, Glue, Athena, EMR, Lambda and more, with credentials or an assumed role per task"

