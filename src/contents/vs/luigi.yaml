title: "Kestra vs Spotify Luigi: Beyond Python Batch Jobs"
description: "Compare Kestra and Spotify's Luigi: Python task classes run from cron vs YAML flows with built-in schedules and triggers. Architecture, code, setup, migration."
competitorName: Luigi
category: "Data Orchestration"
shortDescription: "A Python library for batch job dependencies vs. an orchestration platform with schedules, triggers and a UI."

brandColor:
  color: "#28A745"

intro:
  title: "Kestra vs. Luigi"
  description: "Luigi is a Python module from Spotify for building pipelines of batch jobs, where each task declares its dependencies and the output it produces. Kestra is an orchestration platform that runs YAML flows with built-in schedules, event triggers and a UI."

choose:
  title: "Luigi or Kestra?"
  competitor:
    title: "Luigi is the better fit if"
    list:
      - "Your pipelines are Python batch jobs that write files or tables, and you rely on Luigi skipping tasks whose output already exists."
      - "You want a library you install with pip, plus a small central scheduler, and no database to run."
      - "Your jobs already use Luigi's contrib modules for Hadoop, Spark, BigQuery or Redshift, and they work."
  kestra:
    title: "Choose Kestra if"
    list:
      - "Schedules, retries, event triggers and alerts should live in the orchestrator, out of cron entries and config files."
      - "Steps are written in SQL, shell, dbt or other languages as well as Python."
      - "People beyond the original authors need run history, logs and failures in a UI."

table:
  title: "How do Luigi and Kestra compare, feature by feature?"
  rows:
    - label: "Workflow definition"
      competitor: "Python classes that subclass luigi.Task"
      kestra: "YAML flows, edited in code or in the no-code editor"
    - label: "Dependencies"
      competitor: "requires() returns upstream tasks; output() targets mark completion"
      kestra: "Task order in the flow, plus Parallel, Loop and Subflow tasks"
    - label: "Scheduling"
      competitor: "None built in; cron or another scheduler starts each run"
      kestra: "Schedule trigger with backfills"
    - label: "Event triggers"
      competitor: "None built in; cron can poll for new data"
      kestra: "Webhook, file, message queue and database triggers"
    - label: "Re-running work"
      competitor: "Tasks whose output targets exist are skipped"
      kestra: "Replay an execution or restart it from the failed task"
    - label: "Retries"
      competitor: "retry_count, retry_delay and disable_window in the scheduler config"
      kestra: "A retry block per task or per flow"
    - label: "Execution"
      competitor: "The worker process runs each run() itself; luigid runs nothing"
      kestra: "Workers run tasks in processes or containers, or on Kubernetes and cloud batch services"
    - label: "UI"
      competitor: "Visualiser with task status and the dependency graph; task history is experimental"
      kestra: "Flow editor, execution history, logs, Gantt view and metrics"
    - label: "Alerts"
      competitor: "Error emails through SMTP, SendGrid, SES or SNS"
      kestra: "Slack, Teams, email and other notification tasks in an errors block"
    - label: "Project"
      competitor: "Apache 2.0, maintained by Spotify's Data Team, 18k+ GitHub stars"
      kestra: "Apache 2.0, 30k+ GitHub stars"

