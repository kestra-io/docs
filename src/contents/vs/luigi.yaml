architecture:
  title: "How are Luigi and Kestra built?"
  lead: "Luigi is a library that your own processes run. Kestra is a server that owns scheduling, execution and history."
  competitor:
    title: "Luigi: a Python library and a central scheduler"
    text: "A pipeline is a set of Task classes. When a run starts, the worker process walks requires() back to the tasks whose outputs are missing and calls run() on each of them in that same process."
    list:
      - "luigid keeps two workers from running the same task"
      - "A task counts as complete when its output targets exist"
      - "cron or another scheduler starts each run"
      - "RangeDaily fills in missed dates each time cron calls it"
  kestra:
    title: "Kestra: a server that runs flows"
    text: "Kestra runs a scheduler, an executor and workers as one process or as separate services. Every execution's state, logs and outputs are stored, so the UI and API can show what ran and why it failed."
    list:
      - "The scheduler fires schedules, polling triggers and realtime triggers"
      - "The executor picks the next task and applies retries"
      - "Workers run scripts in containers with per-task dependencies"
      - "Backfills replay missed schedule intervals between two dates"

compare:
  title: "What does the same batch job look like in each?"
  lead: "The same job in both: download a day of orders from an API, then total them per store into a CSV, once a day (from cron for Luigi, from a Schedule trigger for Kestra)."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Luigi tasks"
    file: "store_totals.py"
    lang: python
    code: |
      import csv
      from collections import defaultdict

      import luigi
      import requests


      class FetchOrders(luigi.Task):
          date = luigi.DateParameter()

          def output(self):
              return luigi.LocalTarget(f"data/orders_{self.date}.csv")

          def run(self):
              response = requests.get(f"https://api.example.com/orders?date={self.date}", timeout=30)
              response.raise_for_status()
              with self.output().open("w") as out:
                  out.write(response.text)


      class StoreTotals(luigi.Task):
          date = luigi.DateParameter()

          def requires(self):
              return FetchOrders(self.date)

          def output(self):
              return luigi.LocalTarget(f"data/store_totals_{self.date}.csv")

          def run(self):
              totals = defaultdict(float)
              with self.input().open() as orders:
                  for row in csv.DictReader(orders):
                      totals[row["store"]] += float(row["amount"])
              with self.output().open("w") as out:
                  csv.writer(out).writerows(totals.items())
  kestra:
    code: |
      id: store_totals
      namespace: company.retail

      tasks:
        - id: fetch_orders
          type: io.kestra.plugin.core.http.Download
          uri: "https://api.example.com/orders?date={{ trigger.date ?? execution.startDate | date('yyyy-MM-dd') }}"

        - id: store_totals
          type: io.kestra.plugin.scripts.python.Script
          inputFiles:
            orders.csv: "{{ outputs.fetch_orders.uri }}"
          outputFiles:
            - store_totals.csv
          script: |
            import csv
            from collections import defaultdict

            totals = defaultdict(float)
            with open("orders.csv") as orders:
                for row in csv.DictReader(orders):
                    totals[row["store"]] += float(row["amount"])
            with open("store_totals.csv", "w", newline="") as out:
                csv.writer(out).writerows(totals.items())

      triggers:
        - id: daily
          type: io.kestra.plugin.core.trigger.Schedule
          cron: "@daily"

setup:
  title: "What does it take to get Luigi and Kestra running?"
  lead: "Luigi installs with pip. Kestra starts with Docker Compose."
  competitor:
    title: "Luigi"
    tag: "Cron required"
    text: "The <a href='https://luigi.readthedocs.io/en/stable/central_scheduler.html'>central scheduler</a> serves the visualiser on port 8082 and keeps two workers from running the same task. It runs nothing itself, so cron or another scheduler starts each run."
    code: |
      pip install luigi python-daemon
      luigid --background --pidfile luigid.pid --logdir logs --state-path luigi-state.pickle
      luigi --module store_totals StoreTotals --date 2026-11-01
  kestra:
    title: "Kestra"
    tag: "Database included"
    text: "One Compose file starts Kestra and its Postgres database. Open localhost:8080, pick a blueprint and run it. Production runs the same image on Kubernetes with the <a href='/docs/installation/kubernetes'>Kestra Helm chart</a>."
    code: |
      curl -o docker-compose.yml https://raw.githubusercontent.com/kestra-io/kestra/develop/docker-compose.yml
      docker compose up

pairs:
  - title: "How hard is it to move from Luigi to Kestra?"
    columns:
      - label: "Leaving Luigi"
        brand: competitor
        text: "Each Task class mixes the graph with the work. requires() and output() describe the pipeline, run() holds the logic, and parameters such as dates tie the two together. The logic moves almost as it is, while the graph, targets and parameters are declared again in the flow."
      - label: "Moving to Kestra"
        brand: kestra
        text: "run() bodies become Python script tasks, requires() chains become task order, and DateParameter values come from the trigger date. Cron entries become Schedule triggers, and the gaps RangeDaily used to fill become backfills. Luigi's output-based skipping has no direct equivalent, so decide per pipeline whether a rerun overwrites its output or checks for it first."
  - title: "How do Luigi and Kestra compare on licensing, pricing and self-hosting?"
    lead: "Both projects are open source under Apache 2.0 and run on your own machines."
    columns:
      - label: "Luigi"
        brand: competitor
        text: "Apache 2.0, built at Spotify and maintained by Spotify's Data Team, with regular releases on PyPI. You install it with pip and run luigid, your workers and cron on your own machines."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Luigi teams"

commonQuestions:
  - question: "Is Luigi still maintained?"
    answer: "Yes. Spotify's Data Team maintains it, releases continue on PyPI, and Spotify still uses Luigi internally to run thousands of tasks a day. Kestra's additions are the pieces Luigi leaves to you, such as scheduling, event triggers, alerting and a shared UI."
  - question: "Can Kestra run our Luigi pipelines unchanged during a migration?"
    answer: "Yes. A Python Commands task can install your package and call luigi --module with the same task and parameters you use from cron today, so Kestra takes over the schedule, retries and alerts first. You then rewrite pipelines as native flows one at a time."
  - question: "Can Kestra skip work that already ran, like Luigi's output checks?"
    answer: "Not automatically. Kestra tracks executions, and output targets play no part in deciding what runs. Where skipping matters, a flow can check for the file or table first and branch with an If task, or record finished dates in the KV Store and read them at the start of each run."
  - question: "How do Luigi's date parameters and RangeDaily map to Kestra?"
    answer: "A Schedule trigger passes each run's date as trigger.date, which tasks use the way Luigi tasks use a DateParameter. To fill a gap, start a backfill on the trigger with a start and end date, and Kestra replays every interval in that window."
  - question: "Does Kestra cover the systems our Luigi contrib tasks talk to?"
    answer: "Kestra has plugins for Spark, BigQuery, Redshift, S3, Cloud Storage, Postgres, Kubernetes and many more, out of {totalPlugins}+ in total. Anything without a plugin runs as a Python or shell script task with the same code you call today."
  - question: "Is Kestra heavier to run than Luigi?"
    answer: "Yes, at the start. Luigi needs Python and the luigid process, while Kestra needs a server and a database such as Postgres, which one Docker Compose file starts together. In exchange, scheduling, retries, alerting, logs and execution history come built in, with nothing to assemble around cron."
  - question: "How far does Kestra scale?"
    answer: "Kestra's <a href='/docs/performance/benchmark'>benchmark</a> shows the open-source edition on Postgres running 4,000 executions a minute, and Kestra Enterprise 7,000. Workers scale horizontally as the number of flows grows."

