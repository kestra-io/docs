architecture:
  title: "How are Snowflake Tasks and Kestra built?"
  competitor:
    title: "Snowflake Tasks: SQL objects in a schema"
    text: "A task is a schema object that runs one SQL statement, procedure call or Snowflake Scripting block. Tasks linked with AFTER form a graph under a root task, and Snowflake fixes a version of the whole graph when the root task is resumed."
    list:
      - "A new task stays suspended until ALTER TASK ... RESUME"
      - "Serverless compute is sized by Snowflake for each run"
      - "A finalizer task runs after the graph, whether it succeeds or fails"
      - "Tasks pass values with SYSTEM$SET_RETURN_VALUE"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file of tasks that run in sequence, in parallel or in loops. The executor tracks state in Kestra's database and hands each task to a worker, which queries Snowflake, calls an API or runs a script."
    list:
      - "Snowflake tasks run queries, stage uploads and downloads, and the Snowflake CLI"
      - "Script tasks install their dependencies per task"
      - "Outputs and files pass between tasks by reference"
      - "Every save creates a revision you can diff and roll back"

compare:
  title: "What does the same pipeline look like in each?"
  lead: "The same pipeline in both: a COPY INTO load with retries, a stored procedure that builds a daily table, and a Slack message when the run ends."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Snowflake task graph"
    file: "orders_daily.sql"
    lang: sql
    code: |
      CREATE OR REPLACE TASK load_orders
        WAREHOUSE = transform_wh
        SCHEDULE = 'USING CRON 0 6 * * * UTC'
        TASK_AUTO_RETRY_ATTEMPTS = 2
      AS
        COPY INTO raw.orders FROM @raw.orders_stage FILE_FORMAT = (TYPE = 'CSV' SKIP_HEADER = 1);

      CREATE OR REPLACE TASK build_daily_orders
        WAREHOUSE = transform_wh
        AFTER load_orders
      AS
        CALL analytics.build_daily_orders();

      CREATE OR REPLACE TASK notify_team
        WAREHOUSE = transform_wh
        FINALIZE = load_orders
      AS
        CALL SYSTEM$SEND_SNOWFLAKE_NOTIFICATION(
          SNOWFLAKE.NOTIFICATION.TEXT_PLAIN(
            SNOWFLAKE.NOTIFICATION.SANITIZE_WEBHOOK_CONTENT('orders_daily finished')
          ),
          SNOWFLAKE.NOTIFICATION.INTEGRATION('slack_alerts')
        );

      ALTER TASK notify_team RESUME;
      ALTER TASK build_daily_orders RESUME;
      ALTER TASK load_orders RESUME;
  kestra:
    code: |
      id: orders_daily
      namespace: company.analytics

      retry:
        type: constant
        interval: PT1M
        maxAttempts: 3

      tasks:
        - id: load_orders
          type: io.kestra.plugin.jdbc.snowflake.Query
          url: "{{ secret('SNOWFLAKE_URL') }}"
          username: "{{ secret('SNOWFLAKE_USER') }}"
          password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
          warehouse: TRANSFORM_WH
          sql: COPY INTO raw.orders FROM @raw.orders_stage FILE_FORMAT = (TYPE = 'CSV' SKIP_HEADER = 1)

        - id: build_daily_orders
          type: io.kestra.plugin.jdbc.snowflake.Query
          url: "{{ secret('SNOWFLAKE_URL') }}"
          username: "{{ secret('SNOWFLAKE_USER') }}"
          password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
          warehouse: TRANSFORM_WH
          sql: CALL analytics.build_daily_orders()

      afterExecution:
        - id: notify_team
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          messageText: "orders_daily finished: {{ execution.state }}"

      triggers:
        - id: daily
          type: io.kestra.plugin.core.trigger.Schedule
          cron: "0 6 * * *"

pairs:
  - title: "How hard is it to move from Snowflake Tasks to Kestra?"
    columns:
      - label: "Leaving Snowflake Tasks"
        brand: competitor
        text: "A task graph is a set of CREATE TASK statements tied together with AFTER, FINALIZE and WHEN clauses. The SQL, stored procedures and dbt projects they call stay in Snowflake, so only the scheduling and the dependencies move."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Each task's statement runs unchanged in a Snowflake Query task. The root schedule becomes a Schedule trigger, AFTER becomes task order, a finalizer becomes a finally or afterExecution block, and a stream condition becomes a Snowflake trigger that polls a query. Suspend each root task once its flow is live."
  - title: "What do licensing, pricing and self-hosting look like?"
    columns:
      - label: "Snowflake Tasks"
        brand: competitor
        text: "Part of the Snowflake service, with no separate license. Serverless tasks are billed in credits for the compute they use. Tasks on a user-managed warehouse are billed for warehouse time, with a 60-second minimum each time the warehouse resumes."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>. Queries a flow sends to Snowflake still run on your Snowflake warehouse."

faqTitle: "Questions from Snowflake Tasks teams"

commonQuestions:
  - question: "Can Kestra run Snowflake queries and stored procedures?"
    answer: "Yes. The Query and Queries tasks run any SQL statement, including COPY INTO, CALL and EXECUTE DBT PROJECT. Upload and Download tasks move files between Kestra and Snowflake stages, the SnowflakeCLI task runs snow commands, and a Snowflake trigger starts a flow when a polled query returns results."
  - question: "Can Kestra and Snowflake Tasks run side by side?"
    answer: "Yes. A Kestra flow can start an existing task graph with EXECUTE TASK in a Query task, so you can put a schedule, an upstream API call or a downstream alert around a graph before you move it. Move one graph at a time, then suspend its root task once the flow is live."
  - question: "Can Kestra run dbt against Snowflake?"
    answer: "Yes, in three ways. The dbt CLI task runs dbt Core with the Snowflake adapter in a container, the dbt Cloud tasks trigger dbt Cloud jobs, and a Query task can run EXECUTE DBT PROJECT for projects deployed to Snowflake. Riverside runs dbt Cloud jobs, Snowflake loads and Hightouch syncs in one Kestra pipeline."
  - question: "How does Kestra connect to Snowflake?"
    answer: "Snowflake tasks take a JDBC URL with a user and either a password or a private key for key-pair authentication, read from Kestra secrets. Kestra Enterprise can also read secrets from AWS Secrets Manager, Azure Key Vault, Google Secret Manager or HashiCorp Vault."
  - question: "Do the warehouse costs change when Kestra schedules the queries?"
    answer: "The queries still run on the Snowflake warehouse named in each task and are billed by Snowflake as usual. Serverless task compute is no longer used, because Kestra workers handle the scheduling, retries and alerts. Kestra Open Source is free to self-host, and Kestra Cloud is billed on usage."
  - question: "How are flows versioned and deployed?"
    answer: "Each save creates a revision you can diff or roll back. Flows sync with Git, and the Terraform provider or a CI/CD pipeline such as GitHub Actions deploys them from a repository."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute and Kestra Enterprise reaches 7,000, with workers that scale horizontally. Leroy Merlin runs more than 5,000 flows on Kestra."

