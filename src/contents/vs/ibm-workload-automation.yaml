architecture:
  title: "How are IBM Workload Automation and Kestra built?"
  lead: "IBM Workload Automation keeps definitions on a central master and runs jobs through agents on each host. Kestra stores each workflow as a YAML file and hands its tasks to workers."
  competitor:
    title: "IBM Workload Automation: master and agents"
    text: "Jobs and job streams are stored in the master domain manager's database. Run cycles decide the dates a job stream runs, follows dependencies set the order, and agents on each host run the jobs and report their status."
    list:
      - "A backup master domain manager provides high availability"
      - "Fault-tolerant and dynamic agents run jobs on their hosts"
      - "The composer CLI adds definitions from text files to the database"
      - "The Dynamic Workload Console models and monitors the workload"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file of tasks, triggers and error handlers. The executor tracks state in Kestra's database and hands each task to a worker, which calls an API or runs a script."
    list:
      - "Plugin tasks call databases, file servers, clouds and SaaS APIs"
      - "Script tasks install their dependencies per task"
      - "Worker groups run tasks inside a given network (Kestra Enterprise)"
      - "Every save creates a revision you can diff and roll back"

pairs:
  - title: "How hard is it to move from IBM Workload Automation to Kestra?"
    columns:
      - label: "Leaving IBM Workload Automation"
        brand: competitor
        text: "A job definition holds the script, the logon user and the recovery option. The job stream around it holds run cycles, follows dependencies, prompts and resources. Each of these has to be mapped before a job stream moves, and plug-in jobs need a matching Kestra plugin or API call."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Scripts run unchanged in shell, Python or PowerShell tasks. Each job stream becomes a flow, each job a task, each run cycle a Schedule trigger, each follows dependency a task order or flow trigger, and each recovery option a retry policy or errors block. IBM Workload Automation keeps running until the last job stream moves."
  - title: "How do IBM Workload Automation and Kestra compare on licensing, pricing and self-hosting?"
    columns:
      - label: "IBM Workload Automation"
        brand: competitor
        text: "Proprietary and priced on request. IBM offers a 30-day free trial, and the 160+ plug-ins on the Automation Hub come at no additional cost. You run the master domain manager, the console and the agents on your own servers or on OpenShift."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from IBM Workload Automation teams"

commonQuestions:
  - question: "Can we move job streams in waves?"
    answer: "Yes. Start with new workflows and low-risk job streams, and keep the rest on IBM Workload Automation until their replacement flows are live. A job in IBM Workload Automation can start a Kestra flow by calling its Webhook trigger, so work can pass from one scheduler to the other while both run."
  - question: "Can Kestra convert composer definitions to YAML?"
    answer: "Partly. Paste a job stream and its job definitions into the AI Copilot, or hand them to your own coding assistant through the Kestra MCP server, and it drafts a flow for an engineer to review. Prompts, resources and free-day calendars need a decision during that review."
  - question: "Do we still need agents on every host?"
    answer: "Usually not. Most tasks reach a database, file server or API over the network from a Kestra worker. Commands that must run on a given machine can go over SSH with the SSH Command task, and worker groups (Kestra Enterprise) place workers inside the networks that need them."
  - question: "How do run cycles and calendars translate?"
    answer: "Each run cycle becomes a Schedule trigger with a cron expression and an optional when expression. Helper functions cover weekends, public holidays by country and the last working day of the month, and the ScheduleOnDates trigger runs a flow on a fixed list of dates."
  - question: "What about our z/OS workload?"
    answer: "Kestra has no z/OS job type. Mainframe batch can stay on IBM Z Workload Scheduler while distributed job streams move, and the last mainframe-side job can call a Kestra webhook to start what follows."
  - question: "How does Kestra handle access control and audit?"
    answer: "Namespaces separate each team's flows, files and secrets. Kestra Enterprise adds RBAC, SSO through OIDC or LDAP, SCIM provisioning and audit logs, and reads secrets from HashiCorp Vault, AWS Secrets Manager, Azure Key Vault or Google Secret Manager."
  - question: "How are flows versioned and deployed?"
    answer: "Each save creates a revision you can diff or roll back. Flows sync with Git, and the Terraform provider or a CI/CD pipeline such as GitHub Actions deploys them from a repository."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres runs 4,000 executions a minute and Kestra Enterprise reaches 7,000, with workers that scale horizontally. Leroy Merlin France runs more than 5,000 flows on Kestra."

