architecture:
  title: "How are HPE Morpheus and Kestra built?"
  lead: "HPE Morpheus manages infrastructure and attaches automation to it. Kestra runs workflows and calls the infrastructure tools you already have."
  competitor:
    title: "HPE Morpheus: a cloud management appliance"
    text: "Morpheus runs as an appliance with application, MySQL, Elasticsearch and RabbitMQ tiers, on one host or in a cluster. Tasks are grouped into workflows. Provisioning workflows run at phases of an instance's lifecycle, and operational workflows run on existing instances."
    list:
      - "Clouds, hypervisors and tools connect as integrations"
      - "Users provision from a central catalog"
      - "Task results pass to later tasks in the same phase"
      - "Jobs run operational workflows on a schedule"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file of tasks, triggers and error handlers. The executor tracks state in Kestra's database and hands each task to a worker, which runs a Terraform plan, a playbook, a script or an API call."
    list:
      - "Plugin tasks call clouds, vSphere, ServiceNow and other APIs"
      - "Each plugin task is checked against its schema on save"
      - "Worker groups run tasks inside a given network (Kestra Enterprise)"
      - "Every save creates a revision you can diff and roll back"

compare:
  title: "What does the same patch job look like in each?"
  lead: "The same job in both: run a patching playbook from Git, then a health check, each retried once after 10 seconds."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Morpheus Terraform provider"
    file: "patch.tf"
    lang: hcl
    code: |
      resource "morpheus_ansible_playbook_task" "patch" {
        name                = "patch-linux"
        code                = "patch-linux"
        ansible_repo_id     = "5"
        git_ref             = "main"
        playbook            = "patch"
        execute_target      = "local"
        retryable           = true
        retry_count         = 1
        retry_delay_seconds = 10
      }

      resource "morpheus_shell_script_task" "health_check" {
        name                = "health-check"
        code                = "health-check"
        source_type         = "local"
        script_content      = <<EOF
        curl -sf http://localhost/health
      EOF
        execute_target      = "resource"
        retryable           = true
        retry_count         = 1
        retry_delay_seconds = 10
      }

      resource "morpheus_operational_workflow" "patch_and_check" {
        name       = "patch-and-check"
        platform   = "all"
        visibility = "private"
        task_ids = [
          morpheus_ansible_playbook_task.patch.id,
          morpheus_shell_script_task.health_check.id,
        ]
      }
  kestra:
    code: |
      id: patch_and_check
      namespace: infra.ops

      inputs:
        - id: host
          type: STRING

      tasks:
        - id: patch
          type: io.kestra.plugin.core.flow.WorkingDirectory
          tasks:
            - id: clone
              type: io.kestra.plugin.git.Clone
              url: https://git.example.com/infra/ansible.git
              branch: main

            - id: playbook
              type: io.kestra.plugin.ansible.cli.AnsibleCLI
              containerImage: cytopia/ansible:latest-tools
              retry:
                type: constant
                interval: PT10S
                maxAttempts: 2
              commands:
                - ansible-playbook -i "{{ inputs.host }}," patch.yml

        - id: health_check
          type: io.kestra.plugin.core.http.Request
          uri: "http://{{ inputs.host }}/health"
          retry:
            type: constant
            interval: PT10S
            maxAttempts: 2

setup:
  title: "What does it take to get running?"
  lead: "Both run on your own servers. Morpheus installs as an appliance package, and Kestra starts from one Compose file."
  competitor:
    title: "HPE Morpheus"
    tag: "Licensed package"
    text: "HPE's <a href='https://docs.morpheusdata.com/en/latest/getting_started/installation/singleNode/debian.html'>single-node guide</a> installs the appliance package on Ubuntu or Debian, and morpheus-ctl reconfigure sets up every service on that host. The package comes from HPE My Software Center, and the first-time setup wizard asks for a license."
    code: |
      sudo apt-get update
      sudo dpkg -i morpheus-appliance_x.x.x-1_amd64.deb
      sudo morpheus-ctl reconfigure
  kestra:
    title: "Kestra"
    tag: "Database included"
    text: "One Compose file starts Kestra and its Postgres database. Open localhost:8080, pick a blueprint and run it. Production runs the same image on Kubernetes with the <a href='/docs/installation/kubernetes'>Kestra Helm chart</a>."
    code: |
      curl -o docker-compose.yml https://raw.githubusercontent.com/kestra-io/kestra/develop/docker-compose.yml
      docker compose up

pairs:
  - title: "How hard is it to move from HPE Morpheus to Kestra?"
    columns:
      - label: "Leaving HPE Morpheus"
        brand: competitor
        text: "Tasks hold scripts, playbook references and HTTP calls that move with little change. The provisioning catalog, lifecycle phases, cost views and hypervisor management are platform features with no Kestra equivalent, so decide first whether Morpheus keeps them."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Each operational workflow becomes a flow, each task becomes a script, Ansible or HTTP task, and task results become outputs. Scheduled jobs become Schedule triggers. Morpheus can keep provisioning while Kestra runs the steps around it, with an HTTP task calling the Morpheus API."
  - title: "What do licensing, pricing and self-hosting look like?"
    columns:
      - label: "HPE Morpheus"
        brand: competitor
        text: "Proprietary, sold in three editions, VM Essentials, Advanced and Enterprise. HPE describes its pricing as per socket, publishes no list price on the product page, and offers a free trial. Workflows and Ansible, Chef and Puppet tasks need the Advanced or Enterprise tier."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from HPE Morpheus teams"

commonQuestions:
  - question: "Can Kestra replace HPE Morpheus?"
    answer: "For the workflow layer, yes. For the platform around it, no. Kestra has no VM inventory, hypervisor management or cost views, so teams that need those keep Morpheus or another cloud management platform and run their multi-step automation in Kestra."
  - question: "Can Kestra and Morpheus run side by side?"
    answer: "Yes. A Kestra flow can call the Morpheus API with an HTTP task to provision an instance, then configure, test and register it. In the other direction, a Morpheus HTTP task can call a Kestra Webhook trigger to start a flow when an instance is provisioned."
  - question: "Can Kestra provision VMs?"
    answer: "Yes, through the tools that already do it. Terraform and OpenTofu tasks apply your modules, cloud plugins call AWS, Azure and Google Cloud, and the vSphere plugin (Kestra Enterprise) manages VMware VMs. The record of what was provisioned stays in your CMDB or ITSM."
  - question: "Does Kestra have a self-service catalog?"
    answer: "Each flow's inputs become a form in the Kestra UI, with select, multi-select and other input types, and a Pause task waits for approval before the next step. Kestra Enterprise adds Apps, which turn a flow into a self-service page for people who don't use the Kestra UI."
  - question: "Does Kestra track cloud costs?"
    answer: "No. Kestra has no cost reporting or budgets. It can run the actions a cost review leads to, such as stopping idle instances on a schedule, and pass the results to a FinOps tool or a ticket."
  - question: "How are cloud credentials stored?"
    answer: "Tasks read credentials with the secret() function. The open-source edition reads secrets from environment variables, and Kestra Enterprise adds namespace-level secrets and external managers such as HashiCorp Vault, AWS Secrets Manager, Azure Key Vault and Google Secret Manager."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute, and Kestra Enterprise reaches 7,000 a minute. Workers scale horizontally, and Leroy Merlin France runs more than 5,000 flows on Kestra."

