architecture:
  title: "How are AWS Step Functions and Kestra built?"
  lead: "Step Functions runs state machines inside one AWS account and region. Kestra runs flows on infrastructure you choose, or on Kestra Cloud."
  competitor:
    title: "Step Functions: JSON state machines"
    text: "A state machine is a set of named states, each pointing to the next. Task states call AWS services, Lambda functions or HTTPS APIs, and Step Functions records each transition as the execution moves."
    list:
      - "Standard workflows run exactly once, for up to one year"
      - "Express workflows run at least once, for up to five minutes"
      - "An IAM role on the state machine grants each service call"
      - "Distributed Map fans out to 10,000 parallel child executions"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file of tasks that run in sequence, in parallel or in loops. The executor tracks state in Kestra's database and hands each task to a worker, which calls an API or runs a script."
    list:
      - "Plugin tasks call AWS, Azure, GCP and SaaS APIs"
      - "Script tasks install their dependencies per task"
      - "Task runners send heavy jobs to AWS Batch or Kubernetes"
      - "Every save creates a revision you can diff and roll back"

compare:
  title: "What does the same data pipeline look like in each?"
  lead: "The same pipeline in both: a Glue job with retries, an Athena query that refreshes a report table, and an SNS alert if either step fails."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Step Functions state machine"
    file: "orders_daily.asl.json"
    lang: json
    code: |
      {
        "QueryLanguage": "JSONata",
        "StartAt": "TransformOrders",
        "States": {
          "TransformOrders": {
            "Type": "Task",
            "Resource": "arn:aws:states:::glue:startJobRun.sync",
            "Arguments": { "JobName": "orders-transform" },
            "Retry": [{ "ErrorEquals": ["States.TaskFailed"], "IntervalSeconds": 60, "MaxAttempts": 2, "BackoffRate": 2 }],
            "Catch": [{ "ErrorEquals": ["States.ALL"], "Next": "AlertOnFailure" }],
            "Next": "RefreshReport"
          },
          "RefreshReport": {
            "Type": "Task",
            "Resource": "arn:aws:states:::athena:startQueryExecution.sync",
            "Arguments": {
              "QueryString": "INSERT INTO daily_orders SELECT * FROM orders_clean",
              "QueryExecutionContext": { "Database": "analytics" },
              "ResultConfiguration": { "OutputLocation": "s3://amzn-s3-demo-bucket/athena/" }
            },
            "Catch": [{ "ErrorEquals": ["States.ALL"], "Next": "AlertOnFailure" }],
            "End": true
          },
          "AlertOnFailure": {
            "Type": "Task",
            "Resource": "arn:aws:states:::sns:publish",
            "Arguments": {
              "TopicArn": "arn:aws:sns:us-east-1:123456789012:data-alerts",
              "Message": "orders_daily failed"
            },
            "Next": "Failed"
          },
          "Failed": { "Type": "Fail", "Error": "OrdersDailyFailed" }
        }
      }
  kestra:
    code: |
      id: orders_daily
      namespace: company.analytics

      tasks:
        - id: transform_orders
          type: io.kestra.plugin.aws.glue.StartJobRun
          region: us-east-1
          jobName: orders-transform
          retry:
            type: exponential
            interval: PT1M
            maxInterval: PT10M
            maxAttempts: 3

        - id: refresh_report
          type: io.kestra.plugin.aws.athena.Query
          region: us-east-1
          database: analytics
          outputLocation: s3://amzn-s3-demo-bucket/athena/
          query: INSERT INTO daily_orders SELECT * FROM orders_clean

      errors:
        - id: alert_on_failure
          type: io.kestra.plugin.aws.sns.Publish
          region: us-east-1
          topicArn: arn:aws:sns:us-east-1:123456789012:data-alerts
          from:
            data: "orders_daily failed: {{ execution.id }}"

pairs:
  - title: "How hard is it to move from AWS Step Functions to Kestra?"
    columns:
      - label: "Leaving AWS Step Functions"
        brand: competitor
        text: "The logic of a state machine is split between the ASL definition and the Lambda functions or services it calls. JSONata or JSONPath expressions shape the data between states, and IAM roles grant each call, so each piece has to be mapped before it moves."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Each Task state becomes a plugin task or a script task, Choice becomes If or Switch, Map becomes Loop, and Retry and Catch become a retry policy and an errors block. Lambda code can move into script tasks, or stay in Lambda and be called with the Lambda Invoke task. State machines keep running until their replacement flows are live."
  - title: "How do AWS Step Functions and Kestra compare on licensing, pricing and self-hosting?"
    columns:
      - label: "AWS Step Functions"
        brand: competitor
        text: "A proprietary AWS service with no self-hosted version. Standard workflows are billed per state transition after a monthly free tier, and each retry counts as a transition. Express workflows are billed per request, duration and memory. The Lambda functions, Glue jobs and other services a workflow calls are billed on their own pricing."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from AWS Step Functions teams"

commonQuestions:
  - question: "Can Kestra and Step Functions run side by side during a migration?"
    answer: "Yes. Move one state machine at a time. A Kestra flow can start an existing state machine with the AWS CLI task, and a state machine can call a Kestra Webhook trigger through an HTTP Task, so work can pass between the two until the last state machine is retired."
  - question: "Can Kestra convert ASL definitions to YAML?"
    answer: "Partly. Paste a state machine definition into the AI Copilot, or hand it to your own coding assistant through the Kestra MCP server, and it drafts a flow for an engineer to review. JSONata and JSONPath expressions are rewritten as Kestra expressions during that review."
  - question: "Does Kestra work with AWS services?"
    answer: "Yes. Plugins cover S3, SQS, SNS, Lambda, Glue, Athena, EMR, DynamoDB and Redshift, among others. S3 and SQS triggers start a flow when a file lands or a message arrives. Kestra itself runs on EKS or EC2, with RDS for PostgreSQL as its database and S3 as internal storage."
  - question: "Do we still need Lambda functions?"
    answer: "Not for orchestration. Code that ran in a function can run as a Python, Node.js or shell script task with its own dependencies, and long jobs can go to AWS Batch through a task runner. Functions that serve other callers can stay in Lambda, and a flow invokes them like any other AWS API."
  - question: "How does Kestra handle AWS credentials?"
    answer: "AWS tasks take static keys from Kestra secrets, assume a role through STS, or fall back to the AWS default credentials provider chain, so a worker on EKS or EC2 can use the role it already has. Kestra Enterprise can also read secrets from AWS Secrets Manager."
  - question: "How are flows versioned and deployed?"
    answer: "Each save creates a revision you can diff or roll back. Flows sync with Git, and the Terraform provider or a CI/CD pipeline such as GitHub Actions deploys them from a repository, much as CloudFormation, SAM or CDK deploy state machines."
  - question: "Is Kestra fast enough for event-driven workloads?"
    answer: "Realtime triggers on SQS, Kafka and other queues start a flow for each message. In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres runs 4,000 executions a minute and Kestra Enterprise reaches 7,000, with workers that scale horizontally."

