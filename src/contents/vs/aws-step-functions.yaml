title: "Kestra vs AWS Step Functions: Open Source Option"
description: "Kestra vs AWS Step Functions: Amazon States Language vs open-source YAML flows that run on any cloud. The same Glue and Athena pipeline in both, plus pricing."
competitorName: AWS Step Functions
category: Data Orchestration
shortDescription: "AWS state machines written in Amazon States Language vs. YAML flows that run on any cloud or on-premises."

brandColor:
  color: "#FF4F8B"
  gradient: "linear-gradient(90deg, #FF4F8B, #B0084D)"

intro:
  title: "Kestra vs. AWS Step Functions"
  description: "AWS Step Functions is a managed AWS service that runs state machines written in Amazon States Language, a JSON format. Kestra is an open-source orchestration platform that runs YAML flows on AWS, on another cloud or on your own servers."

choose:
  title: "AWS Step Functions or Kestra?"
  competitor:
    title: "AWS Step Functions is the better fit if"
    list:
      - "Your workflows coordinate AWS services such as Lambda, Glue, ECS and DynamoDB, and nothing outside AWS."
      - "You want a fully managed service with no servers, database or upgrades to look after."
      - "You process short, high-volume events that fit Express workflows, which AWS bills per request and duration."
  kestra:
    title: "Choose Kestra if"
    list:
      - "Your workflows reach systems outside AWS, such as other clouds, on-premises databases or SaaS APIs."
      - "You want to run Python, SQL or shell scripts as steps without packaging each one as a Lambda function."
      - "You want the triggers, retries and failure handling of a workflow in one file that you review in Git."

table:
  title: "How do AWS Step Functions and Kestra compare, feature by feature?"
  rows:
    - label: "Workflow definition"
      competitor: "Amazon States Language (JSON), up to 1 MB per state machine"
      kestra: "YAML flows, validated against each plugin's schema on save"
    - label: "Where it runs"
      competitor: "AWS only"
      kestra: "Any cloud, on-premises, air-gapped (Kestra Enterprise), or Kestra Cloud"
    - label: "Operations"
      competitor: "Fully managed by AWS"
      kestra: "You run it on Docker or Kubernetes, or use Kestra Cloud"
    - label: "Running code"
      competitor: "Code runs in Lambda, ECS, Batch or another service a Task state calls"
      kestra: "Python, SQL, shell, Node.js and more run as script tasks"
    - label: "Scheduling"
      competitor: "EventBridge Scheduler starts executions from outside the definition"
      kestra: "Schedule trigger inside the flow, with backfills"
    - label: "Event triggers"
      competitor: "EventBridge event sources, API Gateway and direct API calls"
      kestra: "Webhooks, flow triggers, S3 and SQS triggers, and realtime triggers"
    - label: "Data between steps"
      competitor: "256 KiB per state input or output"
      kestra: "Outputs, plus files in internal storage passed by URI"
    - label: "Execution history"
      competitor: "Standard workflows keep up to 25,000 events per execution for 90 days"
      kestra: "Logs and outputs stay in your database until a purge task removes them"
    - label: "Pricing"
      competitor: "Standard workflows bill per state transition, retries included; Express bills per request and duration"
      kestra: "Free open source; Kestra Cloud billed on usage"
    - label: "License"
      competitor: "Proprietary AWS service"
      kestra: "Apache 2.0"

