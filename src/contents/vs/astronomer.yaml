architecture:
  title: "How are Astronomer and Kestra built?"
  lead: "Astro gives each Airflow environment its own Deployment on a cluster that Astronomer runs. Kestra puts every team's flows in namespaces on one instance."
  competitor:
    title: "Astronomer: Airflow Deployments on Astro"
    text: "An Astro Deployment is one Airflow environment in its own namespace on an Astro cluster, either standard and multi-tenant or dedicated. You push code to each Deployment with the Astro CLI, by hand or from CI/CD."
    list:
      - "Each Deployment runs one version of Astro Runtime, Astronomer's Airflow distribution"
      - "Workspaces group Deployments and set who can reach them"
      - "Workers scale to zero when idle and are metered while tasks run"
      - "Remote Execution keeps task code, data and secrets in your network"
  kestra:
    title: "Kestra: namespaces on one instance"
    text: "Flows are YAML documents grouped in namespaces, on an instance you host or on Kestra Cloud. Adding a flow adds no DAG parsing, because Kestra reads the YAML and runs no user code to load it."
    list:
      - "Namespaces hold their own files, KV pairs and secrets"
      - "Executors and workers scale out as separate services"
      - "Worker groups route tasks to specific machines"
      - "Every change to a flow is kept as a revision"

compare:
  title: "What does the same API load look like in each?"
  lead: "The same pipeline in both: pull exchange rates from an API in Python, load them into Postgres, retry each task twice, and run once a day."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Astro project DAG"
    file: "dags/exchange_rates.py"
    lang: python
    code: |
      import requests
      from pendulum import datetime

      from airflow.providers.postgres.hooks.postgres import PostgresHook
      from airflow.sdk import dag, task


      @dag(
          start_date=datetime(2026, 1, 1),
          schedule="@daily",
          catchup=False,
          default_args={"retries": 2},
      )
      def exchange_rates():
          @task
          def extract():
              response = requests.get("https://api.example.com/rates", timeout=30)
              response.raise_for_status()
              return response.json()["rates"]

          @task
          def load(rates: dict):
              hook = PostgresHook(postgres_conn_id="warehouse")
              hook.insert_rows(
                  table="raw.exchange_rates",
                  rows=list(rates.items()),
                  target_fields=["currency", "rate"],
              )

          load(extract())


      exchange_rates()
  kestra:
    code: |
      id: exchange_rates
      namespace: company.finance

      retry:
        type: constant
        interval: PT5M
        maxAttempts: 3

      tasks:
        - id: extract
          type: io.kestra.plugin.scripts.python.Script
          dependencies:
            - requests
          outputFiles:
            - rates.csv
          script: |
            import csv
            import requests

            response = requests.get("https://api.example.com/rates", timeout=30)
            response.raise_for_status()
            with open("rates.csv", "w", newline="") as f:
                csv.writer(f).writerows(response.json()["rates"].items())

        - id: load
          type: io.kestra.plugin.jdbc.postgresql.CopyIn
          url: "{{ secret('POSTGRES_JDBC_URL') }}"
          username: "{{ secret('POSTGRES_USER') }}"
          password: "{{ secret('POSTGRES_PASSWORD') }}"
          from: "{{ outputs.extract.outputFiles['rates.csv'] }}"
          table: raw.exchange_rates
          format: CSV

      triggers:
        - id: daily
          type: io.kestra.plugin.core.trigger.Schedule
          cron: "@daily"

setup:
  title: "What does it take to get Astronomer and Kestra running?"
  lead: "Both start on a laptop with containers."
  competitor:
    title: "Astronomer"
    tag: "Local Airflow"
    text: "The <a href='https://www.astronomer.io/docs/astro/cli/get-started-cli'>Astro CLI quickstart</a> starts four containers for development: Postgres, the scheduler, the webserver and the triggerer. Production runs on Astro or on Astro Private Cloud."
    code: |
      brew install astro
      astro dev init --from-template learning-airflow
      astro dev start
  kestra:
    title: "Kestra"
    tag: "Database included"
    text: "One Compose file starts Kestra and its Postgres database. Open localhost:8080, pick a blueprint and run it. Production runs the same image on Kubernetes with the <a href='/docs/installation/kubernetes'>Kestra Helm chart</a>."
    code: |
      curl -o docker-compose.yml https://raw.githubusercontent.com/kestra-io/kestra/develop/docker-compose.yml
      docker compose up

pairs:
  - title: "How hard is it to move from Astronomer to Kestra?"
    columns:
      - label: "Leaving Astronomer"
        brand: competitor
        text: "An Astro project is standard Airflow on Astro Runtime, so DAGs, operators and TaskFlow functions are as tied to Airflow as they are anywhere else. Astro-specific pieces to replace include Deployment environment variables, connections, CI/CD jobs that call astro deploy, and dbt projects rendered by Cosmos."
      - label: "Moving to Kestra"
        brand: kestra
        text: "TaskFlow function bodies run in Python script tasks with their own dependencies, and values passed through XCom become task outputs. While DAGs move in waves, a Kestra flow can start the ones still on Astro through the Airflow REST API with a Deployment API token. The <a href='/resources/migration/airflow'>Airflow migration guide</a> covers the mapping and the cutover."
  - title: "How do Astronomer and Kestra compare on licensing, pricing and self-hosting?"
    lead: "Astro is a commercial service on top of open-source Airflow. Kestra's core is open source, with paid Cloud and Enterprise editions."
    columns:
      - label: "Astronomer"
        brand: competitor
        text: "Astro is sold directly and through the AWS, Azure, Google Cloud and Snowflake marketplaces. Deployments are billed while they run and workers while tasks run. Pricing is quoted on request, including Astro Private Cloud, the self-hosted edition."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Astronomer teams"

commonQuestions:
  - question: "Can Kestra run alongside Astro during a migration?"
    answer: "Yes. The Kestra Airflow plugin's TriggerDagRun task starts a DAG on an Astro Deployment through the Airflow REST API, using an API token in the request headers, and can wait for the run to finish. New workflows go to Kestra first, and existing DAGs follow in batches."
  - question: "Is there a managed Kestra, like Astro is for Airflow?"
    answer: "Yes. Kestra Cloud runs Kestra for you and is billed on usage. Teams that need to keep everything in their own environment run the open-source edition or Kestra Enterprise on Kubernetes, VMs or air-gapped servers."
  - question: "Can tasks run in our own network, as with Astro Remote Execution?"
    answer: "Yes. Kestra workers connect to the worker controller over gRPC, so they can run in a separate network or cloud account as long as they can reach it. In Kestra Enterprise, worker groups route specific tasks or triggers to those workers."
  - question: "We use Cosmos for dbt. How does dbt run in Kestra?"
    answer: "The dbt plugin runs dbt commands such as dbt build in a container, with the project read from namespace files or cloned from Git, and a dbt Cloud task triggers jobs in dbt Cloud. A dbt run is one task in the flow, so the project's model graph stays in dbt."
  - question: "How do teams share one Kestra instance?"
    answer: "On Astro, separation usually means one Deployment per team or environment, each billed and upgraded on its own. In Kestra, teams share an instance and own their namespaces, with RBAC, secrets and variables scoped to each one. Kestra Enterprise adds SSO, audit logs and tenants for stronger separation."
  - question: "Does Kestra have an AI assistant?"
    answer: "Yes. The AI Copilot writes and edits flows in the editor, and the Kestra MCP server lets your own coding assistant draft flows, for example from an existing DAG file. An engineer reviews the result before it runs."
  - question: "How far does Kestra scale?"
    answer: "In the <a href='/docs/performance/benchmark'>Kestra benchmark</a>, the open-source edition on Postgres handles 4,000 executions a minute and Kestra Enterprise handles 7,000. Apple's ML team runs ETL for 200 engineers on Kestra."

