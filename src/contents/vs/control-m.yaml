architecture:
  title: "How are Control-M and Kestra built?"
  lead: "Control-M schedules jobs from a central server and runs them through agents on your hosts. Kestra stores each workflow as a YAML file and hands its tasks to workers."
  competitor:
    title: "Control-M: server and agents"
    text: "Jobs are grouped in folders with scheduling criteria, dependencies and post-processing actions. The Control-M/Server orders them on the days their criteria match and sends each job to a Control-M/Agent, which runs it and reports its status back."
    list:
      - "Control-M/Enterprise Manager gives one console over several servers"
      - "Plug-ins on the agent reach applications through connection profiles"
      - "Flow objects chain jobs, and each job waits for its predecessor to end OK"
      - "In SaaS, BMC hosts the server and you install the agents and plug-ins"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file of tasks, triggers and error handlers. The executor tracks state in Kestra's database and hands each task to a worker, which calls an API or runs a script."
    list:
      - "Plugin tasks call databases, file servers, clouds and SaaS APIs"
      - "Script tasks install their dependencies per task"
      - "Worker groups run tasks inside a given network (Kestra Enterprise)"
      - "Every save creates a revision you can diff and roll back"

compare:
  title: "What does the same job flow look like in each?"
  lead: "The same job flow in both: an SFTP download, a load into Postgres, and an email if either step fails."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Control-M Jobs-as-Code"
    file: "OrdersDaily.json"
    lang: json
    code: |
      {
        "Defaults": {
          "Job": {
            "Host": "agent-01",
            "MailOnFailure": {
              "Type": "If",
              "CompletionStatus": "NOTOK",
              "MailTeam": {
                "Type": "Action:Mail",
                "To": "data-team@example.com",
                "Subject": "OrdersDaily failed",
                "Message": "%%JOBNAME failed"
              }
            }
          }
        },
        "OrdersDaily": {
          "Type": "Folder",
          "When": { "WeekDays": ["MON", "TUE", "WED", "THU", "FRI"], "FromTime": "0600" },
          "GetOrders": {
            "Type": "Job:FileTransfer",
            "ConnectionProfileSrc": "SFTP-CP",
            "ConnectionProfileDest": "LOCAL-CP",
            "FileTransfers": [
              { "Src": "/outbound/orders.csv", "Dest": "/data/orders.csv", "TransferOption": "SrcToDest" }
            ]
          },
          "LoadOrders": {
            "Type": "Job:Database:SQLScript",
            "SQLScript": "/opt/sql/load_orders.sql",
            "ConnectionProfile": "DB-CP"
          },
          "Flow": { "Type": "Flow", "Sequence": ["GetOrders", "LoadOrders"] }
        }
      }
  kestra:
    code: |
      id: orders_daily
      namespace: company.finance

      tasks:
        - id: get_orders
          type: io.kestra.plugin.fs.sftp.Download
          host: sftp.example.com
          username: "{{ secret('SFTP_USER') }}"
          password: "{{ secret('SFTP_PASSWORD') }}"
          from: /outbound/orders.csv

        - id: load_orders
          type: io.kestra.plugin.jdbc.postgresql.CopyIn
          url: "{{ secret('DB_JDBC_URL') }}"
          username: "{{ secret('DB_USER') }}"
          password: "{{ secret('DB_PASSWORD') }}"
          from: "{{ outputs.get_orders.uri }}"
          table: orders_staging
          format: CSV
          header: true

      errors:
        - id: mail_team
          type: io.kestra.plugin.email.MailSend
          host: smtp.example.com
          port: 587
          username: "{{ secret('SMTP_USER') }}"
          password: "{{ secret('SMTP_PASSWORD') }}"
          from: kestra@example.com
          to: data-team@example.com
          subject: "orders_daily failed"
          htmlTextContent: "Execution {{ execution.id }} failed"

      triggers:
        - id: weekdays
          type: io.kestra.plugin.core.trigger.Schedule
          cron: "0 6 * * 1-5"

pairs:
  - title: "How hard is it to move from Control-M to Kestra?"
    columns:
      - label: "Leaving Control-M"
        brand: competitor
        text: "A Control-M job carries more than the command it runs: When criteria, calendars, RunAs users, connection profiles, If actions and resource locks. Each of these has to be listed and mapped before the job moves, and plug-in jobs need a matching Kestra plugin or API call."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Scripts and commands run unchanged in shell, Python or PowerShell tasks. Each folder becomes a flow, each Flow sequence a task order, each When rule a Schedule trigger and each If action an errors block or a task. Control-M keeps running until the last folder moves."
  - title: "What do licensing, pricing and self-hosting look like?"
    columns:
      - label: "Control-M"
        brand: competitor
        text: "Proprietary. SaaS, self-hosted and hybrid editions are priced by execution volume and environment, and quoted on request."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Control-M teams"

commonQuestions:
  - question: "Can Kestra and Control-M run side by side during a migration?"
    answer: "Yes. A Kestra flow can order and track Control-M jobs through the Automation API's REST endpoints with an HTTP task, and a Control-M command job can start a Kestra flow by calling its Webhook trigger. Teams move folders in waves while both schedulers run."
  - question: "Can Kestra convert Jobs-as-Code JSON to YAML?"
    answer: "Partly. Paste a Control-M folder definition into the AI Copilot, or hand it to your own coding assistant through the Kestra MCP server, and it drafts a flow for an engineer to review. Calendars, resource locks and plug-in jobs need a decision during that review."
  - question: "Does Kestra need an agent on every server?"
    answer: "No. Most tasks reach a database, file server or API over the network from a Kestra worker. Commands that must run on a given host can go over SSH with the SSH Command task, and worker groups (Kestra Enterprise) run tasks on workers installed inside a specific network."
  - question: "How do Control-M calendars translate to Kestra?"
    answer: "A Schedule trigger takes a cron expression and an optional when expression. Helper functions cover weekends, public holidays by country and the last working day of the month, and the ScheduleOnDates trigger runs a flow on a list of dates. Missed dates can be backfilled."
  - question: "What happens to our mainframe jobs?"
    answer: "Kestra has no z/OS job type, so mainframe batch can stay in Control-M while distributed jobs move. When a mainframe job ends, a successor job in Control-M can call a Kestra webhook to start the rest of the chain."
  - question: "How does Kestra handle access control and audit?"
    answer: "Namespaces separate each team's flows, files and secrets. Kestra Enterprise adds RBAC, SSO through OIDC or LDAP, SCIM provisioning and audit logs, and reads secrets from HashiCorp Vault, AWS Secrets Manager, Azure Key Vault or Google Secret Manager."
  - question: "How are flows versioned and promoted?"
    answer: "Each save creates a revision you can diff or roll back. Flows sync with Git, and the Terraform provider or a CI/CD pipeline such as GitHub Actions deploys them from a repository, much as the Control-M Automation API deploys Jobs-as-Code from a pipeline."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres runs 4,000 executions a minute and Kestra Enterprise reaches 7,000, with workers that scale horizontally. Leroy Merlin France runs more than 5,000 flows on Kestra."

