title: "Kestra vs Databricks Workflows (Lakeflow Jobs)"
description: "Kestra vs Databricks Workflows, now Lakeflow Jobs: run Databricks jobs alongside SaaS APIs, other warehouses and infra tasks. The same pipeline in both."
competitorName: Databricks Workflows
category: Data Orchestration
shortDescription: "Job orchestration inside the Databricks platform vs. YAML flows that run Databricks jobs alongside the rest of your stack."

brandColor:
  color: "#FF3621"

intro:
  title: "Kestra vs. Databricks Workflows"
  description: "Databricks Workflows, now called Lakeflow Jobs, orchestrates notebooks, SQL, pipelines and other tasks on Databricks compute. Kestra is an open-source orchestration platform that runs Databricks jobs as tasks in YAML flows, next to the systems that feed and consume them."

choose:
  title: "Databricks Workflows or Kestra?"
  competitor:
    title: "Databricks Workflows is the better fit if"
    list:
      - "Your pipelines live inside Databricks as notebooks, Lakeflow pipelines, SQL and dbt on Databricks compute."
      - "You want orchestration in the same workspace, with triggers on Unity Catalog table updates and file arrivals."
      - "You want serverless compute for jobs and no orchestrator of your own to run."
  kestra:
    title: "Choose Kestra if"
    list:
      - "Your pipelines reach outside Databricks, to SaaS APIs, other warehouses, infrastructure tasks or notifications."
      - "You run several Databricks workspaces, or Databricks next to Snowflake, BigQuery or on-premises databases, and want every run in one place."
      - "You want steps that need no Spark, such as API calls and file transfers, to run on your own workers."

table:
  title: "How do Databricks Workflows and Kestra compare, feature by feature?"
  rows:
    - label: "Workflow definition"
      competitor: "Jobs built in the UI, as YAML in Declarative Automation Bundles, or as JSON through the Jobs API"
      kestra: "YAML flows, validated against plugin schemas on save"
    - label: "Task types"
      competitor: "Notebook, Python script, wheel, JAR, SQL, dbt, pipeline, Spark Submit, Run Job, If/else, For each and more"
      kestra: "Python, SQL, dbt, shell and more, plus {totalPlugins}+ plugins, Databricks included"
    - label: "Compute"
      competitor: "Databricks serverless, jobs compute, all-purpose clusters or SQL warehouses"
      kestra: "Kestra workers and containers, or Kubernetes and cloud batch services through task runners"
    - label: "Triggers"
      competitor: "Scheduled, file arrival, table update, model update, job completion and continuous"
      kestra: "Schedules with backfills, webhooks, flow triggers, polling and realtime triggers"
    - label: "Recovery"
      competitor: "Repair runs re-run failed, canceled or skipped tasks and their dependents"
      kestra: "Restart re-runs failed tasks in the same execution; replay starts a new one from any task"
    - label: "Limits"
      competitor: "1,000 tasks per job, 2,000 concurrent task runs per workspace"
      kestra: "Workers scale horizontally as the load grows"
    - label: "Where it runs"
      competitor: "Inside a Databricks workspace on AWS, Azure or Google Cloud"
      kestra: "Self-hosted on any cloud or on-premises, or on Kestra Cloud"
    - label: "Pricing"
      competitor: "Compute that tasks use, measured in DBUs and billed per second"
      kestra: "Open source is free to run; Kestra Cloud bills on usage"
    - label: "License"
      competitor: "Proprietary, part of the Databricks platform"
      kestra: "Apache 2.0"

