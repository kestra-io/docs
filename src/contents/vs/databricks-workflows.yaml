architecture:
  title: "How are Databricks Workflows and Kestra built?"
  lead: "Lakeflow Jobs lives inside the Databricks workspace. Kestra sits outside any one platform and treats a Databricks job as one task among others."
  competitor:
    title: "Lakeflow Jobs: tasks on Databricks compute"
    text: "A job is a set of tasks with dependencies, stored in the workspace and defined in the UI, in bundle YAML or through the Jobs API. Each task runs on Databricks compute, and the job settings hold its triggers, retries and notifications."
    list:
      - "Serverless compute is the default for tasks that support it"
      - "If/else and For each tasks add branching and loops"
      - "Run Job tasks call other jobs"
      - "Email and system notifications fire when a run fails"
  kestra:
    title: "Kestra: one orchestrator across platforms"
    text: "A flow is a YAML file of tasks. Databricks tasks submit runs, create jobs and query SQL warehouses, while other tasks in the same flow call APIs, run scripts or move files."
    list:
      - "Credentials for each workspace live in namespace secrets"
      - "Outputs from one task feed the next, across platforms"
      - "Failures anywhere in the flow go to one errors block"
      - "Script tasks run in containers with per-task dependencies"

compare:
  title: "What does the same lakehouse pipeline look like in each?"
  lead: "The same pipeline in both: a notebook that ingests orders with retries, a SQL step that builds a daily table, a daily schedule and an alert when a task fails."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Lakeflow job in a bundle"
    file: "orders_daily.job.yml"
    lang: yaml
    code: |
      resources:
        jobs:
          orders_daily:
            name: orders_daily
            schedule:
              quartz_cron_expression: "0 0 6 * * ?"
              timezone_id: UTC
            webhook_notifications:
              on_failure:
                - id: 0481e838-0a59-4eff-9541-a4ca6f149574
            tasks:
              - task_key: ingest_orders
                notebook_task:
                  notebook_path: ./src/ingest_orders.ipynb
                max_retries: 2
                min_retry_interval_millis: 300000
              - task_key: build_daily_orders
                depends_on:
                  - task_key: ingest_orders
                sql_task:
                  file:
                    path: /Workspace/Shared/orders/daily_orders.sql
                    source: WORKSPACE
                  warehouse_id: 1a111111a1111aa1
  kestra:
    code: |
      id: orders_daily
      namespace: company.lakehouse

      tasks:
        - id: ingest_orders
          type: io.kestra.plugin.databricks.job.SubmitRun
          host: "{{ secret('DATABRICKS_HOST') }}"
          authentication:
            token: "{{ secret('DATABRICKS_TOKEN') }}"
          runTasks:
            - taskKey: ingest_orders
              existingClusterId: "{{ secret('DATABRICKS_CLUSTER_ID') }}"
              notebookTask:
                notebookPath: /Workspace/Shared/orders/ingest_orders
          retry:
            type: constant
            interval: PT5M
            maxAttempts: 3

        - id: build_daily_orders
          type: io.kestra.plugin.databricks.sql.Query
          host: "{{ secret('DATABRICKS_HOST') }}"
          httpPath: "{{ secret('DATABRICKS_SQL_HTTP_PATH') }}"
          accessToken: "{{ secret('DATABRICKS_TOKEN') }}"
          sql: "{{ read('sql/daily_orders.sql') }}"

      errors:
        - id: slack_alert
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          messageText: "orders_daily failed: {{ execution.id }}"

      triggers:
        - id: daily
          type: io.kestra.plugin.core.trigger.Schedule
          cron: "0 6 * * *"

pairs:
  - title: "How hard is it to move from Databricks Workflows to Kestra?"
    columns:
      - label: "Leaving Databricks Workflows"
        brand: competitor
        text: "Notebooks, SQL files and dbt projects stay in Databricks. What moves is the job definition around them, so dependencies, schedules, retries and notifications are rewritten, and job parameters and dynamic value references become Kestra inputs and expressions."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Each notebook or Python task becomes a Databricks SubmitRun task, SQL tasks become Databricks SQL queries, and a job you want to keep whole runs through a Run Job setting. Steps that need no Spark, such as API calls or file transfers, move to Kestra tasks on your own workers."
  - title: "How do Databricks Workflows and Kestra compare on licensing, pricing and self-hosting?"
    columns:
      - label: "Databricks Workflows"
        brand: competitor
        text: "Lakeflow Jobs is part of the proprietary Databricks platform and runs only in a Databricks workspace. Databricks bills per second for the compute your tasks use, measured in Databricks Units (DBUs), at rates that vary by compute type, plan and cloud."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Databricks Workflows teams"

commonQuestions:
  - question: "Does Kestra replace Databricks?"
    answer: "No. Databricks keeps running the Spark, SQL and notebook work. Kestra takes over the orchestration, and its Databricks plugin submits runs, creates jobs, manages clusters, runs SQL on a warehouse and manages Unity Catalog objects."
  - question: "Can Kestra react to changes in Databricks?"
    answer: "Yes. Kestra has triggers for new files in DBFS, changes to Unity Catalog tables and results from Lakebase queries, alongside schedules, webhooks and triggers on other systems such as S3, Kafka or Pub/Sub."
  - question: "We already keep jobs in Declarative Automation Bundles. What changes?"
    answer: "Bundles keep Databricks jobs as YAML in a repository. Kestra flows live in Git too and deploy through Git sync, the Terraform provider or CI/CD, and one repository can hold the flows that touch Databricks and every other system you orchestrate."
  - question: "Does every step need Databricks compute?"
    answer: "No. Tasks that call an API, move a file or run a short Python script run on Kestra workers or in containers. Only the steps that need Spark or a SQL warehouse go to Databricks."
  - question: "Can several teams and workspaces share one Kestra instance?"
    answer: "Yes. Namespaces separate teams, each with its own secrets, such as the token for its Databricks workspace. Kestra Enterprise adds RBAC, SSO and tenants for stricter isolation."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres handles 4,000 executions a minute and Kestra Enterprise 7,000. Add workers to scale out."

