title: "Kestra vs VMware Aria Automation (vRA and vRO)"
description: "Compare Kestra and VMware Aria Automation (vRA and vRO): how each is built, the same VM request in both, migration and licensing inside VMware Cloud Foundation."
competitorName: "VMware Aria Automation"
guideCta:
  eyebrow: "Migration guide"
  title: "Planning to replace vRA and vRO?"
  description: "The vRA to Kestra migration guide walks through the move in four stages, from assessing your estate to retiring vRA at renewal, with a payback calculator for your own numbers."
  cta:
    label: "Read the guide"
    href: "/resources/migration/vra"
category: Infrastructure Automation
shortDescription: "A vSphere catalog with vRO workflows inside VMware Cloud Foundation vs. open-source YAML flows that run on any infrastructure."

brandColor:
  color: "#87B74B"
  gradient: "linear-gradient(90deg, #87B74B, #F6C43F, #686465)"

intro:
  title: "Kestra vs. VMware Aria Automation"
  description: "VMware Aria Automation (formerly vRealize Automation), now VCF Automation inside VMware Cloud Foundation, publishes VM blueprints in a self-service provisioning catalog and runs vRO workflows around each deployment. Kestra is an open-source orchestration platform whose YAML flows call vSphere, Terraform, Ansible and ServiceNow as tasks."

choose:
  title: "VMware Aria Automation or Kestra?"
  competitor:
    title: "VMware Aria Automation is the better fit if"
    list:
      - "Your estate is vSphere, you renew VMware Cloud Foundation for the hypervisor anyway, and VCF Automation comes with it."
      - "Users order machines from the catalog, and its blueprints, cloud zones and day-2 actions already cover what they need."
      - "Your team maintains a large vRO library, and no renewal date is forcing a decision."
  kestra:
    title: "Choose Kestra if"
    list:
      - "Your automation has to keep working if workloads move from vSphere to Nutanix, Proxmox or a public cloud."
      - "Your workflows already call Terraform, Ansible, ServiceNow and Python, and you want them in one YAML flow reviewed in Git."
      - "Security rules require a separate control plane per network zone, or installs with no internet access."

table:
  title: "How do VMware Aria Automation and Kestra compare, feature by feature?"
  rows:
    - label: "Workflow definition"
      competitor: "YAML blueprints, plus vRO workflows drawn in a schema editor"
      kestra: "YAML flows, validated against each plugin's schema on save"
    - label: "Scripting"
      competitor: "JavaScript on the Rhino engine, plus Python, Node.js and PowerShell runtimes"
      kestra: "Python, Shell, PowerShell, Node.js, Go and more, each task with its own dependencies"
    - label: "vSphere placement"
      competitor: "Cloud zones, flavors and image mappings place each machine"
      kestra: "vSphere plugin for VMs, snapshots and templates (Kestra Enterprise), or Terraform"
    - label: "Self-service"
      competitor: "Catalog items with request forms, built from blueprints"
      kestra: "Flow inputs render as forms; Apps serve users outside the UI (Kestra Enterprise)"
    - label: "Triggers"
      competitor: "Catalog requests, event subscriptions, vRO schedules and policies"
      kestra: "Schedules, webhooks, flow triggers, polling and realtime triggers"
    - label: "Integrations"
      competitor: "vRO plug-ins, plus Ansible, Puppet and Git integrations"
      kestra: "{totalPlugins}+ plugins, including Terraform, Ansible and ServiceNow"
    - label: "Version control"
      competitor: "Blueprints and action scripts sync with Git; vRO keeps a version history per object"
      kestra: "Every save is a revision; flows sync with Git and deploy with the Terraform provider"
    - label: "Failure recovery"
      competitor: "vRO checkpoints every workflow step in its database"
      kestra: "Retries per task, an errors block, and replay from any task"
    - label: "Where it runs"
      competitor: "Inside a VMware Cloud Foundation fleet, managed from VCF Operations"
      kestra: "Docker, Kubernetes, air-gapped servers (Kestra Enterprise) or Kestra Cloud"
    - label: "License"
      competitor: "Part of VMware Cloud Foundation, a per-core subscription"
      kestra: "Apache 2.0; Kestra Enterprise is licensed per instance"

