commonQuestions:
  - question: "How does Kestra compare to VMware Aria Automation (vRA/vRO)?"
    answer: "VMware Aria Automation focuses on catalog-driven VM and service provisioning tightly coupled to vSphere infrastructure. Workflows in vRO are JavaScript-based with proprietary APIs, difficult to version, and prone to ambiguous error messages. Kestra replaces vRA/vRO with declarative YAML workflows that work across VMware, AWS, Azure, GCP, and Kubernetes—with proper Git integration, clear logs, and self-service Apps that don't require a proprietary portal. <a href='/stories/fortune-500-company'>A Fortune 500 manufacturer</a> replaced vRA/vRO with Kestra for better developer experience, clearer logs, and a separate control plane per security zone."
  - question: "Does Kestra support VMware vSphere integrations?"
    answer: "Yes. Kestra has native vSphere plugin support for VM lifecycle management—provisioning, snapshotting, resizing, and decommissioning. Combined with Terraform, Ansible, and PowerShell tasks in the same workflow, Kestra covers the vSphere operations teams script in vRO and extends them to the rest of your stack. You keep deep vSphere integration while gaining multi-cloud flexibility and a modern developer experience."
  - question: "How does Kestra handle self-service provisioning forms?"
    answer: "Kestra Apps provide dynamic, data-backed forms for self-service provisioning. Forms can be populated from APIs, CMDBs, or vCenter data—giving users dropdowns with live infrastructure data (available datastores, network segments, resource pools) rather than static values. Approval gates are inline YAML tasks that pause the workflow for human review before resources are created. Teams use <a href='/docs/enterprise/scalability/apps'>Apps</a> as their catalog, or keep the catalog in their existing portal, such as ServiceNow, and call a Kestra flow behind each item."
  - question: "What happens to existing vRO workflows when migrating to Kestra?"
    answer: "The Kestra Migration Assistant for vRA converts the structure of a vRO package (folder hierarchy to namespaces, configuration elements to the KV Store, SecureStrings to secrets) and rewrites the JavaScript as Kestra tasks, which an engineer then reviews and tests. Complex workflows are rewritten by hand. Kestra runs the conversion with your team wave by wave, and for very large estates a systems integrator can do the conversion work. <a href='/stories/fortune-500-company'>A Fortune 500 manufacturer</a> completed its migration roughly twelve months after the proof of concept began, running vRA and Kestra in parallel until each wave was verified. The <a href='/resources/migration/vra'>vRA to Kestra migration guide</a> covers the full method, and <a href='/blogs/leaving-vra-without-the-big-rewrite'>Leaving vRA without the big rewrite</a> walks through a sample migration brief."
  - question: "How does Kestra address the Broadcom/VMware pricing concern?"
    answer: "Since Broadcom's acquisition of VMware, many organizations have seen significant licensing cost increases. Kestra Enterprise is licensed by instance, so adding workflows does not change what you pay. Your automation also stops depending on your hypervisor vendor: workflows are YAML files in Git that run on any infrastructure, so you can move workloads to Nutanix, Proxmox, or a public cloud without rebuilding them. Your infrastructure vendor should not own your automation."
  - question: "Is Kestra suitable for air-gapped and regulated environments?"
    answer: "Yes. Kestra was designed for compliance-first deployments. It runs fully on-prem with no external dependencies, supports internal Postgres and S3-compatible storage, integrates with AD/OIDC for SSO, and works with enterprise secrets managers like CyberArk and HashiCorp Vault. Government customers like ITZBund and the Austrian Ministry of Defense chose Kestra specifically for its air-gap readiness and audit capabilities."
