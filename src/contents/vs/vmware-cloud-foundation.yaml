architecture:
  title: "How are VMware Aria Automation and Kestra built?"
  lead: "Aria Automation starts from a blueprint that a user requests from the catalog. Kestra starts from a flow that any trigger, form or API call can run."
  competitor:
    title: "Aria Automation: a catalog over vRO"
    text: "A blueprint is YAML that declares machines, networks and their inputs, and users request it from the catalog. Events from each deployment start vRO workflows through subscriptions, and vRO runs them as a graph of scriptable tasks and actions."
    list:
      - "Blueprints place machines through cloud zones and mappings"
      - "vRO plug-ins add the objects and actions for vCenter and other systems"
      - "Ansible job templates run as a resource inside a blueprint"
      - "Part of a VCF fleet, upgraded through VCF Operations"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file of tasks. The executor tracks each execution in Kestra's database and hands tasks to workers, which run Terraform, Ansible, scripts and API calls."
    list:
      - "Each plugin task is checked against its schema on save"
      - "Inputs come from the UI form, the API or your ITSM"
      - "Worker groups run tasks inside the network zone that needs them (Kestra Enterprise)"
      - "Script tasks run in containers, with dependencies per task"

compare:
  title: "What does the same VM request look like in each?"
  lead: "The same request in both: a hostname and a size as inputs, a vSphere VM on an existing network, and an Ansible baseline run on the new machine."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Aria Automation blueprint"
    file: "blueprint.yaml"
    lang: yaml
    code: |
      name: linux-web-vm
      version: 1
      formatVersion: 1
      inputs:
        hostname:
          type: string
          title: Hostname
        size:
          type: string
          enum:
            - small
            - medium
          default: small
      resources:
        web_vm:
          type: Cloud.vSphere.Machine
          properties:
            name: ${input.hostname}
            image: rhel9
            flavor: ${input.size}
            networks:
              - network: ${resource.app_net.id}
        app_net:
          type: Cloud.vSphere.Network
          properties:
            name: app-network
        baseline:
          type: Cloud.Ansible.Tower
          properties:
            host: ${resource.web_vm.*}
            account: aap-prod
            hostName: ${input.hostname}
            templates:
              provision:
                - name: linux-baseline
                  type: job
  kestra:
    code: |
      id: provision_linux_vm
      namespace: infra.vsphere

      inputs:
        - id: hostname
          type: STRING
        - id: size
          type: SELECT
          values: [small, medium]
          defaults: small

      tasks:
        - id: provision
          type: io.kestra.plugin.terraform.cli.TerraformCLI
          namespaceFiles:
            enabled: true
          env:
            TF_VAR_hostname: "{{ inputs.hostname }}"
            TF_VAR_size: "{{ inputs.size }}"
            VSPHERE_USER: "{{ secret('VSPHERE_USER') }}"
            VSPHERE_PASSWORD: "{{ secret('VSPHERE_PASSWORD') }}"
          beforeCommands:
            - terraform init
          commands:
            - terraform apply -auto-approve
            - terraform output -raw ip > inventory.ini
          outputFiles:
            - inventory.ini

        - id: configure
          type: io.kestra.plugin.ansible.cli.AnsibleCLI
          namespaceFiles:
            enabled: true
          inputFiles:
            inventory.ini: "{{ read(outputs.provision.outputFiles['inventory.ini']) }}"
          commands:
            - ansible-playbook -i inventory.ini linux-baseline.yml

pairs:
  - title: "How hard is it to move from VMware Aria Automation to Kestra?"
    columns:
      - label: "Leaving VMware Aria Automation"
        brand: competitor
        text: "vRO exports its workflows, actions and configuration elements as packages, and blueprints can live in Git as YAML. Most of the logic sits in JavaScript scriptable tasks that call vRO plug-in objects, so it has to be read and rewritten before it moves."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Each vRO workflow becomes a flow, actions become subflows or tasks, configuration elements become KV Store entries and SecureStrings become secrets. Blueprints that differ only in size or region fold into one flow with inputs. The <a href='/resources/migration/vra'>migration guide</a> plans the move in four stages, with vRA running until each wave is verified."
  - title: "How do VMware Aria Automation and Kestra compare on licensing, pricing and self-hosting?"
    columns:
      - label: "VMware Aria Automation"
        brand: competitor
        text: "Aria Automation now ships as VCF Automation, a component of VMware Cloud Foundation. VCF is a subscription licensed per core, with a minimum of 16 cores per CPU, and VCF Automation may only be used to manage VCF cores."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from VMware Aria Automation teams"

commonQuestions:
  - question: "Does Kestra work with vSphere?"
    answer: "Yes. The <a href='/plugins/plugin-ee-vmware'>VMware plugin</a> in Kestra Enterprise manages VM lifecycle, snapshots and templates across vCenter and ESXi, and can start flows on vCenter events such as a VM being created or powered off. In every edition, flows can also provision vSphere through Terraform and configure machines with Ansible."
  - question: "Can we keep ServiceNow as our catalog?"
    answer: "Yes. Many teams keep the catalog, approvals and CMDB in ServiceNow or BMC Helix, and the ITSM calls a Kestra flow where it used to call vRA. The ServiceNow plugin then updates the request or the CMDB record from inside the flow. Kestra Enterprise also offers Apps, which turn a flow into a self-service form for teams without an ITSM portal."
  - question: "Is there a tool that converts vRO workflows?"
    answer: "The Kestra Migration Assistant for vRA reads an exported vRO package on your own machine. Its <a href='/resources/migration/vra/assistant'>assessment</a> is free and open source, and lists what each workflow does, what starts it, the plugins that cover its integrations and a plan in waves. The conversion is run with your team, and an engineer reviews every converted flow before it replaces the vRO version."
  - question: "When do the licence savings start?"
    answer: "They start at the renewal date. Term licences don't refund mid-contract, so the wave plan is built backwards from that date. If VCF Automation comes inside a VCF subscription you keep for the hypervisor, check with procurement whether removing it changes the invoice. The <a href='/resources/migration/vra/payback'>payback calculator</a> works out both sides from your own numbers."
  - question: "How long does a vRA migration take?"
    answer: "It depends on how many workflows survive the inventory, since many are unused or near-duplicates. The Fortune 500 manufacturer in the <a href='/stories/fortune-500-company'>customer story</a> finished about twelve months after its proof of concept began, with vRA and Kestra running side by side until each wave was verified."
  - question: "Can Kestra run in segmented or air-gapped networks?"
    answer: "Yes. Kestra runs fully on-premises with no outbound connection. Worker groups in Kestra Enterprise place execution inside the network zone that requires it, and teams whose security rules forbid a shared control plane run one Kestra deployment per zone, as the Fortune 500 manufacturer did across four OT sites and IT."
  - question: "Where do credentials live?"
    answer: "Tasks read credentials with the secret() function. The open-source edition reads secrets from environment variables, and Kestra Enterprise reads them from the manager you already run, such as HashiCorp Vault, CyberArk or Delinea, so the SecureStrings kept in vRO can be retired."

