architecture:
  title: "How are Camunda and Kestra built?"
  competitor:
    title: "Camunda: BPMN on the Zeebe engine"
    text: "A process is a BPMN model deployed to the orchestration cluster. Zeebe moves each instance through the model and creates a job for every service task, which a job worker of that type activates, runs and completes."
    list:
      - "Workers poll for jobs by type and report complete or fail"
      - "Job delivery is at least once, so workers must be idempotent"
      - "A failed job with no retries left raises an incident"
      - "User tasks wait for people in Tasklist"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file of tasks that run in sequence, in parallel or in loops. The executor tracks state in Kestra's database and hands each task to a worker, which calls an API through a plugin or runs a script."
    list:
      - "Plugin tasks call APIs, databases and cloud services directly"
      - "Script tasks install their dependencies per task"
      - "Pause tasks wait for a person to resume with inputs"
      - "Every save creates a revision you can diff and roll back"

setup:
  title: "What does it take to get running?"
  lead: "Both projects ship a Docker Compose file for a first run."
  competitor:
    title: "Camunda"
    tag: "Development only"
    text: "Camunda's <a href='https://docs.camunda.io/docs/self-managed/quickstart/developer-quickstart/docker-compose/'>Docker Compose quickstart</a> starts the orchestration cluster and connectors with file-based H2 storage. Camunda describes these files as meant for local development and evaluation, and recommends Kubernetes with Helm for production."
    code: |
      curl -LO https://github.com/camunda/camunda-distributions/releases/download/docker-compose-8.10/docker-compose-8.10.zip
      unzip docker-compose-8.10.zip -d camunda
      cd camunda
      docker compose up -d
  kestra:
    title: "Kestra"
    tag: "Database included"
    text: "One Compose file starts Kestra and its Postgres database. Open localhost:8080, pick a blueprint and run it. Production runs the same image on Kubernetes with the <a href='/docs/installation/kubernetes'>Kestra Helm chart</a>."
    code: |
      curl -o docker-compose.yml https://raw.githubusercontent.com/kestra-io/kestra/develop/docker-compose.yml
      docker compose up

pairs:
  - title: "How hard is it to move from Camunda to Kestra?"
    columns:
      - label: "Leaving Camunda"
        brand: competitor
        text: "A Camunda process is a BPMN model plus the job workers that implement its service tasks, often in a separate codebase. User tasks, forms and DMN tables each need a decision in the new design."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Service tasks that call an API, a database or a script become plugin or script tasks, and the business logic in worker code moves into a script task. User tasks become Pause tasks with inputs. During the move, Kestra's Camunda trigger acts as a job worker, so a flow can implement a service task in a process that still runs on Camunda."
  - title: "What do licensing, pricing and self-hosting look like?"
    columns:
      - label: "Camunda"
        brand: competitor
        text: "The engine and web apps are source-available under the Camunda License v1. Local development and non-production use are free, and production self-hosting requires a Camunda Self-Managed Enterprise license. Camunda SaaS has a 30-day trial, and prices for both come from sales."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Camunda teams"

commonQuestions:
  - question: "Can Kestra replace Camunda?"
    answer: "For processes made of system work, such as API calls, data loads, file transfers and infrastructure changes, yes. For processes designed in BPMN and DMN with business analysts and run around assigned user tasks in Tasklist, Camunda is built for that job."
  - question: "Does Kestra support human-in-the-loop steps?"
    answer: "Yes. A Pause task stops the execution until someone resumes it from the UI or the API, optionally with typed inputs such as an approval flag and a reason. Kestra records who resumed it, and paused executions can be resumed in bulk. Kestra Enterprise adds Apps, which give business users forms and approval buttons without Kestra access."
  - question: "Can Kestra and Camunda run side by side?"
    answer: "Yes. Kestra's Camunda plugin deploys BPMN, DMN and form resources, starts and cancels process instances, and publishes correlation messages. Its trigger holds a job worker open and starts a flow for each job of a given type, and the flow reports the result with the CompleteJob or FailJob task."
  - question: "Do we still need job workers?"
    answer: "Not for Kestra flows. Plugin tasks call the systems directly, and custom logic runs in Python, Node.js, shell or other script tasks. Workers that serve processes still running on Camunda keep running until those processes move."
  - question: "How does Kestra handle audit and compliance requirements?"
    answer: "Each execution keeps its logs, inputs, outputs and the identity of whoever resumed a paused step. Kestra Enterprise adds audit logs, RBAC per namespace and SSO. Kestra Technologies holds a SOC 2 Type 2 report covering security, availability and confidentiality."
  - question: "How are flows versioned and deployed?"
    answer: "Each save creates a revision you can diff or roll back. Flows sync with Git, and the Terraform provider or a CI/CD pipeline such as GitHub Actions deploys them from a repository."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute and Kestra Enterprise reaches 7,000, with workers that scale horizontally."

