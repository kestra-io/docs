title: "Kestra vs Camunda: Orchestration Without BPMN"
description: "Compare Kestra and Camunda: BPMN processes with job workers vs YAML flows with built-in tasks, plus licensing, setup, migration and running both side by side."
competitorName: Camunda
category: Business Automation
shortDescription: "BPMN process orchestration with job workers vs. YAML flows where integrations and scripts are built-in tasks."

brandColor:
  color: "#FC5D0D"

intro:
  title: "Kestra vs. Camunda"
  description: "Camunda runs BPMN and DMN models on its Zeebe engine, with job workers and connectors doing the work of each service task. Kestra is an open-source orchestrator that runs YAML flows where plugins and scripts are the tasks."

choose:
  title: "Camunda or Kestra?"
  competitor:
    title: "Camunda is the better fit if"
    list:
      - "Business analysts and developers design processes together in BPMN and DMN, and the diagram is the shared specification."
      - "Your processes center on people, with user tasks assigned to groups, forms and a task list."
  kestra:
    title: "Choose Kestra if"
    list:
      - "Your workflows are mostly system work, such as data loads, API calls, scripts and infrastructure changes."
      - "You want integrations as built-in tasks, with no job worker to write, deploy and run for each service task."
      - "You want to self-host in production under Apache 2.0, with no license required."

table:
  title: "How do Camunda and Kestra compare, feature by feature?"
  rows:
    - label: "Workflow definition"
      competitor: "BPMN 2.0 XML, designed in Desktop or Web Modeler"
      kestra: "YAML flows, validated on save, edited as code or in the no-code editor"
    - label: "Doing the work"
      competitor: "Job workers you write and run, polling for each service task type, plus connectors"
      kestra: "{totalPlugins}+ plugins and script tasks run the work inside the flow"
    - label: "Custom code"
      competitor: "Runs in your job workers, outside the engine"
      kestra: "Python, SQL, shell, Node.js and more run as tasks with their own dependencies"
    - label: "People in the loop"
      competitor: "User tasks with assignees, candidate groups and forms, completed in Tasklist"
      kestra: "Pause tasks with typed inputs on resume; Apps with forms and approval buttons (Kestra Enterprise)"
    - label: "Decisions"
      competitor: "DMN decision tables"
      kestra: "If and Switch tasks with expressions"
    - label: "Failures"
      competitor: "Job retries, three by default; at zero retries an incident waits for someone to resolve it"
      kestra: "Retry policy per task or flow, plus errors, finally and afterExecution blocks"
    - label: "Local setup"
      competitor: "Camunda 8 Run or Docker Compose, both for development only"
      kestra: "Docker Compose for a first run; the same image runs in production on Kubernetes"
    - label: "Self-hosting in production"
      competitor: "Requires a Camunda Self-Managed Enterprise Edition license"
      kestra: "Free under Apache 2.0, or Kestra Enterprise with support"
    - label: "Hosted service"
      competitor: "Camunda SaaS, with a 30-day trial"
      kestra: "Kestra Cloud"
    - label: "License"
      competitor: "Camunda License v1 for the engine and web apps; Desktop Modeler under MIT"
      kestra: "Apache 2.0"

