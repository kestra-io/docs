architecture:
  title: "How are Apache NiFi and Kestra built?"
  competitor:
    title: "NiFi: flow-based data routing"
    text: "A flow is a graph of processors joined by connections that act as queues. The flow controller schedules each processor, FlowFiles carry content and attributes from one processor to the next, and repositories on disk record their state, content and provenance."
    list:
      - "FlowFile, content and provenance repositories persist on disk"
      - "Each connection can apply back pressure"
      - "Process groups bundle processors into larger components"
      - "Parameter contexts hold values shared across the instance"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file of tasks that run in sequence, in parallel or in loops, started by a trigger. The executor tracks state in Kestra's database and hands each task to a worker, which calls an API, moves a file or runs a script."
    list:
      - "Each execution has a start, an end and a final state"
      - "Files pass between tasks through internal storage"
      - "Realtime triggers start an execution for each queue message"
      - "Every save creates a revision you can diff and roll back"

setup:
  title: "What does it take to get Apache NiFi and Kestra running?"
  lead: "Both projects publish a Docker image for a first run."
  competitor:
    title: "Apache NiFi"
    tag: "Single node"
    text: "The <a href='https://hub.docker.com/r/apache/nifi'>apache/nifi image</a> starts one node with HTTPS on port 8443 and single-user login, with a password of at least 12 characters. The <a href='https://nifi.apache.org/nifi-docs/administration-guide.html'>administration guide</a> covers Java 21, clustering with ZooKeeper or Kubernetes, and security."
    code: |
      docker run --name nifi \
        -p 8443:8443 \
        -d \
        -e SINGLE_USER_CREDENTIALS_USERNAME=admin \
        -e SINGLE_USER_CREDENTIALS_PASSWORD=ctsBtRBKHRAx69EqUghvvgEvjnaLjFEB \
        apache/nifi:latest
  kestra:
    title: "Kestra"
    tag: "Database included"
    text: "One Compose file starts Kestra and its Postgres database. Open localhost:8080, pick a blueprint and run it. Production runs the same image on Kubernetes with the <a href='/docs/installation/kubernetes'>Kestra Helm chart</a>."
    code: |
      curl -o docker-compose.yml https://raw.githubusercontent.com/kestra-io/kestra/develop/docker-compose.yml
      docker compose up

pairs:
  - title: "How hard is it to move from Apache NiFi to Kestra?"
    columns:
      - label: "Leaving Apache NiFi"
        brand: competitor
        text: "A NiFi flow is a graph of configured processors, connections and parameter contexts built on the canvas. Its logic lives in processor settings and routing relationships, so each process group is rebuilt as a flow. Continuous routing with per-record provenance has no direct equivalent in Kestra."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Batch and event-driven work moves first. A scheduled fetch, a file pickup or a database load becomes a flow with a trigger and plugin tasks. Kestra's NiFi tasks start, stop and check process groups, so NiFi can keep the streaming parts while Kestra runs the jobs around them."
  - title: "How do Apache NiFi and Kestra compare on licensing, pricing and self-hosting?"
    lead: "Both projects are open source under Apache 2.0, and both run on your own infrastructure."
    columns:
      - label: "Apache NiFi"
        brand: competitor
        text: "Apache 2.0, governed by the Apache Software Foundation, and free to download. You run it yourself on Java 21, as a single node or a cluster."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Apache NiFi teams"

commonQuestions:
  - question: "Can Kestra replace NiFi for data ingestion?"
    answer: "For scheduled and event-triggered ingestion, yes. Plugins move data between object storage, databases, Kafka, SFTP and HTTP APIs, and a flow can run a script for anything else. For continuous routing of individual records with back pressure and per-record provenance, NiFi is built for that job."
  - question: "Can Kestra and NiFi work together?"
    answer: "Yes. Kestra's NiFi tasks start and stop a process group and read its status, and a NiFi trigger starts a flow when the bulletin board shows new bulletins at a chosen level. A common split is NiFi for collection and routing, and Kestra for the loads, transformations and alerts that follow."
  - question: "How does Kestra handle streaming data?"
    answer: "Realtime triggers listen to Kafka, SQS, MQTT and other systems and start an execution the moment a message arrives. Each message becomes its own execution with logs and outputs. Kestra runs work per event or per batch and leaves record-by-record stream processing to tools such as NiFi or Kafka."
  - question: "Does Kestra track data lineage?"
    answer: "Every execution keeps its logs, inputs, outputs and files. Kestra Enterprise and Kestra Cloud add assets, a record of the tables, files and infrastructure each flow reads and writes, from which Kestra builds lineage across flows."
  - question: "Do we need Java skills to build workflows in Kestra?"
    answer: "No. Flows are YAML, and custom logic runs as Python, SQL, shell, Node.js or other script tasks with their own dependencies. Java is only needed to write a new plugin."
  - question: "How are flows versioned and deployed?"
    answer: "Each save creates a revision you can diff or roll back. Flows sync with Git, and the Terraform provider or a CI/CD pipeline such as GitHub Actions deploys them from a repository."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute and Kestra Enterprise reaches 7,000, with workers that scale horizontally. FILA runs 2.5 million executions a month on Kestra."

