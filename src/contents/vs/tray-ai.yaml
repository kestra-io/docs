architecture:
  title: "How are Tray.ai and Kestra built?"
  competitor:
    title: "Tray.ai: workflows on a hosted iPaaS"
    text: "A workflow is a trigger followed by connector and script steps, grouped into projects and run on Tray's cloud. Each trigger firing, step and loop pass counts as a task, Tray's unit of usage."
    list:
      - "Callable triggers let one workflow call another"
      - "Data storage keeps values between runs"
      - "Projects move between workspaces as JSON exports"
      - "Authentications are mapped on each import"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file. Kestra validates it against each plugin's schema when you save it, and workers run its tasks on Kestra Cloud or on your own servers."
    list:
      - "Subflows let one flow call another with typed inputs"
      - "The KV Store keeps values between executions"
      - "Namespace files hold the scripts and SQL that flows share"
      - "Script tasks run in containers with their own dependencies"

pairs:
  - title: "How hard is it to move from Tray.ai to Kestra?"
    columns:
      - label: "Leaving Tray.ai"
        brand: competitor
        text: "Projects and workflows export as JSON that holds their structure. Data table rows, vector table contents, APIM policies and roles stay behind, and the JSON is Tray's own format, so each workflow is rebuilt in the target tool."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Each trigger becomes a Kestra trigger, each connector step a plugin task or an HTTP request, and each script step a script task in the same language. Data storage values move to the KV Store. Projects move one at a time while Tray runs the rest."
  - title: "What do licensing, pricing and self-hosting look like?"
    columns:
      - label: "Tray.ai"
        brand: competitor
        text: "A proprietary hosted platform with three iPaaS plans, Pro, Team and Enterprise, each quoted by sales. Usage is billed in tasks, retries aren't charged, and there are no per-user or per-connection fees. Tray hosts it in US, EU or APAC regions."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Tray.ai teams"

commonQuestions:
  - question: "Can Kestra call the apps my Tray workflows use?"
    answer: "Kestra has {totalPlugins}+ plugins for databases, cloud services, messaging and SaaS tools. An app without a plugin is an HTTP task against its REST API, with the credentials kept in Kestra secrets. List the connectors your projects use and check each one against Kestra's plugins before you plan the move."
  - question: "Can Kestra and Tray.ai run side by side?"
    answer: "Yes. A Tray workflow with a webhook trigger can be started from a Kestra HTTP task, and a Tray HTTP step can call a Kestra Webhook trigger. Move one project at a time and keep the others running in Tray until they're replaced."
  - question: "Can I build Kestra flows from a coding assistant?"
    answer: "Yes. Flows are YAML files, so Claude Code, Cursor or any coding assistant can write them, and the Kestra Docs MCP server gives the assistant live plugin schemas and blueprints. In the UI, the AI Copilot drafts and edits flows from a plain-language request."
  - question: "Can people who don't write YAML use Kestra?"
    answer: "Yes. The no-code editor builds flows on a visual canvas and stays in sync with the YAML. Flows with inputs can be run from the UI as forms, and Apps (Kestra Enterprise) put a custom screen with forms and approval buttons in front of a flow."
  - question: "How does Kestra control what an AI agent can do?"
    answer: "An AIAgent task reaches only the tools listed in its definition, such as specific flows, web search or an MCP server. Every agent run is an execution with its logs, outputs and inputs, and RBAC (Kestra Enterprise) decides who can edit or run the flow."
  - question: "How does Kestra Cloud pricing compare with Tray tasks?"
    answer: "Tray counts the trigger, each step and each loop pass as a task. Kestra Cloud counts task runs: triggers and flow-control tasks such as Loop, If and Parallel aren't counted, while each task inside a loop counts once per iteration and each retry attempt counts. Kestra Open Source is free to self-host."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute and Kestra Enterprise reaches 7,000, with workers that scale horizontally. Fila runs 2.5 million executions a month across more than 2,000 workflows."

