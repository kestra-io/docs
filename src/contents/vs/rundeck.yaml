architecture:
  title: "How are Rundeck and Kestra built?"
  lead: "Rundeck sends each job step to the nodes a filter selects. Kestra runs each task on a worker, which reaches the systems it needs."
  competitor:
    title: "Rundeck: jobs dispatched to nodes"
    text: "A job is a list of steps with options and a node filter. The Rundeck server matches the filter against its node inventory and runs each node step through a node executor, SSH by default."
    list:
      - "Node sources build the inventory, including from Ansible"
      - "Strategies run steps node-first, sequentially or in parallel"
      - "ACL policy files grant actions per project"
      - "An embedded H2 database starts by default; production needs an external one"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file of tasks that run in sequence, in parallel or in loops. The executor tracks state in Kestra's database and hands each task to a worker, which runs a script, opens an SSH session or calls an API."
    list:
      - "Each plugin task is checked against its schema on save"
      - "Script tasks install their dependencies per task"
      - "Worker groups place workers next to the hosts they manage (Kestra Enterprise)"
      - "Every save creates a revision you can diff and roll back"

compare:
  title: "What does the same runbook look like in each?"
  lead: "The same runbook in both: restart a service on each web server in turn, check that it is active, retry on failure and email the team if it still fails."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "Rundeck job"
    file: "restart-web-service.yaml"
    lang: yaml
    code: |
      - name: restart-web-service
        group: ops/runbooks
        description: Restart a service on the web nodes and check that it is active
        loglevel: INFO
        retry:
          retry: '2'
          delay: 1m
        options:
        - name: service
          required: true
          enforced: true
          values:
          - nginx
          - haproxy
        nodefilters:
          dispatch:
            threadcount: 1
            keepgoing: false
          filter: 'tags: web'
        sequence:
          keepgoing: false
          strategy: node-first
          commands:
          - exec: sudo systemctl restart ${option.service}
          - exec: systemctl is-active ${option.service}
        notification:
          onfailure:
            email:
              recipients: ops@example.com
              subject: restart-web-service failed
  kestra:
    code: |
      id: restart_web_service
      namespace: ops.runbooks

      inputs:
        - id: service
          type: SELECT
          values: [nginx, haproxy]
        - id: hosts
          type: ARRAY
          itemType: STRING

      retry:
        type: constant
        interval: PT1M
        maxAttempts: 3

      tasks:
        - id: each_host
          type: io.kestra.plugin.core.flow.Loop
          concurrencyLimit: 1
          values: "{{ inputs.hosts }}"
          tasks:
            - id: restart
              type: io.kestra.plugin.fs.ssh.Command
              host: "{{ item.value }}"
              username: "{{ secret('SSH_USER') }}"
              password: "{{ secret('SSH_PASSWORD') }}"
              commands:
                - sudo systemctl restart {{ inputs.service }}
                - systemctl is-active {{ inputs.service }}

      errors:
        - id: email_on_failure
          type: io.kestra.plugin.email.MailSend
          host: smtp.example.com
          from: kestra@example.com
          to: ops@example.com
          subject: "restart_web_service failed: {{ execution.id }}"

setup:
  title: "What does it take to get running?"
  lead: "Both projects start from a Docker image for a first run."
  competitor:
    title: "Rundeck"
    tag: "Embedded database"
    text: "Rundeck's <a href='https://docs.rundeck.com/docs/administration/install/docker.html'>Docker guide</a> starts the open-source image with one command. On first start Rundeck creates an embedded H2 database, which its install guide says is not supported in production, so a production install needs an external database such as MySQL."
    code: |
      docker run --name some-rundeck -p 4440:4440 \
        -v data:/home/rundeck/server/data rundeck/rundeck:6.3.0
  kestra:
    title: "Kestra"
    tag: "Database included"
    text: "One Compose file starts Kestra and its Postgres database. Open localhost:8080, pick a blueprint and run it. Production runs the same image on Kubernetes with the <a href='/docs/installation/kubernetes'>Kestra Helm chart</a>."
    code: |
      curl -o docker-compose.yml https://raw.githubusercontent.com/kestra-io/kestra/develop/docker-compose.yml
      docker compose up

pairs:
  - title: "How hard is it to move from Rundeck to Kestra?"
    columns:
      - label: "Leaving Rundeck"
        brand: competitor
        text: "Jobs export as YAML, so the commands, scripts and options are easy to read out. Node filters, node sources and ACL policies are Rundeck concepts with no direct equivalent, so each job's targets and permissions need a new home."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Command and script steps become shell, SSH or PowerShell tasks, options become inputs, job references become subflows and Ansible steps become Ansible tasks. While jobs move in waves, a Kestra HTTP task can start an existing job through Rundeck's API."
  - title: "What do licensing, pricing and self-hosting look like?"
    lead: "Both projects have an Apache 2.0 open-source edition you can run on your own infrastructure."
    columns:
      - label: "Rundeck"
        brand: competitor
        text: "Rundeck Community is Apache 2.0 and free to self-host. PagerDuty sells the commercial edition as Runbook Automation, as a SaaS service or self-hosted, with clustering, conditional logic steps, project schedules and certified plugins. PagerDuty publishes no price for it."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Rundeck teams"

commonQuestions:
  - question: "What is Rundeck used for?"
    answer: "Rundeck runs operational jobs, such as scripts, commands and Ansible playbooks, on an inventory of nodes over SSH or WinRM, so operators can launch runbooks from a web UI or an API with access control. PagerDuty maintains it: Rundeck Community is open source, and Runbook Automation is the commercial edition. Kestra runs the same runbooks as tasks in YAML flows, and adds event triggers, data passed between tasks and workflows beyond operations."
  - question: "Is Rundeck still open source?"
    answer: "Yes. Rundeck Community, often called Rundeck OSS, is on GitHub under the Apache 2.0 license and maintained by PagerDuty. PagerDuty's commercial edition, Runbook Automation, is a separate paid product built on it."
  - question: "Can Kestra import Rundeck job definitions?"
    answer: "Not directly. Export your jobs as YAML with the rd CLI or the Rundeck API, then hand them to the AI Copilot, or to your own coding assistant through the Kestra MCP server, to draft flows that an engineer reviews before they run."
  - question: "How does Kestra handle a node inventory?"
    answer: "Kestra has no node model. Pass hosts as flow inputs, read them from a CMDB or cloud API in an earlier task, or keep your Ansible inventory and run playbooks with the Ansible task. A Loop task then runs the same steps on each host, one at a time or in parallel."
  - question: "Can operators still run jobs on demand from a form?"
    answer: "Yes. A flow's inputs become a form in the Kestra UI, with select, multi-select and other input types, and a Pause task waits for someone to approve before the next step runs. Kestra Enterprise adds Apps, which turn a flow into a self-service page for people who don't use the Kestra UI."
  - question: "Does Kestra work with Windows servers?"
    answer: "Yes. PowerShell tasks run on a Windows worker, which joins a worker group in Kestra Enterprise, and SSH tasks reach any host that runs an SSH server."
  - question: "How are passwords and SSH keys stored?"
    answer: "Tasks read credentials with the secret() function. The open-source edition reads secrets from environment variables, and Kestra Enterprise adds namespace-level secrets and external managers such as HashiCorp Vault and Azure Key Vault."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute, and Kestra Enterprise reaches 7,000 a minute. Workers scale horizontally, and Fila runs 2.5 million executions a month on Kestra."

