architecture:
  title: "How are Azure Data Factory and Kestra built?"
  lead: "Both run a graph of steps with dependencies. ADF spreads a pipeline across several resource types, while a Kestra flow keeps its tasks, inputs and triggers in one file."
  competitor:
    title: "Azure Data Factory: activities and linked services"
    text: "A pipeline is a JSON list of activities joined by dependency conditions. Linked services hold the connections, datasets describe the data, and an integration runtime runs each copy or hands the activity to another compute service."
    list:
      - "Dependency paths fire on success, failure, completion or skip"
      - "Triggers are separate resources that reference pipelines"
      - "Three integration runtimes: Azure, self-hosted and Azure-SSIS"
      - "A default soft limit of 120 activities per pipeline"
  kestra:
    title: "Kestra: one file per flow"
    text: "A flow lists its tasks, inputs, triggers and error handlers in YAML. Workers run plugin tasks and scripts, and pass files from task to task through internal storage on Blob Storage, S3, GCS or local disk."
    list:
      - "Tasks run in sequence, with Parallel, Switch, Loop and Dag tasks for branching"
      - "An errors block handles a failure anywhere in the flow"
      - "Namespaces group flows, files and secrets per team"
      - "Script tasks run in containers with their own dependencies"

compare:
  title: "What does the same copy pipeline look like in each?"
  lead: "The same pipeline in both: copy an orders table from SQL Server to Parquet in Blob Storage, run a merge stored procedure, and post to Teams if either step fails."
  cta:
    label: "Get started with Kestra"
    href: "/get-started"
  competitor:
    label: "ADF pipeline"
    file: "orders_daily.json"
    lang: json
    code: |
      {
        "name": "orders_daily",
        "properties": {
          "activities": [
            {
              "name": "CopyOrders",
              "type": "Copy",
              "inputs": [{ "referenceName": "SqlServerOrders", "type": "DatasetReference" }],
              "outputs": [{ "referenceName": "BlobOrdersParquet", "type": "DatasetReference" }],
              "typeProperties": {
                "source": { "type": "SqlSource", "sqlReaderQuery": "SELECT * FROM dbo.orders" },
                "sink": { "type": "ParquetSink" }
              },
              "policy": { "retry": 2, "retryIntervalInSeconds": 300 }
            },
            {
              "name": "MergeOrders",
              "type": "SqlServerStoredProcedure",
              "dependsOn": [{ "activity": "CopyOrders", "dependencyConditions": ["Succeeded"] }],
              "linkedServiceName": { "referenceName": "Warehouse", "type": "LinkedServiceReference" },
              "typeProperties": { "storedProcedureName": "dbo.usp_merge_orders" }
            },
            {
              "name": "AlertTeams",
              "type": "WebActivity",
              "dependsOn": [{ "activity": "MergeOrders", "dependencyConditions": ["Failed", "Skipped"] }],
              "typeProperties": {
                "method": "POST",
                "url": "https://example.webhook.office.com/webhookb2/orders-alerts",
                "body": { "text": "orders_daily failed" }
              }
            }
          ]
        }
      }
  kestra:
    code: |
      id: orders_daily
      namespace: company.finance

      tasks:
        - id: extract_orders
          type: io.kestra.plugin.jdbc.sqlserver.Query
          url: "{{ secret('SOURCE_JDBC_URL') }}"
          sql: SELECT * FROM dbo.orders
          fetchType: STORE
          retry:
            type: constant
            interval: PT5M
            maxAttempts: 3

        - id: to_parquet
          type: io.kestra.plugin.serdes.parquet.IonToParquet
          from: "{{ outputs.extract_orders.uri }}"

        - id: upload_orders
          type: io.kestra.plugin.azure.storage.blob.Upload
          endpoint: https://examplestorage.blob.core.windows.net
          connectionString: "{{ secret('AZURE_STORAGE_CONNECTION_STRING') }}"
          container: raw
          name: orders/orders.parquet
          from: "{{ outputs.to_parquet.uri }}"

        - id: merge_orders
          type: io.kestra.plugin.jdbc.sqlserver.Queries
          url: "{{ secret('WAREHOUSE_JDBC_URL') }}"
          sql: EXEC dbo.usp_merge_orders

      errors:
        - id: alert_teams
          type: io.kestra.plugin.microsoft365.teams.TeamsIncomingWebhook
          url: "{{ secret('TEAMS_WEBHOOK_URL') }}"
          payload: '{"text": "orders_daily failed: {{ execution.id }}"}'

pairs:
  - title: "How hard is it to move from Azure Data Factory to Kestra?"
    columns:
      - label: "Leaving Azure Data Factory"
        brand: competitor
        text: "A pipeline depends on linked services, datasets, integration runtimes and triggers defined as separate resources, and its expressions use ADF functions such as @pipeline() and @activity(). Mapping data flows and SSIS packages have no direct Kestra equivalent, so they are rebuilt or left running in ADF."
      - label: "Moving to Kestra"
        brand: kestra
        text: "A Copy activity becomes a query or download task followed by an upload, a stored procedure becomes a SQL task, and dependency conditions become task order and an errors block. Pipeline parameters become flow inputs. While you migrate, a flow can start existing ADF pipelines with the Data Factory CreateRun task."
  - title: "What do licensing, pricing and self-hosting look like?"
    columns:
      - label: "Azure Data Factory"
        brand: competitor
        text: "A proprietary Azure service with no self-hosted version, billed on use. Orchestration is charged per 1,000 activity runs, data movement per DIU-hour, data flows per vCore-hour, and pipelines with no trigger and no runs in a month carry an inactive pipeline charge. Compute that external activities run on, such as Databricks or a SQL database, is billed by that service."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Azure Data Factory teams"

commonQuestions:
  - question: "Microsoft points ADF users to Fabric. How does Kestra fit?"
    answer: "Microsoft describes Data Factory in Microsoft Fabric as the next generation of Azure Data Factory and publishes an upgrade guide for existing pipelines. Fabric keeps the work on Microsoft's platform. Kestra runs the same pipelines on Azure, another cloud or on-premises, and can trigger your current ADF pipelines while you move them."
  - question: "Can Kestra connect to Azure services?"
    answer: "Yes. Plugins cover Blob Storage, Data Lake Storage, Synapse, Event Hubs, Service Bus, Azure Batch and the Azure CLI, and SQL Server and Azure SQL connect over JDBC. Kestra itself runs on AKS or an Azure VM, with Azure Database for PostgreSQL and Blob Storage as its backends."
  - question: "What happens to our SSIS packages?"
    answer: "Kestra has no SSIS runtime. Packages that must run unchanged can stay on the Azure-SSIS integration runtime, started by a Kestra flow through the ADF pipeline that wraps them. Packages you rebuild become SQL, Python or dbt tasks."
  - question: "How does Kestra reach on-premises databases?"
    answer: "Run a Kestra worker inside the private network, or the whole instance there, and tasks connect to the databases directly. In Kestra Enterprise, worker groups route chosen tasks to the workers in a given network, the role a self-hosted integration runtime plays in ADF."
  - question: "How do ADF parameters and expressions map to Kestra?"
    answer: "Pipeline parameters become flow inputs and pipeline variables become flow variables. References to earlier results, such as @activity('CopyOrders').output, become Pebble expressions that read the outputs of an earlier task by its ID."
  - question: "Where do connection strings and keys live?"
    answer: "In Kestra secrets, referenced with the secret() function. Kestra Enterprise can read them from Azure Key Vault, the same store many ADF linked services point to."
  - question: "How many pipelines can one Kestra instance run?"
    answer: "Workers scale horizontally. Kestra's <a href='/docs/performance/benchmark'>benchmark</a> measures 4,000 executions a minute for the open-source edition on Postgres and 7,000 a minute for Kestra Enterprise."

