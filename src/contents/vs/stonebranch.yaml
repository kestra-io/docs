architecture:
  title: "How are Stonebranch and Kestra built?"
  lead: "Stonebranch decides what runs in a central controller and sends the work to agents on your hosts. Kestra stores each workflow as a YAML file and hands its tasks to workers."
  competitor:
    title: "Stonebranch: controller and agents"
    text: "Universal Controller is a Java web application on Tomcat that stores tasks, workflows and triggers in a MySQL, SQL Server or Oracle database and decides when they run. It sends work to Universal Agents on each host through the Universal Message Service (OMS)."
    list:
      - "Two or more controller nodes form a high-availability cluster"
      - "OMS servers hold messages between the controller and agents"
      - "Universal Agents run on Linux/Unix, Windows and z/OS"
      - "The Workflow Editor sets the dependencies between tasks"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file of tasks, triggers and error handlers. The executor tracks state in Kestra's database and hands each task to a worker, which calls an API or runs a script."
    list:
      - "Plugin tasks call databases, file servers, clouds and SaaS APIs"
      - "Script tasks install their dependencies per task"
      - "Worker groups run tasks inside a given network (Kestra Enterprise)"
      - "Every save creates a revision you can diff and roll back"

pairs:
  - title: "How hard is it to move from Stonebranch to Kestra?"
    columns:
      - label: "Leaving Stonebranch"
        brand: competitor
        text: "Tasks, workflows and triggers live in the Universal Controller database and are edited in its web interface. Each task's agent, each workflow's dependencies and each trigger's conditions have to be mapped before the work moves, and SAP or PeopleSoft tasks need a Kestra plugin or API call in their place."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Scripts run unchanged in shell, Python or PowerShell tasks. Each workflow becomes a flow, each task a Kestra task, each cron or time trigger a Schedule trigger and each file monitor a file trigger. Stonebranch keeps running until the last workflow moves."
  - title: "What do licensing, pricing and self-hosting look like?"
    columns:
      - label: "Stonebranch"
        brand: competitor
        text: "Proprietary and priced by task executions. Self-managed and SaaS editions are quoted on request."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Stonebranch teams"

commonQuestions:
  - question: "Can Kestra and Stonebranch run side by side?"
    answer: "Yes. Move workflows in waves, starting with new work and low-risk workflows. A Stonebranch Web Service task can start a Kestra flow by calling its Webhook trigger, so one scheduler can hand work to the other until the last workflow moves."
  - question: "Can Kestra convert Stonebranch workflows to YAML?"
    answer: "Partly. Describe a workflow and its tasks to the AI Copilot, or hand them to your own coding assistant through the Kestra MCP server, and it drafts a flow for an engineer to review. Composite triggers and agent assignments need a decision during that review."
  - question: "Do we still need agents on every host?"
    answer: "Usually not. Most tasks reach a database, file server or API over the network from a Kestra worker. Commands that must run on a given machine can go over SSH with the SSH Command task, and worker groups (Kestra Enterprise) place workers inside the networks that need them."
  - question: "How do Stonebranch triggers map to Kestra?"
    answer: "Cron and time triggers become Schedule triggers, with when expressions for weekends, public holidays and working days. Agent file monitors become SFTP, S3 or other file triggers, email monitors become mail triggers, and a flow trigger starts a flow when another one ends."
  - question: "What about z/OS and IBM i jobs?"
    answer: "Kestra has no z/OS or IBM i task type. That work can stay on Stonebranch while Linux, Windows and cloud workflows move, and a Stonebranch task can call a Kestra webhook to start what follows."
  - question: "How does Kestra handle access control and audit?"
    answer: "Namespaces separate each team's flows, files and secrets. Kestra Enterprise adds RBAC, SSO through OIDC or LDAP, SCIM provisioning and audit logs, and reads secrets from HashiCorp Vault, AWS Secrets Manager, Azure Key Vault or Google Secret Manager."
  - question: "How are flows versioned and deployed?"
    answer: "Each save creates a revision you can diff or roll back. Flows sync with Git, and the Terraform provider or a CI/CD pipeline such as GitHub Actions deploys them from a repository."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres runs 4,000 executions a minute and Kestra Enterprise reaches 7,000, with workers that scale horizontally. Leroy Merlin France runs more than 5,000 flows on Kestra."

