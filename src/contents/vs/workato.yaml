architecture:
  title: "How are Workato and Kestra built?"
  competitor:
    title: "Workato: recipes on a hosted platform"
    text: "A recipe is a trigger followed by steps, configured in Workato's editor. Each trigger event becomes a job that runs the steps in Workato's cloud, and an on-prem agent opens an outbound connection to reach systems behind your firewall."
    list:
      - "Triggers poll an app, listen for its events or run on a schedule"
      - "IF, Repeat for each and Repeat while steps shape the logic"
      - "Call recipe function steps reuse other recipes"
      - "Recipe lifecycle management moves packages between environments"
  kestra:
    title: "Kestra: declarative flows"
    text: "A flow is a YAML file. Kestra validates it against each plugin's schema when you save it, and workers run its tasks on Kestra Cloud or on your own servers."
    list:
      - "If, Loop, Parallel and Pause tasks shape the logic"
      - "Subflows reuse other flows with typed inputs"
      - "Script tasks run in containers with their own dependencies"
      - "Outputs and files are stored once and passed by reference"

pairs:
  - title: "How hard is it to move from Workato to Kestra?"
    columns:
      - label: "Leaving Workato"
        brand: competitor
        text: "Recipe lifecycle management exports recipes as packages with their dependencies, such as connections, lookup tables and message templates. Workato treats the exported files as snapshots for re-import and advises against editing them outside Workato, so each recipe is rebuilt in the target tool."
      - label: "Moving to Kestra"
        brand: kestra
        text: "Each trigger becomes a Kestra trigger, each connector action a plugin task or an HTTP request, and each Handle errors block a retry policy with an errors block. Python steps move into script tasks with their libraries. Recipes move one at a time while Workato keeps running the rest."
  - title: "What do licensing, pricing and self-hosting look like?"
    columns:
      - label: "Workato"
        brand: competitor
        text: "A proprietary platform sold in four editions: Standard, Business MCP, Enterprise MCP and Workato ONE. Prices aren't published, so each edition is quoted by sales. Workspaces and users are unlimited, and usage is tracked per capability."
      - label: "Kestra"
        brand: kestra
        text: "Apache 2.0 and free to self-host, with no limits on flows or executions. Kestra Cloud is billed on usage, and Kestra Enterprise is licensed per instance. Both are on the <a href='/pricing'>pricing page</a>."

faqTitle: "Questions from Workato teams"

commonQuestions:
  - question: "Can Kestra call the SaaS apps my recipes use?"
    answer: "Kestra has {totalPlugins}+ plugins for databases, cloud services, messaging and SaaS tools. For an app without a plugin, an HTTP task calls its REST API, with the credentials kept in Kestra secrets. Workato has pre-built connectors for thousands of apps, so check each one your recipes depend on against Kestra's plugins before you plan the move."
  - question: "Can Kestra and Workato run side by side?"
    answer: "Yes. A Workato recipe can start from an HTTP webhook, so a Kestra HTTP task can call it, and a recipe can call a Kestra Webhook trigger the same way. Move recipes one at a time and keep the rest in Workato until they're replaced."
  - question: "Can business users build and run flows without writing YAML?"
    answer: "Yes. The no-code editor builds flows on a visual canvas and stays in sync with the YAML, and the AI Copilot drafts a flow from a plain-language request. Flows with inputs can be run from the UI by people who never open the editor, and Apps (Kestra Enterprise) put a form or an approval button in front of a flow."
  - question: "How does Kestra handle approvals in the middle of a process?"
    answer: "A Pause task stops the execution until someone resumes it, from the UI or through the API, and the flow carries on with the next task. Apps (Kestra Enterprise) give the approver a screen that shows the request and the buttons to approve or reject it."
  - question: "Does Kestra run AI agents?"
    answer: "Yes. The AIAgent task gives a model a goal and the tools to reach it, including other flows and external MCP servers. A flow can also be exposed as an MCP tool, so Claude, Cursor or another agent can call it. Each agent run is an execution with its logs and outputs, next to the rest of your flows."
  - question: "Can Kestra reach systems behind our firewall?"
    answer: "Yes. When you self-host Kestra, its workers run inside your network and connect to databases, file shares and internal APIs directly. With worker groups (Kestra Enterprise), you choose which workers run which tasks, so a task that needs a private network runs only where that network is."
  - question: "How far does Kestra scale?"
    answer: "In Kestra's <a href='/docs/performance/benchmark'>benchmark</a>, the open-source edition on Postgres sustains 4,000 executions a minute and Kestra Enterprise reaches 7,000, with workers that scale horizontally. Fila runs 2.5 million executions a month across more than 2,000 workflows."

