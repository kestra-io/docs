<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" width="880" height="520" aria-labelledby="glTitle glDesc">
  <title id="glTitle">The three layers of AI workflow governance</title>
  <desc id="glDesc">Three layers of AI workflow governance: the model layer governs what AI may produce, the identity layer governs what agents may reach, and the execution layer governs what generated logic does when it runs. Most organisations implement the first two and stop.</desc>

  <defs>
    <linearGradient id="glExec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8c4bff"/>
      <stop offset="100%" stop-color="#6117ff"/>
    </linearGradient>
    <style>
      .lbl   { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .tag   { font-size: 12px; font-weight: 700; letter-spacing: .14em; }
      .items { font-size: 14.5px; }
      .role  { font-size: 13.5px; font-style: italic; }
      .stopl { font-size: 13px; font-weight: 600; letter-spacing: .02em; }
      .muted-tag   { fill: #6b7280; }
      .muted-items { fill: #3f3f46; }
      .muted-role  { fill: #71717a; }
      .on-accent      { fill: #ffffff; }
      .on-accent-soft { fill: #ede9fe; }
      @media (prefers-color-scheme: dark) {
        .muted-tag   { fill: #a1a1aa; }
        .muted-items { fill: #e4e4e7; }
        .muted-role  { fill: #a1a1aa; }
        .card-bg     { fill: #18181b; stroke: #3f3f46; }
        .stop-txt    { fill: #a1a1aa; }
        .arrow       { stroke: #52525b; }
        .arrow-head  { fill: #52525b; }
      }
    </style>
    <marker id="glArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" class="arrow-head" fill="#a1a1aa"/>
    </marker>
  </defs>

  <!-- LAYER 1: MODEL -->
  <g class="lbl">
    <rect class="card-bg" x="90" y="24" width="700" height="112" rx="14" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5"/>
    <text class="tag muted-tag" x="118" y="56">MODEL LAYER</text>
    <text class="items muted-items" x="118" y="84">AI gateways · system prompts · prompt constraints · PII redaction</text>
    <text class="role muted-role" x="118" y="110">What AI may produce</text>
  </g>

  <line class="arrow" x1="440" y1="136" x2="440" y2="172" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#glArrow)"/>

  <!-- LAYER 2: IDENTITY -->
  <g class="lbl">
    <rect class="card-bg" x="90" y="172" width="700" height="112" rx="14" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5"/>
    <text class="tag muted-tag" x="118" y="204">IDENTITY LAYER</text>
    <text class="items muted-items" x="118" y="232">Agent identity · entitlements · access review · credential lifecycle</text>
    <text class="role muted-role" x="118" y="258">What agents may reach</text>
  </g>

  <!-- STOP MARKER -->
  <g class="lbl">
    <line x1="90" y1="316" x2="322" y2="316" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="5 5"/>
    <line x1="558" y1="316" x2="790" y2="316" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text class="stopl stop-txt" x="440" y="321" text-anchor="middle" fill="#71717a">most organisations stop here</text>
  </g>

  <line class="arrow" x1="440" y1="332" x2="440" y2="366" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#glArrow)"/>

  <!-- LAYER 3: EXECUTION -->
  <g class="lbl">
    <rect x="90" y="366" width="700" height="130" rx="14" fill="url(#glExec)"/>
    <text class="tag on-accent-soft" x="118" y="400">EXECUTION LAYER</text>
    <text class="items on-accent" x="118" y="429">Versioning · scoped credentials · environment isolation</text>
    <text class="items on-accent" x="118" y="452">Approval gates · immutable audit · replay</text>
    <text class="role on-accent-soft" x="118" y="478">What generated logic does when it runs</text>
  </g>
</svg>
