title: "Install Plugins Only When You Use them: Auto Install + Download"
description: "The default image bundles every plugin at its latest version, which pushes it past 3GB. In 2.0 every tag has a -slim twin, so you start from a lean core and plugins auto install when you save a flow that uses them."
