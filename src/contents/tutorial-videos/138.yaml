title: "Turn Any Kestra Flow Into an MCP Tool"
description: "Any Kestra flow can now register as a named tool on an MCP server. An AI agent sends a tool call, Kestra creates an execution with the matched inputs, runs the flow and returns the outputs, with no custom API or polling loop in between."
