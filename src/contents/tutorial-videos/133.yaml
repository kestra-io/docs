title: "Kestra 2.0 Is Coming: Orchestrate Anywhere"
description: "Modern infrastructure doesn't live in one place. It spans clouds, regions, and increasingly, fully air-gapped networks. Kestra 2.0 meets it there. The queue backend is pluggable and independent of the database, and workers are stateless, talking to the control plane over gRPC secured with mTLS instead of reaching into the database directly."
