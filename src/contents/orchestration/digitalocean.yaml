faq:
  - question: "Does Kestra replace DigitalOcean?"
    answer: "No. DigitalOcean keeps running your droplets, managed databases, Kubernetes clusters, and DNS zones. Kestra drives the DigitalOcean API through the <code>io.kestra.plugin.digitalocean</code> plugin to sequence those primitives into operations: provision, wait, act, verify, tear down. Think of it as the scheduler and event layer the control panel never shipped."
  - question: "How does Kestra authenticate to DigitalOcean?"
    answer: "With a personal access token from the API section of the DigitalOcean control panel, scoped to read plus write for the resource types your flows touch. Store it in Kestra's secret backend and set it once via <code>pluginDefaults</code> on the <code>io.kestra.plugin.digitalocean</code> group, so no task in the flow repeats credentials."
  - question: "How does a flow know when a droplet is actually ready?"
    answer: "<code>droplet.Create</code> returns while the machine still reports <code>new</code>. Wrap <code>droplet.Get</code> in a <code>LoopUntil</code> task with a condition on <code>status == 'active'</code>, an interval, and <code>failOnMaxReached: true</code>. The boot becomes a synchronous step that either succeeds with a public IP available in outputs or fails the run loudly at the deadline."
  - question: "Can Kestra react when someone creates a droplet outside our provisioning process?"
    answer: "Yes. <code>droplet.Trigger</code> polls the account on an interval, keeps a watermark of seen droplet IDs, and fires one execution per new machine with its name, region, status, and creation time as trigger variables. Governance flows check naming rules or region allowlists and respond with a reversible <code>POWER_OFF</code>, a Slack review request, or both."
  - question: "Is resizing a managed database through Kestra safe?"
    answer: "The blueprint pattern adds the guardrails the raw API call lacks: a <code>database.Get</code> pre-check refuses to act unless the cluster reports <code>online</code>, and after <code>database.Resize</code> a <code>LoopUntil</code> polls until the migration completes, with a ceiling that fails the run instead of succeeding silently. Brief connection interruptions during the migration are a DigitalOcean property, so schedule the change outside critical batch windows."
  - question: "What about Spaces, DigitalOcean's object storage?"
    answer: "Spaces is S3-compatible, so it works today through Kestra's S3-compatible storage tasks (for example the <code>io.kestra.plugin.minio</code> group pointed at your Spaces endpoint, such as <code>nyc3.digitaloceanspaces.com</code>): list, upload, download, delete, and trigger on new objects. Pair it with the DigitalOcean plugin in the same flow to process files on an ephemeral droplet."
  - question: "Can Kestra orchestrate DOKS, DigitalOcean's managed Kubernetes?"
    answer: "Yes, from both sides. <code>kubernetes.Create</code>, <code>Get</code>, <code>List</code>, and <code>Delete</code> manage the cluster lifecycle, and <code>kubernetes.GetKubeconfig</code> downloads the kubeconfig into Kestra's internal storage, ready for the <a href='/orchestration/kubernetes'>Kubernetes</a> plugin or <code>kubectl</code> in a script task. Ephemeral staging clusters follow the same create, use, destroy pattern as ephemeral droplets."
  - question: "Is the DigitalOcean plugin Enterprise-only?"
    answer: "No. <code>io.kestra.plugin.digitalocean</code> ships in the open-source edition with every task and the droplet trigger: droplets, databases, volumes, load balancers, Kubernetes clusters, firewalls, domains, and DNS records. Kestra Enterprise adds Apps for self-service forms, namespace-scoped RBAC, audit logs, and SSO on top."

