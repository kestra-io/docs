    - feature: "Wait until a droplet is actually active"
      kestra: "✓ LoopUntil polls droplet.Get, fails loudly on timeout"
      values:
        - "Watch the spinner"
        - "Hand-rolled sleep loop"
        - "Provider waits, but only inside apply"
    - feature: "Scheduled managed database resize"
      kestra: "✓ Schedule + Resize + poll until online, per-trigger sizes"
      values:
        - "One-off manual action"
        - "doctl resize in cron, no completion check"
        - "Plan/apply per change, no calendar"
    - feature: "Tag-filtered fleet snapshots with dated names"
      kestra: "✓ List + ForEach + Action SNAPSHOT, per-droplet isolation"
      values:
        - "Weekly built-in backups, fixed cadence, no tag filter"
        - "Custom script with pagination and retries"
        - "Not an operations tool"
    - feature: "React when a droplet appears on the account"
      kestra: "✓ droplet.Trigger fires one execution per new machine"
      values:
        - "Nothing reacts"
        - "Diff two doctl outputs yourself"
        - "Detects drift only when you run plan"
    - feature: "DNS cutover with duplicate cleanup and verification"
      kestra: "✓ record List + Delete + Create + Get in one execution"
      values:
        - "Console edits with an unbounded delete-create window"
        - "Sequential doctl calls, no rollback story"
        - "Records as state, cutover as a config edit"
    - feature: "Whole-account inventory on a schedule"
      kestra: "✓ Seven parallel List tasks, totals-only mode, Slack digest"
      values:
        - "Seven console pages"
        - "Custom script + Slack plumbing"
        - "State file lists managed resources only"
    - feature: "Chain DigitalOcean with Ansible, Kubernetes, Postgres, Slack"
      kestra: "✓ Outputs flow between plugins in one execution history"
      values:
        - "No chain"
        - "Custom glue per pair"
        - "Provider per tool, no runtime semantics"
