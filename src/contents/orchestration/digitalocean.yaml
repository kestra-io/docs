title: "Orchestrate DigitalOcean with Kestra: droplets, databases, DNS, Kubernetes"
description: "Drive DigitalOcean droplets, managed databases, DNS, firewalls, and DOKS from event-driven flows. Ephemeral compute, scheduled resizes, snapshot policies, and account governance in one place."

tool:
  name: "DigitalOcean"
  pluginClass: "io.kestra.plugin.digitalocean.droplet.Create"
  color: "#0080FF"

hero:
  title: "Automate DigitalOcean droplets, databases, and DNS from flows."
  description: "Provision a droplet per batch job and destroy it even when the job fails. Resize managed Postgres for business hours and back down at night. Snapshot the fleet by tag, catch shadow droplets minutes after they appear, and cut DNS over to the new environment as one audited operation."
  cta:
    label: "Book a Demo"
    href: "/demo"
  secondaryCta:
    label: "Get Started"
    href: "/get-started"

nutshell: "Connect DigitalOcean to a workflow engine that treats the whole account as orchestrable: droplets, managed databases, block storage, load balancers, Kubernetes clusters, firewalls, and DNS zones. Kestra chains them with <a href='/orchestration/ansible'>Ansible</a> runs, <a href='/orchestration/kubernetes'>Kubernetes</a> deploys, <a href='/orchestration/postgres'>Postgres</a> jobs, and <a href='/orchestration/slack'>Slack</a> signals, with retries, polling, and guaranteed teardown that doctl scripts and console clicks never give you."

pillars:
  title: "Above the DigitalOcean control panel."
  subtitle: "DigitalOcean gives you clean primitives at a fair price. Kestra gives those primitives an operations brain: sequencing, polling, event reactions, teardown guarantees, and an audit trail across every resource type on the account."
  items:
    - icon: "mdi:rocket-launch-outline"
      title: "Ephemeral droplets with guaranteed teardown"
      description: "A flow provisions a droplet with <code>droplet.Create</code>, injects the job through cloud-init <code>userData</code>, and destroys it in a <code>finally</code> block that runs whether the job succeeded, failed, or timed out. A crashed workload never leaves a forgotten VM billing by the hour, which is exactly what happens when the same pattern is a shell script that dies halfway."
    - icon: "mdi:database-arrow-up-outline"
      title: "Managed database capacity as code"
      description: "<code>database.Resize</code> returns immediately while the migration runs in the background. Kestra wraps it with a <code>database.Get</code> health pre-check, a <code>LoopUntil</code> poll that only succeeds when the cluster reports <code>online</code> again, and per-trigger inputs so one flow scales Postgres up at 06:00 and down at 20:00. DigitalOcean has no native scheduled resize at all."
    - icon: "mdi:shield-search"
      title: "An event trigger for the whole account"
      description: "<code>droplet.Trigger</code> polls the account and fires one execution per droplet it has never seen, exposing its name, region, status, and creation time. That turns the public API into an event source for governance: naming policy checks, region allowlists, cost alerts, all reacting minutes after someone clicks Create Droplet outside your provisioning process."
    - icon: "mdi:content-save-cog-outline"
      title: "Tag-driven fleet operations"
      description: "<code>droplet.List</code> returns every droplet with its tags; a <code>ForEach</code> with bounded concurrency walks the fleet and acts per machine. Snapshot everything tagged <code>auto-backup</code> with a dated name, power off everything tagged <code>ephemeral</code> after hours. New machines join the policy by adding one tag, not by editing a server list."
    - icon: "mdi:dns-outline"
      title: "DNS cutover as a deploy step"
      description: "<code>domain.record.List</code>, <code>Delete</code>, <code>Create</code>, and <code>Get</code> compose into a blue-green cutover: remove every stale A record for the hostname, write the low-TTL replacement, read it back to verify what the zone actually serves. The dangerous window between delete and create becomes seconds inside one execution instead of an unlogged console session."
    - icon: "mdi:chart-box-outline"
      title: "Whole-account inventory in seven API calls"
      description: "Every resource group ships a <code>List</code> task with <code>fetchType</code> control: <code>NONE</code> for counts, <code>FETCH</code> for rows, <code>STORE</code> for ion files ready for <a href='/orchestration/duckdb'>DuckDB</a>. A weekly parallel sweep counts droplets, volumes, databases, load balancers, DOKS clusters, firewalls, and domains, and posts one Slack digest before the invoice surprises anyone."

useCases:
  title: "How teams use DigitalOcean and Kestra"
  subtitle: "Patterns platform teams run in production today. Each one shows the flow end to end, with the real plugin classes in play."
  items:
    - badge: "Burst compute"
      badgeIcon: "mdi:rocket-launch-outline"
      title: "Provision a droplet per batch job, destroy it even when the job fails"
      description: "The flow creates a droplet named after the execution ID, polls <code>droplet.Get</code> until DigitalOcean reports it <code>active</code>, locks it down with a per-run firewall, and runs the workload injected via cloud-init. Teardown of both firewall and droplet lives in a <code>finally</code> block, so no failure path leaks a paid VM."
      flow:
        - node: "create droplet"
          label: "cloud-init userData"
          pluginClass: "io.kestra.plugin.digitalocean.droplet.Create"
        - node: "wait until active"
          label: "LoopUntil + Get"
          pluginClass: "io.kestra.plugin.core.flow.LoopUntil"
        - node: "lock down"
          label: "per-run firewall"
          pluginClass: "io.kestra.plugin.digitalocean.firewall.Create"
        - node: "teardown"
          label: "finally block"
          pluginClass: "io.kestra.plugin.digitalocean.droplet.Delete"
      items:
        - title: "Pay for minutes, not idle days"
          description: "The droplet exists only for the duration of one execution, sized per run through flow inputs."
        - title: "Boot handled as a synchronous step"
          description: "LoopUntil polls every 10 seconds and fails the run if the droplet is not active within 10 minutes."
        - title: "Teardown survives every failure mode"
          description: "The finally block deletes firewall and droplet on success, crash, or timeout, skipping unused resources."
          wide: true
    - badge: "Cost control"
      badgeIcon: "mdi:database-arrow-up-outline"
      title: "Scale managed Postgres up for business hours, down for the night"
      description: "Two schedules pass different size slugs into one flow. It refuses to act unless <code>database.Get</code> reports the cluster <code>online</code>, submits <code>database.Resize</code>, then polls until the migration completes. The Slack confirmation means the change actually landed, not that an API call returned 202."
      flow:
        - node: "schedule"
          label: "06:00 up / 20:00 down"
          pluginClass: "io.kestra.plugin.core.trigger.Schedule"
        - node: "health pre-check"
          label: "refuse if not online"
          pluginClass: "io.kestra.plugin.digitalocean.database.Get"
        - node: "resize"
          label: "size + node count"
          pluginClass: "io.kestra.plugin.digitalocean.database.Resize"
        - node: "wait until online"
          label: "poll the migration"
          pluginClass: "io.kestra.plugin.core.flow.LoopUntil"
        - node: "confirm"
          label: "Slack"
          pluginClass: "io.kestra.plugin.slack.notifications.SlackIncomingWebhook"
      items:
        - title: "Vertical scaling on a calendar"
          description: "The sizing policy lives in version-controlled YAML with per-trigger inputs, not in a console reminder."
        - title: "No stacked operations"
          description: "A Fail task stops the run when the cluster is already resizing, instead of stacking a second operation."
        - title: "Completion is verified, not assumed"
          description: "Polling continues until status returns online, with a ceiling that fails loudly, not silently."
          wide: true
    - badge: "Backups"
      badgeIcon: "mdi:content-save-cog-outline"
      title: "Snapshot every droplet tagged auto-backup, nightly, with dated names"
      description: "A nightly schedule lists the whole fleet, walks it with a concurrency limit of 2 to respect API rate limits, and fires <code>droplet.Action</code> with <code>SNAPSHOT</code> for each machine carrying the tag. Snapshot names embed the date, so retention tooling sorts and expires them without guesswork."
      flow:
        - node: "nightly schedule"
          label: "cron 01:00"
          pluginClass: "io.kestra.plugin.core.trigger.Schedule"
        - node: "list fleet"
          label: "rows with tags"
          pluginClass: "io.kestra.plugin.digitalocean.droplet.List"
        - node: "ForEach droplet"
          label: "tag check per machine"
          pluginClass: "io.kestra.plugin.core.flow.ForEach"
        - node: "snapshot"
          label: "dated name"
          pluginClass: "io.kestra.plugin.digitalocean.droplet.Action"
        - node: "report"
          label: "Slack summary"
          pluginClass: "io.kestra.plugin.slack.notifications.SlackIncomingWebhook"
      items:
        - title: "Opt-in by tag, not by list"
          description: "New machines join the backup policy by adding the auto-backup tag. No server inventory file goes stale."
        - title: "Per-droplet failure isolation"
          description: "Each snapshot is its own task run inside the ForEach; one API error leaves every other backup untouched."
        - title: "A silent night without backups cannot happen"
          description: "A distinct alert fires when listing or snapshotting fails, separate from the nightly summary heartbeat."
          wide: true
    - badge: "Governance"
      badgeIcon: "mdi:shield-search"
      title: "Power off shadow droplets minutes after they appear"
      description: "<code>droplet.Trigger</code> fires an execution for every new droplet on the account. A naming rule checks the first hyphen-separated segment against approved prefixes; violations get <code>POWER_OFF</code> rather than deletion, so a mis-named machine keeps its disk and can be revived after review."
      flow:
        - node: "new droplet detected"
          label: "polling trigger"
          pluginClass: "io.kestra.plugin.digitalocean.droplet.Trigger"
        - node: "naming policy"
          label: "If on trigger.name"
          pluginClass: "io.kestra.plugin.core.flow.If"
        - node: "contain"
          label: "POWER_OFF action"
          pluginClass: "io.kestra.plugin.digitalocean.droplet.Action"
        - node: "review queue"
          label: "Slack with identity"
          pluginClass: "io.kestra.plugin.slack.notifications.SlackIncomingWebhook"
      items:
        - title: "Detection whoever created it"
          description: "Console click, doctl, or API script: any new droplet is seen within one polling interval."
        - title: "Containment that is reversible"
          description: "Power off preserves the disk. A false positive costs a rename and a restart, not a restore from backup."
        - title: "An audit trail for free"
          description: "Compliant droplets get a log line, so history records everything that ever joined the account."
          wide: true
    - badge: "Deploys"
      badgeIcon: "mdi:dns-outline"
      title: "Cut DNS to the new environment, verified, with rollback bounded by TTL"
      description: "The flow lists the zone, deletes every existing A record for the hostname including accidental duplicates, creates the replacement pointing at the new environment with a 300 second TTL, then reads the record back so the Slack announcement quotes what DigitalOcean actually serves. A failed half-applied cutover pages the team immediately."
      flow:
        - node: "list zone"
          label: "find stale records"
          pluginClass: "io.kestra.plugin.digitalocean.domain.record.List"
        - node: "delete stale"
          label: "per-record ForEach"
          pluginClass: "io.kestra.plugin.digitalocean.domain.record.Delete"
        - node: "create record"
          label: "TTL 300"
          pluginClass: "io.kestra.plugin.digitalocean.domain.record.Create"
        - node: "verify"
          label: "read back from API"
          pluginClass: "io.kestra.plugin.digitalocean.domain.record.Get"
        - node: "announce"
          label: "Slack"
          pluginClass: "io.kestra.plugin.slack.notifications.SlackIncomingWebhook"
      items:
        - title: "Duplicates handled, not fatal"
          description: "Zones accumulate duplicate A records from manual edits; the delete loop clears them all first."
        - title: "Verification before victory"
          description: "The announcement quotes the record read back from the API, not the flow's inputs."
        - title: "Rollback is the same flow"
          description: "Re-run with the previous IP as input. The 300 second TTL bounds how long clients keep the old answer."
          wide: true

