    - name: "Business-hours database resize"
      blueprintId: "digitalocean-database-business-hours-resize"
      title: "Scheduled vertical scaling for managed Postgres with completion polling"
      description: "Two schedules pass different target sizes into one flow. A health pre-check refuses to stack operations, database.Resize submits the migration, and LoopUntil polls until the cluster reports online again before Slack gets the confirmation."
      href: "/blueprints?tags=cloud"
    - name: "New droplet governance guard"
      blueprintId: "digitalocean-new-droplet-governance-guard"
      title: "React to every new droplet, power off the ones violating naming policy"
      description: "The droplet trigger fires per new machine on the account. Names failing the approved-prefix rule get a reversible POWER_OFF and a Slack review request with full identity; compliant machines leave an audit log line behind."
      href: "/blueprints?tags=cloud"

