  lead: "Production-ready flows from the catalog. Copy the YAML, set your API token, ship."
  items:
    - name: "Ephemeral droplet runner"
      blueprintId: "digitalocean-ephemeral-droplet-runner"
      title: "A droplet per batch job, with guaranteed teardown in a finally block"
      description: "Creates a droplet with the job injected through cloud-init, polls until active with LoopUntil, applies a per-run SSH firewall, and destroys both resources in a finally block that runs on success and failure alike. Region, size, image, and admin CIDR are flow inputs."
