faq:
  - question: "What's the best orchestrator for Databricks?"
    answer: "It depends on where the pipeline lives. If every step runs inside the Databricks workspace, Lakeflow Jobs (formerly Databricks Workflows) is the simplest choice. When the pipeline also involves ingestion tools, other warehouses, dbt, infrastructure or business systems, an external orchestrator fits better. Kestra does this in declarative YAML with native Databricks tasks; Airflow and Dagster do it in Python."
  - question: "What is the difference between Databricks Lakeflow Jobs and Kestra?"
    answer: "Lakeflow Jobs schedules and runs tasks inside one Databricks workspace. Kestra runs above it: it submits Databricks runs, waits for them, and chains them with steps Databricks does not run, such as Airbyte syncs, dbt builds, Terraform, ServiceNow tickets or Slack alerts, with one execution history across all of them. Kestra works with Databricks, not instead of it."
  - question: "Which Databricks task types can Kestra run?"
    answer: "The <code>SubmitRun</code> and <code>CreateJob</code> tasks accept notebook, Spark Python, Spark JAR, Spark Submit, Python wheel and pipeline tasks. The plugin also runs SQL on clusters and SQL warehouses, the Databricks CLI, cluster creation and deletion, Unity Catalog operations, Lakebase queries and Genie questions."
  - question: "Can Kestra trigger a flow when a Databricks table changes?"
    answer: "Yes. The <code>io.kestra.plugin.databricks.unitycatalog.table.Trigger</code> polls a Unity Catalog schema and starts a flow for tables created or updated since the previous check, and the Lakebase trigger starts a flow when a SQL query returns rows."
  - question: "How do I avoid paying for idle Databricks clusters?"
    answer: "Create the cluster in the flow with <code>CreateCluster</code>, run the job on it, and delete it with <code>DeleteCluster</code> at the end, including when the job fails. A separate scheduled flow can list clusters still running outside working hours and alert or terminate them."
  - question: "Does Kestra replace Databricks?"
    answer: "No. Databricks keeps running the compute, the notebooks and the SQL warehouse. Kestra decides when Databricks work runs and connects it to the rest of the stack. Kestra is open source under Apache 2.0, runs self-hosted on Docker or Kubernetes or on Kestra Cloud, and has no dependency on Databricks to run."

