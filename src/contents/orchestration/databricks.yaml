title: "Databricks Orchestration: Run Databricks Jobs from Kestra"
description: "Orchestrate Databricks jobs, SQL and Unity Catalog from one YAML flow: submit runs and wait, gate on data quality, use ephemeral clusters, and chain Databricks with ingestion, dbt and alerts."

tool:
  name: "Databricks"
  pluginClass: "io.kestra.plugin.databricks.job.SubmitRun"
  category: "Data"
  color: "#FF3621"

hero:
  title: "Orchestrate Databricks jobs across your whole stack."
  description: "Databricks runs the compute. Kestra decides when a run starts, what feeds it, what checks it, and what runs next. Submit Databricks runs from a YAML flow, wait for them, gate on SQL checks, and chain them with ingestion, dbt and alerting in one execution history."
  cta:
    label: "Book a Demo"
    href: "/demo"
  secondaryCta:
    label: "Get Started"
    href: "/get-started"

answer:
  question: "How do you orchestrate Databricks jobs with Kestra?"
  text: "Kestra orchestrates Databricks from outside the workspace. A YAML flow submits a Databricks run with the <code>SubmitRun</code> task, waits for it to finish, runs SQL checks on a SQL warehouse, and chains the result with ingestion, dbt and alerting. Flows start on a schedule, a file arrival, a new Unity Catalog table or an API call."

updated: 2026-10-29

howTo:
  title: "How do I orchestrate a Databricks job with Kestra?"
  intro: "Four steps take a Databricks job from a manual run to a scheduled, checked and alerted pipeline. The flow below puts them together."
  steps:
    - title: "Store the Databricks credentials as secrets"
      description: "Save the workspace host and a personal access token (or an OAuth M2M service principal) as Kestra secrets, so no credential appears in the flow YAML."
    - title: "Submit the run and wait for it"
      description: "Use <code>io.kestra.plugin.databricks.job.SubmitRun</code> with an existing cluster or a cluster created in the same flow. <code>waitForCompletion</code> keeps the task running until Databricks reports a terminal state, and the run ID and console URL become task outputs."
    - title: "Gate on a data quality query"
      description: "Run a check with <code>io.kestra.plugin.databricks.sql.Query</code> on a SQL warehouse. If the query returns bad rows, a <code>Fail</code> task stops the flow before anything downstream reads the table."
    - title: "Schedule it and alert on failure"
      description: "Add a <code>Schedule</code> trigger, or start the flow on an event such as a new Unity Catalog table, an S3 file or a webhook. An <code>errors</code> branch posts to Slack with the execution ID when any step fails."
  flow:
    caption: "A complete flow: daily Databricks run, data quality gate, Slack alert on failure."
    code: |
      id: databricks_daily_orders
      namespace: company.data

      tasks:
        - id: transform
          type: io.kestra.plugin.databricks.job.SubmitRun
          host: "{{ secret('DATABRICKS_HOST') }}"
          authentication:
            token: "{{ secret('DATABRICKS_TOKEN') }}"
          runName: "daily-orders-{{ execution.id }}"
          runTasks:
            - existingClusterId: "{{ secret('DATABRICKS_CLUSTER_ID') }}"
              taskKey: transform_orders
              sparkPythonTask:
                pythonFile: /Shared/transform_orders.py
                sparkPythonTaskSource: WORKSPACE
          waitForCompletion: PT1H
          retry:
            type: constant
            interval: PT5M
            maxAttempts: 2

        - id: quality_check
          type: io.kestra.plugin.databricks.sql.Query
          host: "{{ secret('DATABRICKS_HOST') }}"
          httpPath: "{{ secret('DATABRICKS_SQL_HTTP_PATH') }}"
          accessToken: "{{ secret('DATABRICKS_TOKEN') }}"
          sql: |
            SELECT order_id
            FROM main.sales.orders
            WHERE order_date = current_date() AND amount IS NULL

        - id: stop_on_bad_rows
          type: io.kestra.plugin.core.execution.Fail
          condition: "{{ outputs.quality_check.size > 0 }}"
          errorMessage: "{{ outputs.quality_check.size }} orders without amount for today"

      errors:
        - id: alert
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {"text": "Databricks pipeline {{ flow.id }} failed: execution {{ execution.id }}"}

      triggers:
        - id: daily
          type: io.kestra.plugin.core.trigger.Schedule
          cron: "0 6 * * *"

nutshell: "Databricks Lakeflow Jobs schedule work inside the workspace. Kestra covers everything around it: it starts Databricks runs when upstream data is ready, runs SQL quality gates before anyone reads the result, creates and deletes clusters per run, and chains Databricks with <a href='/orchestration/airbyte'>Airbyte</a> ingestion, <a href='/orchestration/dbt-core'>dbt</a> transforms and <a href='/orchestration/slack'>Slack</a> alerts in one flow. Databricks keeps doing the compute; Kestra gives one execution history across every tool."

pillars:
  title: "Above the Databricks job scheduler."
  subtitle: "Databricks runs the notebooks, the Spark code and the SQL warehouse. Kestra runs the steps around them: what triggers a run, what it depends on, which checks it must pass, and where the cross-tool audit trail lives."
  items:
    - icon: "mdi:play-circle-outline"
      title: "Submit runs and wait, without duplicates"
      description: "<code>SubmitRun</code> sends one or more tasks (notebook, Spark Python, Spark JAR, Spark Submit, Python wheel or pipeline) as a Databricks run and waits for a terminal state. The submission is idempotent: if the Kestra worker is lost mid-run, the resubmitted task adopts the run already in flight instead of launching a second one."
    - icon: "mdi:lightning-bolt-outline"
      title: "Event-driven starts, inside and outside Databricks"
      description: "Start a flow when a new table appears in a Unity Catalog schema with the <code>unitycatalog.table.Trigger</code>, when a Lakebase query returns rows, or on events Databricks does not see: an S3 file, a Kafka message, a webhook, or another flow finishing."
    - icon: "mdi:pipe-disconnected"
      title: "One pipeline across ingestion, Databricks and dbt"
      description: "Ingestion with <a href='/orchestration/airbyte'>Airbyte</a>, the Databricks run, a <a href='/orchestration/dbt-core'>dbt</a> build and a notification run as ordered steps of one flow. A failed dbt step retries on its own; the Databricks run does not start again."
    - icon: "mdi:server-minus"
      title: "Ephemeral clusters per run"
      description: "<code>CreateCluster</code> provisions a cluster, the job runs on it, and <code>DeleteCluster</code> removes it in the same flow, so compute exists only for the job. A scheduled audit flow can also find clusters left running outside working hours."
    - icon: "mdi:shield-check-outline"
      title: "SQL quality gates before downstream reads"
      description: "<code>sql.Query</code> runs checks on a cluster or SQL warehouse and returns the row count. A <code>Fail</code> or <code>If</code> task turns that result into a gate, so a bad load stops the pipeline instead of reaching dashboards."
    - icon: "mdi:database-lock-outline"
      title: "Unity Catalog as code"
      description: "Create and update catalogs, schemas, volumes and grants from a flow, read table metadata, and run compliance checks on permissions on a schedule. Every change lands in the execution history with the run that made it."

useCases:
  title: "How data teams use Databricks and Kestra"
  subtitle: "Patterns data platform teams run in production. Each one shows the flow end to end, with the real plugin classes in play."
  items:
    - badge: "Full pipeline"
      badgeIcon: "mdi:pipe-disconnected"
      title: "Ingest, transform in Databricks, then run dbt"
      description: "<a href='/orchestration/airbyte'>Airbyte</a> loads raw data, Kestra submits the Databricks transformation and waits for it, then runs <a href='/orchestration/dbt-core'>dbt</a> on the curated tables. Slack confirms or alerts. Each step retries on its own."
      flow:
        - node: "airbyte sync"
          label: "ingest"
          pluginClass: "io.kestra.plugin.airbyte.connections.Sync"
        - node: "databricks run"
          label: "transform"
          pluginClass: "io.kestra.plugin.databricks.job.SubmitRun"
        - node: "dbt build"
          label: "models"
          pluginClass: "io.kestra.plugin.dbt.cli.DbtCLI"
        - node: "notify"
          label: "Slack"
          pluginClass: "io.kestra.plugin.slack.notifications.SlackIncomingWebhook"
      items:
        - title: "Run ID passed forward"
          description: "The Databricks run ID and console URL are task outputs available to every later step."
        - title: "Per-step retries"
          description: "A dbt failure retries dbt only; the Databricks run is not resubmitted."
        - title: "One execution history"
          description: "Ingestion, compute and transformation share one execution ID and one log."
          wide: true
    - badge: "Cost control"
      badgeIcon: "mdi:server-minus"
      title: "Ephemeral cluster for each run"
      description: "Create a cluster sized for the job, run the job on it, and delete the cluster when the job ends, even if the job fails, so no cluster is left running between runs."
      flow:
        - node: "schedule"
          label: "nightly"
          pluginClass: "io.kestra.plugin.core.trigger.Schedule"
        - node: "create cluster"
          label: "per run"
          pluginClass: "io.kestra.plugin.databricks.cluster.CreateCluster"
        - node: "run job"
          label: "wait"
          pluginClass: "io.kestra.plugin.databricks.job.CreateJob"
        - node: "delete cluster"
          label: "always"
          pluginClass: "io.kestra.plugin.databricks.cluster.DeleteCluster"
      items:
        - title: "Cluster ID as an output"
          description: "The job runs on the cluster the previous task created."
        - title: "Cleanup on failure"
          description: "The delete step runs even when the job fails."
        - title: "Audit idle clusters"
          description: "A scheduled flow lists clusters still running outside working hours."
          wide: true
    - badge: "Event-driven"
      badgeIcon: "mdi:lightning-bolt-outline"
      title: "React to a new Unity Catalog table"
      description: "The Unity Catalog table trigger polls a schema and starts the flow when a table appears. The flow reads its metadata, runs a validation query and posts the result."
      flow:
        - node: "table trigger"
          label: "new table"
          pluginClass: "io.kestra.plugin.databricks.unitycatalog.table.Trigger"
        - node: "get table"
          label: "schema"
          pluginClass: "io.kestra.plugin.databricks.unitycatalog.table.Get"
        - node: "validate"
          label: "SQL check"
          pluginClass: "io.kestra.plugin.databricks.sql.Query"
        - node: "notify"
          label: "Slack"
          pluginClass: "io.kestra.plugin.slack.notifications.SlackIncomingWebhook"
      items:
        - title: "No polling script"
          description: "The trigger stores the tables it has already seen in the KV Store."
        - title: "Create or update"
          description: "React to new tables, updated tables, or both."
        - title: "Typed metadata"
          description: "Column definitions come from the Get task, ready for checks."
          wide: true

